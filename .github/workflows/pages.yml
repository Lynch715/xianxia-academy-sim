# 部署到 GitHub Pages
#
# 2.0 不再有构建步骤：根目录的 index.html 就是成品。
# 推 main 时先用假模型跑一遍端到端自测，过了再发。旧版 1.7.1 以 v1.html 一起发出去，老存档还能接着玩。

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 装测试依赖
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: 端到端自测（假模型）
        run: node test/run.js

      - name: 整局自动跑到结业（假模型）
        run: node test/full.js

      - name: 手机五个尺寸遮挡检查
        run: node test/mobile.js

      - name: 收拾要发布的文件
        run: |
          mkdir -p _site
          cp index.html v1.html manifest.webmanifest .nojekyll _site/
          cp -r assets _site/
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
