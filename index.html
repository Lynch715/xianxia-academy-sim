/* ===== ui/theme.js — DOM 微框架与主题工具 ===== */
(function (G) {
  'use strict';

  /** 极简 createElement：h('div.cls', {attr}, children) */
  function h(tag, props, ...kids) {
    let cls = '', id = '';
    const m = String(tag).match(/^([a-zA-Z0-9]+)?((?:[.#][\w-]+)*)$/);
    let name = 'div';
    if (m) {
      name = m[1] || 'div';
      (m[2] || '').split(/(?=[.#])/).forEach(x => {
        if (x.startsWith('.')) cls += (cls ? ' ' : '') + x.slice(1);
        else if (x.startsWith('#')) id = x.slice(1);
      });
    }
    const el = document.createElement(name);
    if (cls) el.className = cls;
    if (id) el.id = id;

    if (props && typeof props === 'object' && !(props instanceof Node) && !Array.isArray(props)) {
      for (const k in props) {
        const v = props[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className += (el.className ? ' ' : '') + v;
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k === 'html') el.innerHTML = v;
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (k in el && k !== 'list') { try { el[k] = v; } catch (e) { el.setAttribute(k, v); } }
        else el.setAttribute(k, v);
      }
    } else if (props != null) {
      kids.unshift(props);
    }

    const add = c => {
      if (c == null || c === false || c === true) return;
      if (Array.isArray(c)) return c.forEach(add);
      el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
    };
    kids.forEach(add);
    return el;
  }

  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
  function mount(el, ...kids) { clear(el); kids.forEach(k => k && el.appendChild(k)); return el; }
  function qs(sel, root) { return (root || document).querySelector(sel); }

  const Theme = {
    h, clear, mount, qs,

    /** 按所属学院切换主题色 */
    applyCollege(id) {
      const c = G.State.COLLEGES[id];
      if (!c) return;
      document.documentElement.style.setProperty('--accent', c.ink || c.color);
    },

    /** 时段 → stage class */
    phaseClass(s) {
      if (s.time.phase === 'dawn') return 'dawn';
      if (s.time.phase === 'noon') return 'noon';
      return 'dusk';
    },

    /** 资源路径，缺图时返回 null 让调用方走占位 */
    sceneURL(id) { return `assets/scenes/${id}.webp`; },
    portraitURL(npcId, expr) { return `assets/portraits/${npcId}_${expr || 'calm'}.webp`; },

    /** 图片存在性缓存 —— 美术资源没到位时不刷控制台 */
    _imgCache: {},
    testImage(url) {
      if (this._imgCache[url] !== undefined) return Promise.resolve(this._imgCache[url]);
      return new Promise(res => {
        const img = new Image();
        img.onload = () => { this._imgCache[url] = true; res(true); };
        img.onerror = () => { this._imgCache[url] = false; res(false); };
        img.src = url;
      });
    },

    /**
     * 立绘逐级回退：请求的表情 → calm → 没有。
     * 这样美术可以一批一批交，先有 calm 就能上，后续补表情不用改代码。
     */
    async resolvePortrait(npcId, expr) {
      const tries = expr && expr !== 'calm'
        ? [this.portraitURL(npcId, expr), this.portraitURL(npcId, 'calm')]
        : [this.portraitURL(npcId, 'calm')];
      for (const u of tries) {
        if (await this.testImage(u)) return u;
      }
      return null;
    },

    /** 把纯文本按空行切成段落 */
    paragraphs(text) {
      return String(text || '').split(/\n{2,}/).map(p => p.trim()).filter(Boolean);
    },

    toast(msg, tone) {
      const el = h('div', {
        style: {
          position: 'fixed', left: '50%', bottom: '38px', transform: 'translateX(-50%)',
          background: tone === 'danger' ? 'var(--cinnabar)' : 'var(--ink)',
          color: 'var(--paper)', padding: '9px 20px', borderRadius: '3px',
          fontSize: '14px', zIndex: 200, boxShadow: 'var(--shadow)',
          opacity: '0', transition: 'opacity .25s'
        }
      }, msg);
      document.body.appendChild(el);
      requestAnimationFrame(() => el.style.opacity = '1');
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2400);
    },

    modal(title, sub, body, actions) {
      const mask = h('.modal-mask', {
        onclick: e => { if (e.target === mask) close(); }
      });
      const close = () => mask.remove();
      const box = h('.modal',
        h('h3', title),
        sub ? h('.sub', sub) : null,
        body,
        // 这一行必须单独一个类。手机上它是吸底的，而弹窗正文里也到处是
        // .btn-row（活动选择器每个分类都是一行按钮），只按 .modal .btn-row
        // 选的话每一组都会吸底，往下滚时旧的那几行会一直糊在屏幕上。
        actions ? h('.btn-row.modal-actions', { style: { marginTop: '20px', justifyContent: 'flex-end' } },
          ...actions.map(a => h('button.btn' + (a.primary ? '.primary' : ''), {
            onclick: () => { const r = a.onClick && a.onClick(); if (r !== false) close(); }
          }, a.label))
        ) : null
      );
      mask.appendChild(box);
      document.body.appendChild(mask);
      return { close, box };
    },

    confirm(title, text, onYes) {
      this.modal(title, null, h('div', { style: { fontSize: '14.5px', lineHeight: '1.9' } }, text), [
        { label: '再想想' },
        { label: '就这么办', primary: true, onClick: onYes }
      ]);
    }
  };

  G.h = h;
  G.Theme = Theme;

})(window.G = window.G || {});

/* ===== ui/components.js — 可复用组件 ===== */
(function (G) {
  'use strict';

  const h = G.h;

  const C = {

    kv(k, v, cls) {
      return h('.kv' + (cls ? '.' + cls : ''), h('span.k', k), h('span.v', v));
    },

    bar(value, max, tone) {
      const pct = Math.max(0, Math.min(100, (value / (max || 1)) * 100));
      return h('.bar' + (tone ? '.' + tone : ''), h('i', { style: { width: pct + '%' } }));
    },

    panel(title, ...body) {
      return h('.panel', h('.panel-title', title), ...body);
    },

    /**
     * 场景 + 立绘舞台
     * @param expr  表情映射 {npcId: 'calm'|'emotion'|'special'} 或统一的字符串
     *              缺图时按 请求的表情 → calm → 色块占位 逐级回退
     */
    stage(s, sceneId, actors, speakingId, expr) {
      const meta = G.DATA.static.scenes.find(x => x.id === sceneId);
      const bg = h('.bg');
      const ph = h('.placeholder', meta?.name || '云霄仙院');
      const url = G.Theme.sceneURL(sceneId);

      // 舞台只截 16:9 原图中间的一条横带。统一按 42% 取会让"画面重心偏低"的
      // 场景（石阶、试炼塔）被切掉主体，所以每张图在 static.json 里带一个
      // 按视觉重心算出来的 focus，取不到就退回 42。
      const focus = meta?.focus ?? 42;
      bg.style.backgroundPosition = `center ${focus}%`;

      G.Theme.testImage(url).then(ok => {
        if (ok) { bg.style.backgroundImage = `url(${url})`; ph.remove(); }
      });

      const ports = h('.portraits');
      (actors || []).slice(0, 3).forEach(id => {
        const npc = G.NPC.get(id);
        if (!npc) return;
        const active = !speakingId || speakingId === id;
        const want = (typeof expr === 'string' ? expr : expr?.[id]) || 'calm';

        const fb = h('.portrait-fallback', {
          style: { background: `linear-gradient(180deg, transparent, ${npc.color || 'var(--accent)'})` }
        }, npc.name);
        ports.appendChild(fb);

        G.Theme.resolvePortrait(id, want).then(u => {
          if (!u) return;
          const img = h('img.portrait' + (active ? '.active' : ''), { src: u, alt: npc.name });
          if (fb.parentNode) ports.replaceChild(img, fb);

      return h('.stage.' + G.Theme.phaseClass(s), bg, ph, h('.veil'), ports,
        h('.scene-name', meta?.name || ''));

/* ===== ui/create.js — 角色创建 ===== */
(function (G) {
  'use strict';

  const h = G.h;

  const Create = {
    draft: null,

    init() {
      this.draft = {
        name: '', gender: 'male', appearAge: 18, role: 'student',
        college: 'jianyuan', origin: 'poor_genius', originText: '',
        traits: [], talent: 'none', talentText: '',
        spiritRoot: { elements: ['metal'], quality: 'triple', mutantText: '' },
        appearance: '',
        attrs: { wu: 5, gen: 5, shen: 5, ji: 5, xin: 5, shi: 5 }
      };
    },

    render(onDone) {
      if (!this.draft) this.init();
      const d = this.draft;
      const D = G.DATA.static;
      // 内边距交给 CSS（.create-page）——要随安全区和横竖屏变，写死在这里就没法适配了
      const root = h('.create-page');

      const rerender = () => {
        const next = this.render(onDone);
        root.replaceWith(next);
      };

      const section = (title, ...body) =>
        h('div', { style: { marginBottom: '26px' } }, h('.panel-title', title), ...body);

      const chip = (label, on, onClick, note) =>
        h('button.btn' + (on ? '.primary' : ''), { onclick: onClick, title: note || '' }, label);

      // ---- 身份 ----
      const roleRow = h('.btn-row',
        ...[['student', '学生'], ['teacher', '教习'], ['headmaster', '院主']].map(([k, n]) =>
          chip(n, d.role === k, () => {
            d.role = k;
            const set = G.State.ATTR_SETS[k];
            d.attrs = {};
            set.keys.forEach(x => d.attrs[x] = Math.floor(set.points / 6));
            rerender();
          })));

      // ---- 学院 ----
      const colRow = h('.btn-row', ...Object.keys(G.State.COLLEGES).map(k =>
        chip(G.State.COLLEGES[k].name, d.college === k, () => {
          d.college = k; G.Theme.applyCollege(k); rerender();
        }, G.State.COLLEGES[k].field)));

      // ---- 出身 ----
      const originRow = h('.btn-row', ...D.origins.map(o =>
        chip(o.name, d.origin === o.id, () => { d.origin = o.id; rerender(); }, o.desc)));

      // ---- 性格（选二）----
      const traitRow = h('.btn-row', ...D.traits.map(t =>
        chip(t.name, d.traits.includes(t.id), () => {
          const i = d.traits.indexOf(t.id);
          if (i >= 0) d.traits.splice(i, 1);
          else if (d.traits.length < 2) d.traits.push(t.id);
          else G.Theme.toast('最多选两项');
          rerender();
        })));

      // ---- 灵根 ----
      const elemRow = h('.btn-row', ...D.elements.map(e =>
        chip(e.name, d.spiritRoot.elements.includes(e.id), () => {
          const arr = d.spiritRoot.elements;
          const i = arr.indexOf(e.id);
          if (i >= 0) { if (arr.length > 1) arr.splice(i, 1); }
          else arr.push(e.id);
          const n = arr.length;
          d.spiritRoot.quality = ['single', 'dual', 'triple', 'four', 'five'][n - 1] || 'five';
          rerender();
        })));

      const qualRow = h('.btn-row', ...D.spiritRootQuality.map(q =>
        chip(q.name + ' ×' + q.coef, d.spiritRoot.quality === q.id, () => {
          d.spiritRoot.quality = q.id; rerender();
        })));

      // ---- 天赋 ----
      const talentRow = h('.btn-row', ...D.talents.map(t =>
        chip(t.name, d.talent === t.id, () => { d.talent = t.id; rerender(); }, t.desc)));
      const talentDesc = h('.tiny.muted', { style: { marginTop: '6px' } },
        (D.talents.find(t => t.id === d.talent) || {}).desc || '');

      // ---- 属性分配 ----
      const set = G.State.ATTR_SETS[d.role];
      const used = set.keys.reduce((a, k) => a + (d.attrs[k] || 0), 0);
      const left = set.points - used;
      const attrRows = h('div');
      for (const k of set.keys) {
        attrRows.appendChild(h('div', {
          style: { display: 'flex', alignItems: 'center', gap: '10px', padding: '4px 0' }
        },
          h('span', { style: { width: '54px', fontSize: '14px' } }, G.State.ATTR_LABEL[k]),
          h('button.btn.ghost', { onclick: () => { if (d.attrs[k] > 0) { d.attrs[k]--; rerender(); } } }, '−'),
          h('span.mono', { style: { width: '28px', textAlign: 'center' } }, d.attrs[k]),
          h('button.btn.ghost', {
            onclick: () => {
              if (left <= 0) return G.Theme.toast('没有剩余点数了');
              if (d.attrs[k] >= set.cap) return G.Theme.toast('已到单项上限 ' + set.cap);
              d.attrs[k]++; rerender();
            }
          }, '＋'),
          h('.bar', { style: { flex: 1 } }, h('i', { style: { width: (d.attrs[k] / set.cap * 100) + '%' } }))
        ));
      }

      const canStart = d.name.trim() && d.traits.length === 2 && left === 0;

      G.Theme.mount(root,
        h('div', { style: { textAlign: 'center', marginBottom: '38px' } },
          h('div', { style: { fontSize: '13px', letterSpacing: '.4em', color: 'var(--ink-3)' } }, '云 霄 仙 院'),
          h('div', { style: { fontSize: '26px', letterSpacing: '.28em', marginTop: '8px' } }, '角色创建卷宗')),

        section('基础',
          h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' } },
            h('.field', h('label', '道号 / 姓名'),
              h('input', { value: d.name, placeholder: '取个名字', oninput: e => d.name = e.target.value })),
            h('.field', h('label', '性别'),
              h('.btn-row', ...[['male', '男'], ['female', '女'], ['other', '其他']].map(([k, n]) =>
                chip(n, d.gender === k, () => { d.gender = k; rerender(); }))))),
          h('.field', h('label', '外貌自述（会写进叙事，可留空）'),
            h('input', { value: d.appearance, placeholder: '例：身量偏瘦，左眉有道旧疤',
              oninput: e => d.appearance = e.target.value }))),

        section('身份', roleRow,
          h('.tiny.muted', { style: { marginTop: '6px' } },
            d.role === 'student' ? '五年学制，从练气三层起。自由度中等，成长空间最大。'
            : d.role === 'teacher' ? '元婴期起步。授课、研究、院务、同僚周旋。'
            : '合体期。你要考虑的是整座学院。')),

        section('所属学院', colRow,
          h('.tiny.muted', { style: { marginTop: '6px' } }, G.State.collegeOf(d.college).field)),

        section('出身', originRow,
          h('.tiny.muted', { style: { marginTop: '6px' } },
            (D.origins.find(o => o.id === d.origin) || {}).desc || ''),
          d.origin === 'special' ? h('.field', { style: { marginTop: '8px' } },
            h('input', { value: d.originText, placeholder: '自行描述你的来历',
              oninput: e => d.originText = e.target.value })) : null),

        section(`性格（选二 · 已选 ${d.traits.length}）`, traitRow),

        section('灵根',
          h('.tiny.muted', { style: { marginBottom: '6px' } }, '属性'), elemRow,
          h('.tiny.muted', { style: { margin: '10px 0 6px' } }, '品质（选属性会自动匹配，也可手动指定）'), qualRow),

        section('特殊天赋', talentRow, talentDesc),

        section(`资质分配（剩余 ${left} 点 · 单项上限 ${set.cap}）`, attrRows),

        h('.btn-row', { style: { marginTop: '30px', justifyContent: 'center' } },
          h('button.btn.primary', {
            disabled: !canStart,
            style: { padding: '12px 46px', letterSpacing: '.2em' },
            onclick: () => {
              const s = G.State.newGame(this.draft);
              G.Game.setSchedule(s, G.Game.autoSchedule(s));
              G.Theme.applyCollege(s.player.college);
              onDone(s);
            }
          }, canStart ? '入 院' : (left !== 0 ? `还需分配 ${left} 点` : d.traits.length !== 2 ? '请选两项性格' : '请填写道号'))),

        h('.center.tiny.muted', { style: { marginTop: '14px' } },
          '入院后仍可在设置里接入自己的模型密钥，把叙事升级为动态生成。')
      );

      return root;
    }
  };

  G.Create = Create;

})(window.G = window.G || {});

(function (G) {

    left(s) {

      return h('div',

          C().kv('身份', roleName),
          C().kv('院属', c.name),
          C().kv('境界', G.State.realmName(cu.realm, cu.layer)),
          h('.kv', h('span.k', '修为'), h('span.v', `${Math.round(cu.exp)} / ${cu.expMax}`)),
          C().bar(cu.exp, cu.expMax),
          cu.resting > 0 ? h('.tiny.danger', `休养中，还需 ${cu.resting} 周`) : null,
          cu.injuries.length ? h('.tiny.danger', `身上有 ${cu.injuries.length} 处伤`) : null
        ),

        C().panel('资质', attrs),

        C().panel('状态',
          h('.kv', h('span.k', '心魔'), h('span.v', `${Math.round(cu.demonHeart)} · ${dh.name}`)),
          C().bar(cu.demonHeart, 100, dh.tone === 'danger' ? 'danger' : dh.tone === 'warn' ? 'warn' : null),
          C().kv('声望', `${Math.round(s.reputation.value)} · ${G.Reputation.tierName(s)}`),
          C().kv('阵营', G.Reputation.dominant(s).name),
          s.academy.grades.length ? C().kv('上次名次', '第 ' + G.Academy.lastRank(s) + ' 名') : null,
          s.reputation.tags.length ? h('div', { style: { marginTop: '6px' } },
            ...s.reputation.tags.map(t => h('span.tag', t))) : null
        ),

        C().panel('资财',
          C().kv('灵石', G.Economy.format(s)),
          C().kv('贡献点', Math.round(s.resources.contribution)),
          items.length ? h('div', { style: { marginTop: '8px' } },
            ...items.map(k => {
              const it = G.DATA.static.items.find(x => x.id === k);
              return h('span.tag', `${it ? it.name : k}×${s.resources.items[k]}`);
            })) : h('.tiny.muted', '身无长物')
        ),

        s.player.role === 'student' ? C().panel('功法',
          C().kv('所修', (G.DATA.static.techniques.find(t => t.id === cu.technique) || {}).name || '—'),
          C().kv('倍率', '×' + G.Cultivation.techMult(s).toFixed(1)),
          C().kv('灵根系数', '×' + G.Cultivation.rootCoef(s).toFixed(2))
        ) : null,

        s.player.role === 'teacher' ? this.facultyPanel(s) : null,
        s.player.role === 'headmaster' ? this.govPanel(s) : null
      );
    },

    // ---------- 教习专属 ----------
    facultyPanel(s) {
      const f = G.Faculty.summary(s);
      if (!f) return null;
      const styles = G.Faculty.TEACH_STYLES;

      return h('div',
        C().panel('教务',
          C().kv('名下弟子', f.disciples + ' 人'),
          C().kv('已成金丹', f.jindan + ' 人'),
          f.broken ? C().kv('折损', f.broken + ' 人') : null,
          C().kv('著述', f.papers + ' 部'),
          C().kv('已备课', f.prepared + ' / 5'),
          f.lastEval ? C().kv('上次评价', f.lastEval.tier + '（' + f.lastEval.score + '）') : null,
          f.streak >= 2 ? h('.tiny.ok', `连续 ${f.streak} 学期优秀`) : null,
          f.isHead ? h('.tiny.ok', '你已是院首') : null
        ),

        C().panel('教法',
          h('.btn-row', ...Object.keys(styles).map(k =>
            h('button.btn' + (s.faculty.style === k ? '.primary' : ''), {
              title: styles[k].desc,
              onclick: () => { G.Faculty.setStyle(s, k); G.UI.refreshLeft(); }
            }, styles[k].name))),
          h('.tiny.muted', { style: { marginTop: '6px' } }, styles[s.faculty.style].desc)
        ),

        C().panel('研究',
          f.research
            ? h('div',
                C().kv('题目', f.research.name),
                C().kv('进度', f.researchProgress),
                h('.tiny.muted', f.research.desc))
            : h('div',
                h('.tiny.muted', { style: { marginBottom: '6px' } }, '选一个题目开始'),
                h('.btn-row', ...G.Faculty.availableTopics(s).slice(0, 5).map(t =>
                  h('button.btn', {
                    title: t.desc,
                    onclick: () => {
                      const r = G.Faculty.startResearch(s, t.id);
                      if (r.fail) return G.Theme.toast(r.fail, 'danger');
                      G.Theme.toast('开题：' + t.name);
                      G.UI.refreshLeft();
                    }
                  }, t.name))))
        )
      );
    },

    // ---------- 院主专属 ----------
    govPanel(s) {
      const g = G.Governance.summary(s);
      if (!g) return null;
      const worstName = G.State.collegeOf(g.worst).name;

      return h('div',
        C().panel('院务',
          C().kv('学院预算', Math.round(g.budget)),
          C().kv('院主私库', Math.round(g.privy)),
          h('.kv', h('span.k', '人心'), h('span.v', `${g.unrest} · ${g.mood.name}`)),
          C().bar(100 - g.unrest, 100, g.mood.tone === 'danger' ? 'danger' : g.mood.tone === 'warn' ? 'warn' : null),
          h('.tiny.muted', `最不满：${worstName}（${G.Governance.unrestOf(s, g.worst)}）`),
          C().kv('已行改革', g.reforms + ' 项'),
          C().kv('待决院务', g.agendaLeft + ' 件'),
          g.successor ? C().kv('接班人', ({ chu: '楚河山门生', bai: '白鹿卿', disciple: '弟子中选拔' })[g.successor]) : null,
          g.successor ? C().kv('调教次数', g.heirReady) : null
        ),

        g.threat ? C().panel('外患',
          C().kv('来犯', g.threat.name),
          h('.tiny.muted', g.threat.desc),
          h('.kv', h('span.k', '化解进度'), h('span.v', g.threatProgress + '%')),
          C().bar(g.threatProgress, 100, g.threatProgress < 40 ? 'danger' : 'warn')
        ) : C().panel('外患', h('.tiny.muted', '眼下四境安宁。')),

        C().panel('七院人心',
          ...G.Governance.COLLEGES.map(c => {
            const v = G.Governance.unrestOf(s, c);
            return h('div',
              h('.kv', h('span.k', G.State.collegeOf(c).name), h('span.v', v)),
              C().bar(100 - v, 100, v >= 70 ? 'danger' : v >= 50 ? 'warn' : null));
          })
        )
      );
    },

    // ---------- 右栏：日程 / 关系 / 暗线 ----------
    right(s, view, setView, rerender) {
      const nudge = G.Storyline.hasPendingDeduction(s);
      const list = [['sched', '日程'], ['rel', '关系']];
      if (s.player.role === 'teacher') list.push(['disciples', '弟子']);
      list.push(['line', '暗线'], ['log', '记事']);

      const tabs = h('.btn-row', { style: { marginBottom: '16px' } },
        ...list.map(([k, label]) => h('button.btn' + (view === k ? '.primary' : '.ghost'), {
          onclick: () => setView(k),
          style: (k === 'line' && nudge && view !== k) ? { color: 'var(--cinnabar)' } : null
        }, label + (k === 'line' && nudge ? ' ·' : ''))));

      let body;
      if (view === 'sched')          body = this.schedView(s, rerender);
      else if (view === 'rel')       body = this.relView(s);
      else if (view === 'disciples') body = this.discipleView(s, rerender);
      else if (view === 'line')      body = this.lineView(s);
      else                           body = this.logView(s);

      return h('div', tabs, body);
    },

    /** 弟子名册。压力条是这一屏最该盯着的东西。 */
    discipleView(s, rerender) {
      const f = s.faculty;
      if (!f) return h('.tiny.muted', '你还不是教习。');
      const active = f.disciples.filter(d => !d.graduated && !d.broken);
      const gone = f.disciples.filter(d => d.broken);

      const card = d => {
        const pressTone = d.pressure >= 70 ? 'danger' : d.pressure >= 45 ? 'warn' : null;
        const need = G.Faculty.expNeed(d);
        return h('.rel',
          h('.rel-head',
            h('span.rel-name', d.name),
            h('span.rel-stage', G.State.realmName(d.realm, d.layer))),
          h('.tiny.muted', `${G.Faculty.talentName(d.talent)} · ${d.trait}`),
          h('.kv', h('span.k', '修为'), h('span.v', `${Math.round(d.exp)} / ${need}`)),
          C().bar(d.exp, need),
          h('.kv', h('span.k', '亲近'), h('span.v', Math.round(d.affinity))),
          C().bar(d.affinity, 100),
          h('.kv', h('span.k', '压力'), h('span.v', Math.round(d.pressure))),
          C().bar(d.pressure, 100, pressTone),
          d.pressure >= 70 ? h('.tiny.danger', '他快撑不住了。再逼下去要出事。') : null,
          h('.btn-row', { style: { marginTop: '6px' } },
            h('button.btn', {
              onclick: () => {
                const r = G.Faculty.tutor(s, d.id);
                if (r.fail) return G.Theme.toast(r.fail, 'danger');
                G.Theme.toast(`指导${r.disciple}：${G.Check.GRADE_LABEL[r.grade]}　修为 +${r.gain}`);

      return h('div',
        h('.tiny.muted', { style: { marginBottom: '10px' } },
          '压力来自你的教法和你多久没管过他们。超过 70 就有走火入魔的风险。'),

      return h('div',
        h('.tiny.muted', { style: { marginBottom: '10px' } },

    /**
     * 当下要紧：把散在各处的紧迫感聚到一起——倒计时、没了结的事、等你回话的人。
     * 纯本地计算，不花一个 token。返回 [{text, tone}]，tone 为 good|warn|danger|null。
     */
    urgent(s) {
      const out = [];
      const push = (text, tone) => out.push({ text, tone: tone || null });
      const cu = s.cultivation;
      const week = Math.floor(s.time.absoluteTurn / 21);

      // 修行
      if (G.Cultivation.canBreakthrough(s)) push('修为已满，可以尝试突破。', 'good');
      else if (cu.exp >= cu.expMax * 0.85) push('离突破只差一步。', 'good');
      if (cu.demonHeart >= 80) push('心魔缠身。再不排解，下次突破就是走火。', 'danger');
      else if (cu.demonHeart >= 60) push('心魔躁动，此时突破极险。', 'danger');
      else if (cu.demonHeart >= 30) push('道心有隙。休息、与人交心、了结旧账都能缓一缓。', 'warn');
      if (cu.resting > 0) push(`还在休养，还需 ${cu.resting} 周。`, 'warn');
      if (cu.injuries.length) push(`身上有 ${cu.injuries.length} 处伤，判定会吃亏。`, 'warn');

      // 学生：考试倒计时与名次预估
      if (s.player.role === 'student') {
        const EXAM = [10, 11, 12, 1, 2, 3, 4, 5];
        let m = s.time.month, weeks = 5 - s.time.week, guard = 0;
        while (!EXAM.includes(m) && guard++ < 12) { m = m % 12 + 1; weeks += 4; }
        const kind = (m === 1 || m === 6) ? '期末大考' : '月考';
        const rank = G.Academy.rankOf(s, G.Academy.scoreOf(s));
        const band = rank <= 30 ? '前列' : rank <= 100 ? '中上' : rank <= 200 ? '中游' : rank <= G.Academy.TOTAL - 30 ? '靠后' : '垫底';
        const tone = rank > G.Academy.TOTAL - 30 ? 'danger' : rank > 200 ? 'warn' : null;
        push(`${kind}还有 ${weeks} 周。照眼下的势头，大约在${band}。`, tone);
        if (s.academy.warnings >= 1) push('已收到末位警告。再垫底一学期就是劝退。', 'danger');
        if (G.Time.isVacation(s)) push('游历期，不上课。正是往外跑、探秘境的时候。', 'good');
      }

      // 教习
      if (s.player.role === 'teacher' && s.faculty) {
        const f = s.faculty;
        const hot = f.disciples.filter(d => !d.graduated && !d.broken && d.pressure >= 60);
        for (const d of hot) push(`${d.name}压力很大（${Math.round(d.pressure)}）。再逼下去要出事——日程里排一次「给弟子放假」。`, d.pressure >= 70 ? 'danger' : 'warn');
        if (!f.prepared) push('一份教案都没有。下堂正课会砸。', 'warn');
        const idle = f.disciples.filter(d => !d.graduated && !d.broken &&
          s.time.absoluteTurn - (d.lastTutor || d.joinedTurn || 0) >= 6 * 21);
        if (idle.length) push(`${idle.map(d => d.name).join('、')}已经六周没被你单独指导过。`, 'warn');
      }

      // 院主
      if (s.player.role === 'headmaster' && s.gov) {
        const g = G.Governance.summary(s);
        if (g?.threat) push(`${g.threat.name}压境，化解进度 ${g.threatProgress}%。`, g.threatProgress < 40 ? 'danger' : 'warn');
        if (g && g.unrest >= 60) push(`七院人心 ${g.unrest}，${G.State.collegeOf(g.worst).name}最不满。`, g.unrest >= 75 ? 'danger' : 'warn');
        if (g?.agendaLeft) push(`还有 ${g.agendaLeft} 件院务等你拍板。`);
      }

      // 人
      if (s.flags._pendingMsg) push(`${G.NPC.name(s.flags._pendingMsg.npcId)}的传音还没回。`, 'warn');
      for (const ch of (s.events.activeChains || [])) {
        const ev = G.DATA.events.find(e => e.id === ch.eventId);
        if (!ev) continue;
        const who = (ev.actors || []).map(id => G.NPC.name(id)).join('、');
        const due = Math.max(0, Math.ceil((ch.dueTurn - s.time.absoluteTurn) / 21));
        push(`${who ? '与' + who + '的事' : '有件事'}还没了结${due > 0 ? `（约 ${due} 周后有下文）` : '（就在这几天）'}。`);
      }
      const cold = G.DATA.npcs.filter(n => {
        const r = s.relations[n.id];
        return r && r.favor >= 40 && r.met && s.time.absoluteTurn - (r.lastInteractTurn || 0) >= 6 * 21;
      }).slice(0, 2);
      if (cold.length) push(`${cold.map(n => n.name).join('、')}很久没见了，交情会淡。`, 'warn');
      if (G.Storyline.hasPendingDeduction(s)) push('手上的线索能串起来了——去「暗线」推论。', 'good');
      const bad = G.Rumor.summary(s).filter(r => r.negative && r.spread >= 3)[0];
      if (bad) push(`院里在传：${bad.text}（${bad.spread} 人听说）。找听过的人谈谈能压一压。`, 'warn');

      // 钱
      if (s.player.role === 'student' && G.Economy.totalLow(s) < 20) push('灵石所剩无几。', 'warn');

      // 学院大事
      const fixed = G.Time.FIXED_BY_MONTH[s.time.month];
      if (fixed && s.time.week === 1) push('本月有学院大事。');

      if (!out.length) push(week < 2 ? '刚入院，先把这一周排满。' : '难得清静的一周。想做什么都行。');
      return out;
    },

    urgentList(s) {
      const items = this.urgent(s);
      return h('.urgent', ...items.map(it => h('.it' + (it.tone ? '.' + it.tone : ''), it.text)));
    },

    weekHint(s) {
      const tips = [];
      if (G.Cultivation.canBreakthrough(s)) tips.push('修为已满，可以尝试突破。');
      if (s.cultivation.demonHeart >= 60) tips.push('心魔躁动，此时突破极险。');
      if (s.cultivation.resting > 0) tips.push('你还在休养，行动会受影响。');
      if (s.academy.warnings >= 1) tips.push('你已收到末位警告，需提升名次。');
      const fixed = G.Time.FIXED_BY_MONTH[s.time.month];
      if (fixed && s.time.week === 1) tips.push('本月有学院大事。');
      if (!tips.length) tips.push('平常的一周。');
      return tips.join(' ');
    },

    relView(s) {
      const met = G.DATA.npcs.filter(n => s.relations[n.id]?.met || s.relations[n.id]?.favor !== n.initial.favor);
      const list = met.length ? met : G.NPC.classmates(s);
      const sorted = list.slice().sort((a, b) => s.relations[b.id].favor - s.relations[a.id].favor);
      const rumors = G.Rumor.summary(s);
      return h('div',
        rumors.length ? C().panel('近来的传闻',
          ...rumors.map(r => h('.tiny' + (r.negative ? '.danger' : '.muted'), { style: { padding: '2px 0' } },
            `· ${r.text}（${r.spread} 人听说）`)),

        sorted.map(n => C().relCard(s, n.id)),

    lineView(s) {
      const lines = G.Storyline.summary(s);
      const anyUnlocked = lines.some(l => l.unlocked);
      return h('div',
        !anyUnlocked ? h('.tiny.muted', { style: { marginBottom: '12px' } },
          '学院有些事，不去碰就永远不会浮现。多探、多问、多与人交心。') : null,
        ...lines.map(l => h('.panel',
          h('.panel-title', l.unlocked ? l.name : '？ ？ ？'),
          h('.tiny.muted', l.unlocked ? l.hint : '尚未浮现。'),
          l.unlocked ? C().bar(l.progress, 100, l.progress >= 88 ? 'danger' : null) : null,
          l.unlocked ? h('.tiny.muted',

          l.clues.length ? h('div', { style: { marginTop: '6px' } },

          l.unlocked ? this.deduceBlock(s, l.key) : null
        ))
      );

    /** 线索可组合：凑齐特定组合可主动推论，直接跳进度 */
    deduceBlock(s, key) {
      const ds = G.Storyline.availableDeductions(s, key);
      const pend = ds.filter(d => !d.done);
      const done = ds.filter(d => d.done);
      const wrap = h('div', { style: { marginTop: '10px' } });

      for (const d of pend) {
        const ready = d.have.length === d.need.length;
        wrap.appendChild(h('div', { style: { marginBottom: '8px' } },
          h('.tiny', {
            style: { color: ready ? 'var(--accent)' : 'var(--ink-4)', lineHeight: '1.7' }
          }, '推论需要：' + d.need.map(n =>
            d.have.includes(n) ? '✓ ' + n : '？ ' + n).join('　')),
          ready ? h('button.btn.primary', {
            style: { marginTop: '5px', fontSize: '13px', padding: '5px 14px' },
            onclick: () => {
              const r = G.Storyline.tryDeduce(s, key);
              if (r) {
                G.Theme.modal('推 论', G.Storyline.LINES[key].name,
                  h('div', { style: { fontSize: '15px', lineHeight: '2' } }, r.text),
                  [{ label: '记下了', primary: true }]);
                this.refreshHost && this.refreshHost();
                G.UI.refreshRight();
                G.UI.refreshLeft();
              } else {
                G.Theme.toast('还差点什么');
              }
            }
          }, '试着串起来') : null));
      }

      if (done.length) {
        wrap.appendChild(h('.tiny.muted', `已推出 ${done.length} 条`));
      }
      return wrap.children.length ? wrap : null;
    },

    logView(s) {
      const log = s.log.slice(-40).reverse();
      return h('div',
        ...log.map(l => h('.tiny', {
          style: { padding: '5px 0', borderBottom: '1px solid var(--line-2)',
                   color: l.kind === 'major' ? 'var(--ink)' : l.kind === 'danger' ? 'var(--cinnabar)' : 'var(--ink-3)' }
        }, l.text)),
        !log.length ? h('.tiny.muted', '还没有值得记下的事。') : null
      );
    },

    // ---------- 设置弹窗 ----------
    settings() {

      const providerSel = h_('select', {
        onchange: e => {
          cfg.provider = e.target.value;
          const p = G.LLM.PROVIDERS[cfg.provider];
          baseInput.value = p.baseURL;
          cfg.baseURL = p.baseURL;
          // 模型名一律取自 PROVIDERS，这里不要再写死一份
          if (p.model) modelInput.value = cfg.model = p.model;
          if (p.modelPro) impInput.value = cfg.modelImportant = p.modelPro;
        }
      }, ...Object.keys(G.LLM.PROVIDERS).map(k =>
        h_('option', { value: k, selected: cfg.provider === k }, G.LLM.PROVIDERS[k].name)));

      const baseInput = h_('input', { value: cfg.baseURL || G.LLM.PROVIDERS[cfg.provider].baseURL,

      const keyInput = h_('input', { type: 'password', value: cfg.apiKey, placeholder: 'sk-…',
        oninput: e => cfg.apiKey = e.target.value });
      const modelInput = h_('input', { value: cfg.model, oninput: e => cfg.model = e.target.value });
      const impInput = h_('input', { value: cfg.modelImportant, placeholder: '留空则与上面相同',
        oninput: e => cfg.modelImportant = e.target.value });
      const lenInput = h_('input', { type: 'number', value: cfg.narrateLength, min: 400, max: 4000,
        oninput: e => cfg.narrateLength = +e.target.value });

      const enableBox = h_('input', { type: 'checkbox', checked: cfg.enabled, style: { width: 'auto' },
        onchange: e => cfg.enabled = e.target.checked });
      const impBox = h_('input', { type: 'checkbox', checked: cfg.useImportantModel, style: { width: 'auto' },
        onchange: e => cfg.useImportantModel = e.target.checked });
      const dlgBox = h_('input', { type: 'checkbox', checked: cfg.dialogue !== false, style: { width: 'auto' },
        onchange: e => cfg.dialogue = e.target.checked });
      const msgBox = h_('input', { type: 'checkbox', checked: cfg.messages !== false, style: { width: 'auto' },
        onchange: e => cfg.messages = e.target.checked });

      const status = h_('.tiny.muted', '未测试');

      const body = h_('div',
        h_('.field', h_('label', '启用 LLM 叙事'),
          h_('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
            enableBox, h_('span.small.muted', '关闭后使用内置模板文本，游戏完整可玩'))),
        h_('.field', h_('label', '服务商'), providerSel),
        h_('.field', h_('label', '接口地址'), baseInput),
        h_('.field', h_('label', 'API 密钥'), keyInput,
          h_('.tiny.muted', { style: { marginTop: '4px' } },
            '密钥仅保存在你的浏览器本地，不经过任何服务器。')),
        h_('.field', h_('label', '模型'), modelInput),
        h_('.field', h_('label', '重要场景使用高级模型'),
          h_('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
            impBox, h_('span.small.muted', '心魔关、突破、暗线、结局')),
          h_('div', { style: { marginTop: '6px' } }, impInput)),
        h_('.field', h_('label', '对话场'),
          h_('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
            dlgBox, h_('span.small.muted', '事件里的人先开口，你亲口回应；聊得好坏会影响判定'))),
        h_('.field', h_('label', '传音符'),
          h_('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
            msgBox, h_('span.small.muted', '认识的人会主动找你，可回话可不理'))),
        h_('.field', h_('label', '普通事件叙事字数'), lenInput,
          h_('.tiny.muted', { style: { marginTop: '4px' } }, '要紧场景自动放大到 1.6 倍。对话场已经把戏演过了，叙事不必再长。')),
        h_('hr.hr'),
        h_('.btn-row',
          h_('button.btn', {
            onclick: async e => {
              status.textContent = '测试中…';
              G.LLM.save();
              const r = await G.LLM.test();
              status.textContent = r.ok ? '连接正常：' + r.text : '失败：' + r.error;
              status.className = r.ok ? 'tiny ok' : 'tiny danger';
            }
          }, '测试连接'),
          h_('button.btn', { onclick: () => { G.LLM.clearKey(); keyInput.value = ''; G.Theme.toast('密钥已清除'); } }, '清除密钥'),
          status),
        h_('hr.hr'),
        h_('.panel-title', '存档'),
        h_('.btn-row',
          h_('button.btn', { onclick: () => { G.Save.save(1); G.Theme.toast('已存入档位一'); } }, '存档'),
          h_('button.btn', { onclick: () => { if (G.Save.load(1)) { G.Theme.toast('已读取'); G.UI.render(); } else G.Theme.toast('档位一为空', 'danger'); } }, '读档'),
          h_('button.btn', { onclick: () => G.Save.exportFile() }, '导出文件'),
          h_('button.btn', { onclick: () => Panels.importDialog() }, '导入文件')
        )
      );

      // 密钥这种东西，填了就得存。不能指望玩家一定去点「保存」——
      // 手机上点一下蒙层、往下一滑弹窗就没了，密钥也跟着没了。
      body.addEventListener('input', () => { clearTimeout(this._cfgT); this._cfgT = setTimeout(() => G.LLM.save(), 300); });
      body.addEventListener('change', () => G.LLM.save());

      const auto = G.Save.slots().find(x => x.slot === 'auto');
      body.appendChild(h_('hr.hr'));
      body.appendChild(h_('.panel-title', '这一局'));
      body.appendChild(h_('.btn-row',
        h_('button.btn', {
          onclick: () => {
            G.Theme.confirm('开一局新的？', '当前这一局会被挪到「上一局」备份里，随时能在标题页找回。', () => {
              G.Save.flush(); document.querySelectorAll('.modal-mask').forEach(m => m.remove()); G.UI.showCreate();
            });
          }
        }, '开新局'),
        G.Save.hasPrev() ? h_('button.btn', {
          onclick: () => {
            G.Theme.confirm('找回上一局？', '当前这一局会和上一局对调，不会丢。', () => {
              if (G.Save.swapPrev()) { document.querySelectorAll('.modal-mask').forEach(m => m.remove()); G.UI.render(); }
            });
          }
        }, '找回上一局') : null,
        h_('button.btn', { onclick: () => { G.Save.flush(); document.querySelectorAll('.modal-mask').forEach(m => m.remove()); G.UI.showTitle(); } }, '回标题页')));
      body.appendChild(h_('.tiny.muted', { style: { marginTop: '6px' } },
        '进度随时自动保存，关掉页面也不会丢' + (auto && !auto.empty ? `（上次保存：${auto.time}）` : '') + '。密钥同样只存在这台设备的浏览器里。'));

      G.Theme.modal('设置', '接入你自己的模型密钥：人物会真的开口跟你说话，叙事也随之动态生成', body, [
        { label: '完成', primary: true, onClick: () => { G.LLM.save(); G.Theme.toast('已保存'); } }
      ]);
    },

    importDialog() {
      const input = h('input', { type: 'file', accept: '.json' });
      input.onchange = () => {
        const f = input.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          if (G.Save.importJSON(rd.result)) { G.Theme.toast('导入成功'); G.UI.render(); }
          else G.Theme.toast('导入失败，文件可能损坏', 'danger');
        };
        rd.readAsText(f);
      };
      input.click();
    }
  };

  G.Panels = Panels;

})(window.G = window.G || {});


/* ==== ui/explore.js ==== */
/* ===== ui/explore.js — 秘境探索界面 =====
 * 独立于主界面的子模式：节点图 + 灵力/伤势条 + 行动选择 + 逐条推进的探索日志。
 */
(function (G) {
  'use strict';

  const h = G.h;

  const Explore = {
    r: null,
    logEl: null,
    root: null,
    onExit: null,

    /** 从主界面进入 */
    enter(s, kind, onExit) {
      const can = G.Realm.canEnter(s, kind);
      if (!can.ok) { G.Theme.toast(can.reason, 'danger'); return false; }
      this.r = G.Realm.gen(s, kind);
      this.onExit = onExit;
      this.render(s);
      return true;
    },

    render(s) {
      const r = this.r;
      const stage = G.C.stage(s, r.def.scene, []);

      this.logEl = h('.narrative');
      const logWrap = h('.narrative-wrap', this.logEl);

      const bar = (label, v, max, tone) => h('div', { style: { flex: 1 } },
        h('.kv', h('span.k', label), h('span.v', `${Math.max(0, Math.round(v))} / ${max}`)),
        G.C.bar(v, max, tone));

      this.statusEl = h('div', {
        style: { display: 'flex', gap: '18px', padding: '10px 46px', borderBottom: '1px solid var(--line)' }
      });

      this.actionsEl = h('.options', { style: { padding: '0 46px 40px' } });

      const top = h('.topbar',
        h('.title', `${r.def.name} · ${G.Realm.depthLabel(r)}　第 ${r.turns} 步`),
        h('.acts', h('button.btn.ghost', {
          onclick: () => G.Theme.confirm('撤出秘境', '现在退出，已有收获会打八折。确定吗？',
            () => this.doAct(s, 'retreat'))
        }, '撤退')));

      this.root = h('.col.col-main', { style: { height: '100%' } },
        top, stage, this.statusEl, logWrap, this.actionsEl);

      G.Theme.mount(G.UI.root, h('.layout', { style: { gridTemplateColumns: '1fr' } }, this.root));

      this.pushLog(r.log[0]);
      this.refresh(s);
    },

    refresh(s) {
      const r = this.r;
      const hpTone = r.hp <= 30 ? 'danger' : r.hp <= 60 ? 'warn' : null;
      const qiTone = r.qi <= r.maxQi * 0.25 ? 'danger' : r.qi <= r.maxQi * 0.5 ? 'warn' : null;

      G.Theme.mount(this.statusEl,
        h('div', { style: { flex: 1 } },
          h('.kv', h('span.k', '气血'), h('span.v', Math.max(0, Math.round(r.hp)) + ' / ' + r.maxHp)),
          G.C.bar(r.hp, r.maxHp, hpTone)),
        h('div', { style: { flex: 1 } },
          h('.kv', h('span.k', '灵力'), h('span.v', Math.max(0, Math.round(r.qi)) + ' / ' + r.maxQi)),
          G.C.bar(r.qi, r.maxQi, qiTone)),
        h('div', { style: { flex: 1 } },
          h('.kv', h('span.k', '深度'), h('span.v', `${r.at} / ${r.nodes.length - 1}`)),
          G.C.bar(r.at, r.nodes.length - 1)),
        h('div', { style: { flex: 1 } },
          h('.kv', h('span.k', '收获'),
            h('span.v', r.loot.length ? r.loot.length + ' 项' : '暂无')),
          h('.tiny.muted', r.clues.length ? '线索 ' + r.clues.length : '　'))
      );

      const bar = this.root.querySelector('.topbar .title');
      if (bar) bar.textContent = `${r.def.name} · ${G.Realm.depthLabel(r)}　第 ${r.turns} 步`;

      // 行动
      G.Theme.clear(this.actionsEl);
      if (r.ended) {
        this.actionsEl.appendChild(h('button.opt', {
          onclick: () => this.exit(s)
        }, h('span.key', '▷'), '离开秘境', h('span.hint', '结算收获')));
        return;
      }

      const acts = G.Realm.actions(r);
      const node = G.Realm.node(r);
      const nexts = node.next.filter(i => r.nodes[i]);

      for (const a of acts) {
        // 多条岔路时，把"继续深入"展开成具体的路
        if (a.id === 'advance' && nexts.length > 1) {
          nexts.forEach((to, i) => {
            const seen = r.nodes[to].visited;
            this.actionsEl.appendChild(h('button.opt', {
              disabled: r.qi < 8,
              onclick: () => this.doAct(s, 'advance', to)
            }, h('span.key', '路' + '一二三四'[i]),
               seen ? '走回去过的那条' : ['向左', '向右', '往下', '往上'][i] || '另一条路',
               h('span.hint', '灵力 -8' + (seen ? ' · 你来过这里' : ''))));
          });
          continue;
        }
        this.actionsEl.appendChild(h('button.opt', {
          disabled: a.cost > 0 && r.qi < a.cost,
          onclick: () => this.doAct(s, a.id)
        }, h('span.key', '·'), a.label,
           h('span.hint', a.hint + (a.cost > 0 && r.qi < a.cost ? ' · 灵力不足' : ''))));
      }
    },

    doAct(s, action, target) {

/* ===== ui/dialogue.js — 对话场界面 =====
 * 气泡式对话，嵌在叙事区里。NPC 一句、你一句；立绘表情跟着 NPC 的情绪走。
 * 玩家可以打字，也可以点模型给的三条快语；随时能"先到这里"。
 */
(function (G) {
  'use strict';

  const h = G.h;

  const DialogueUI = {

    /**
     * 跑完整段对话，resolve 时对话已结束（模型收束 / 到回合上限 / 玩家主动停）。
     * @param opener  有值时作为 NPC 的第一句（回传音用），否则让模型开口
     */
    run(s, ss, opener) {
      return new Promise(async resolve => {
        const name = G.Dialogue.speakerName(ss);
        const wrap = h('.dialog' + (ss.kind === 'demon' ? '.demon' : ''));
        const lines = h('.dl-lines');
        const foot = h('.dl-foot');
        wrap.appendChild(lines);
        wrap.appendChild(foot);
        G.UI.narr.el.appendChild(wrap);

        const typing = () => {
          const t = h('.dl-line.npc.typing', h('span.dl-name', name), h('span.dl-text.dots', ''));
          lines.appendChild(t);
          G.UI.scrollDown();
          return t;
        };
        const addNpc = (text, expr) => {
          lines.appendChild(h('.dl-line.npc', h('span.dl-name', name), h('span.dl-text', text)));
          if (ss.npcId) G.UI.setStage(null, G.UI.currentActors, { [ss.npcId]: expr || 'calm' });
          G.UI.scrollDown();
        };
        const addMe = text => {
          lines.appendChild(h('.dl-line.me', h('span.dl-text', text)));
          G.UI.scrollDown();
        };
        const finish = () => {
          G.Theme.clear(foot);
          foot.appendChild(h('.dl-end', ss.kind === 'demon'
            ? (ss.closed ? '幻境安静下来了。' : '你不再理它。')
            : (ss.closed ? '对话到这里停住了。' : '你没有再说下去。')));
          resolve(ss);
        };

        // ---- 开场 ----
        let t = typing();
        let stop = G.UI.slowHint(t, 8000);
        await G.Dialogue.open(s, ss, opener);
        stop();
        t.remove();
        const first = ss.turns[ss.turns.length - 1];
        if (!first || !first.text) {
          // 模型开不了口（多半是网络）：静默退出，交回事件流程
          wrap.remove();
          ss.ended = true;
          return resolve(ss);
        }
        addNpc(first.text, first.expr);
        if (ss.ended) return finish();

        // ---- 玩家回合 ----
        const renderFoot = () => {
          G.Theme.clear(foot);
          const max = ss.maxTurns || G.Dialogue.MAX_TURNS;
          const left = max - ss.turns.filter(x => x.who === 'player').length;

          const chips = h('.dl-chips', ...ss.suggest.map(txt =>
            h('button.dl-chip', { onclick: () => send(txt) }, txt)));

          const input = h('input', {
            placeholder: left === max ? (ss.kind === 'demon' ? '你要怎么回它？' : '你想说什么？（直接打字）') : `还能再说 ${left} 句`,
            maxlength: 140,
            onkeydown: e => { if (e.key === 'Enter') send(input.value); }
          });
          const row = h('.dl-row',
            input,
            h('button.btn.primary', { onclick: () => send(input.value) }, '说'),
            h('button.btn.ghost', {
              title: '结束对话，去做决定',
              onclick: () => { G.Dialogue.end(ss); finish(); }
            }, ss.kind === 'demon' ? '不再理它' : '先到这里'));

          foot.appendChild(chips);
          foot.appendChild(row);
          G.UI.scrollDown();
          setTimeout(() => { try { input.focus({ preventScroll: true }); } catch (e) { /* 手机上不强制弹键盘 */ } }, 30);
        };

        const send = async text => {
          text = String(text || '').trim();
          if (!text || ss.ended) return;
          foot.querySelectorAll('button,input').forEach(x => x.disabled = true);
          addMe(text);
          const tt = typing();
          const stopHint = G.UI.slowHint(tt, 8000);
          await G.Dialogue.reply(s, ss, text);
          stopHint();
          tt.remove();
          const last = ss.turns[ss.turns.length - 1];
          if (last && last.who === 'npc' && last.text) addNpc(last.text, last.expr);
          if (ss.error) {
            G.UI.narr.sys('<span style="color:var(--cinnabar)">对方没能接上话（' + ss.error + '）</span>');
          }
          if (ss.ended) finish(); else renderFoot();
        };

        renderFoot();
      });
    },

    /** 传音符卡片（挂在空闲选项区） */
    messageCard(s, msg, onReply, onIgnore) {
      const npc = G.NPC.get(msg.npcId);
      if (!npc) return null;
      return h('.msg-card',
        h('.msg-head', h('span.msg-from', npc.name), h('span.msg-time', msg.week + ' · 传音符')),
        h('.msg-text', '「' + msg.text + '」'),
        h('.btn-row',
          h('button.btn.primary', { onclick: onReply }, '回话'),
          h('button.btn.ghost', { onclick: onIgnore }, '不理会')));
    }
  };

  G.DialogueUI = DialogueUI;

})(window.G = window.G || {});


/* ==== ui/main.js ==== */
/* ===== ui/main.js — 主界面与周推演流程 ===== */
(function (G) {
  'use strict';

  const h = G.h;

  const UI = {
    root: null,
    rightView: 'sched',
    mobileTab: 'main',
    narr: null,
    mainEl: null,
    running: false,
    runToken: 0,          // 每次推演/突破/传音一个令牌；界面被重建后旧流程据此自行作废
    currentScene: 'scene_main_plaza',
    currentActors: [],

    /* 横屏手机的判定条件，和 theme.css 里那条媒体查询逐字一致。
     *
     * 早期版本用 innerWidth > innerHeight && innerHeight <= 540 自己算，
     * 有两个毛病：一是 iOS 在 orientationchange 触发时这两个值还是旧的，
     * 二是它和 CSS 各算各的，一旦哪天改了断点就会对不上——CSS 已经换成
     * 横屏布局了，JS 还以为在竖屏，标签文案和布局互相打架。
     * 交给 matchMedia，浏览器算什么我们就跟什么，永远不可能不一致。 */
    MQ_LANDSCAPE: '(orientation: landscape) and (max-height: 540px)',

    mql() {
      if (!this._mql) {
        this._mql = window.matchMedia
          ? window.matchMedia(this.MQ_LANDSCAPE)
          // 极老的浏览器和无头环境没有 matchMedia，退回自己算。
          // 这里的条件必须和 MQ_LANDSCAPE 保持一致。
          : { get matches() { return window.innerWidth > window.innerHeight && window.innerHeight <= 540; } };
      }
      return this._mql;
    },

    isLandscapePhone() { return this.mql().matches; },

    /* ---------- 推演锁 ----------
     * 推演中主界面一旦被重建（读档、回标题、进秘境……），挂在旧 DOM 上的
     * 事件选项就没了，旧流程永远等不到玩家点击，running 也永远清不掉，
     * 「推演本周」从此灰掉。这里的办法是：
     *   · 开始一段流程时领一个令牌，结束时交还；
     *   · 界面重建前先作废当前令牌（abortRun），旧流程醒来发现令牌变了就退出；
     *   · 本周的事件计划存在存档里（Game.beginWeek），作废后点「接着推演」
     *     会从断点重新呈现没处理完的事件，不丢事件、不重抽。 */
    beginRun() {
      this.running = true;
      return ++this.runToken;
    },

    endRun(token) {
      if (token !== this.runToken) return;
      this.running = false;
    },

    alive(token) { return token === this.runToken; },

    abortRun() {
      if (!this.running) return;
      this.runToken++;
      this.running = false;

      if (G.LLM.abortAll) G.LLM.abortAll();

    /** 推演中不能做的事，给句话而不是默默失效 */
    busy() {

    },

    /** 流程里出了异常：停在断点，告诉玩家可以接着走 */

      this.runToken++;
      this.running = false;
      G.Game.pending = null;
      try {
        this.narr?.sys('<span style="color:var(--cinnabar)">这里出了点问题，已经停在断点。点「接着推演本周」可以从这里继续。</span>');
        this.refreshLeft(); this.refreshRight(); this.refreshTop();

      } catch (e2) { console.error(e2); }

    /** 模型迟迟不回话时，给玩家一个不等了的出口 */
    slowHint(anchor, ms) {

        if (!anchor.isConnected) return;
        const b = h('button.btn.ghost.slow-skip', {
          style: { marginLeft: '10px', fontSize: '12px', padding: '2px 10px' },
          onclick: () => { b.remove(); G.LLM.abortAll(); }
        }, '模型响应慢，改用内置文本');
        anchor.appendChild(b);

    /** 转屏后要重排：竖屏的底部标签栏和横屏的竖排导轨不是同一套 DOM 语义 */

        // 横屏默认展开日程（主栏本来就在），竖屏默认停在叙事
        this.mobileTab = now ? 'right' : 'main';
        if (G.State.current && !G.State.current.ended && !this.running) this.render();

      G.LLM.load();
      G.Save.watchExit();
      // 有自动存档就直接续上，不再经过标题页——玩家关掉再打开，看到的就是刚才那一幕。
      // 想开新局或找回上一局，设置里有入口。
      const auto = G.Save.slots().find(x => x.slot === 'auto');
      if (auto && !auto.empty && G.Save.load('auto') && !G.State.current.ended) {
        this.render();
      } else {
        this.showTitle();
      }
    },

    // ---------- 标题页 ----------
    showTitle() {
      this.abortRun();
      const auto = G.Save.slots().find(x => x.slot === 'auto');
      G.Theme.mount(this.root,
        h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%' } },
          h('div', { style: { textAlign: 'center', maxWidth: '440px', padding: '20px' } },
            h('div', { style: { fontSize: '13px', letterSpacing: '.5em', color: 'var(--ink-3)' } }, '苍 玄 大 陆'),
            h('div', { style: { fontSize: '34px', letterSpacing: '.34em', margin: '18px 0 6px' } }, '修仙学院模拟器'),
            h('div', { style: { fontSize: '14px', letterSpacing: '.24em', color: 'var(--ink-3)' } }, '云 霄 仙 院'),
            h('hr.hr'),
            h('div', { style: { fontSize: '14.5px', color: 'var(--ink-2)', lineHeight: '2', textAlign: 'justify' } },
              '修仙不只是打怪升级。在这座云上的学院里，你要上课，要考试，要修炼，要处理复杂的人际关系，要在理想与现实之间做选择，要在道心与凡心之间找平衡。'),
            h('hr.hr'),
            h('.btn-row', { style: { justifyContent: 'center' } },
              // 有存档时「继续」是主键，「入院」退居其次并且要确认——误点一下丢掉五年进度太亏
              !auto?.empty ? h('button.btn.primary', {
                style: { padding: '11px 28px' },
                onclick: () => { if (G.Save.load('auto')) this.render(); }
              }, '继续（' + auto.time + '）') : null,
              h('button.btn' + (auto?.empty ? '.primary' : ''), {
                style: { padding: '11px 32px' },
                onclick: () => {
                  if (auto?.empty) return this.showCreate();
                  G.Theme.confirm('开一局新的？', `当前这一局（${auto.name}，${auto.time}）会被挪到「上一局」备份里，随时能找回。`, () => this.showCreate());
                }
              }, '入 院'),
              G.Save.hasPrev() ? h('button.btn', {
                style: { padding: '11px 24px' },
                onclick: () => { if (G.Save.swapPrev()) this.render(); }
              }, '找回上一局') : null,
              h('button.btn', { style: { padding: '11px 24px' }, onclick: () => G.Panels.settings() }, '设置')),
            h('.center.tiny.muted', { style: { marginTop: '20px' } },
              G.LLM.configured && G.LLM.config.enabled ? '已接入模型，叙事为动态生成' : '当前为内置文本模式，可在设置中接入模型'))));
    },

    showCreate() {
      G.Create.init();
      G.Theme.mount(this.root, G.Create.render(() => this.render(true)));
    },

    // ---------- 主界面 ----------
    render(fresh) {
      this.abortRun();
      const s = G.State.current;
      if (!s) return this.showTitle();
      if (s.ended) return this.showEnding(G.Ending.evaluate(s));

      G.Theme.applyCollege(s.player.college);

      // 换身份后旧的分页可能已经不存在了，落回日程，否则右栏会莫名其妙变成记事
      if (this.rightView === 'disciples' && s.player.role !== 'teacher') this.rightView = 'sched';

      this.narr = G.C.narrative();
      const stage = G.C.stage(s, this.currentScene, this.currentActors);
      const narrWrap = h('.narrative-wrap', this.narr.el);
      const main = h('.col.col-main', this.topbar(s), stage, narrWrap);
      this.mainEl = { stage, narrWrap, main };

      // 分页类要一直挂着。早期版本在 main 时省略了这个类，结果 CSS 里
      // 的 .layout.tab-main（横屏「专注」收起侧栏）永远匹配不上，横屏
      // 看叙事时右边会空出三成宽的白栏。
      const layout = h('.layout.tab-' + this.mobileTab,
        h('.col.col-left', G.Panels.left(s)),
        main,
        h('.col.col-right', G.Panels.right(s, this.rightView,
          v => { this.rightView = v; this.refreshRight(); },
          () => this.refreshRight()))
      );

      // 横屏时主栏常驻，中间那个键的含义从「看叙事」变成「收起侧栏」
      const land = this.isLandscapePhone();
      const tabDefs = land
        ? [['left', '状态'], ['main', '专注'], ['right', '日程']]
        : [['left', '状态'], ['main', '叙事'], ['right', '安排']];
      const tabs = h('.mobile-tabs',
        ...tabDefs.map(([k, n]) =>
          h('button' + (this.mobileTab === k ? '.on' : ''), {
            onclick: () => this.switchTab(k)
          }, n)));

      G.Theme.mount(this.root, layout, tabs);

      if (fresh) this.openingScene(s);
      else this.idleScreen(s);
    },

    /* 只换 CSS 类，不重建 DOM。早期版本这里调 render()，推演中切一下标签，
     * 事件选项就被冲掉了，整局卡死。 */
    switchTab(k) {
      this.mobileTab = k;
      const layout = this.root.querySelector('.layout');
      if (!layout || !layout.querySelector('.col-main .narrative-wrap')) return this.render();
      layout.className = layout.className.replace(/\btab-\w+/g, '').trim() + ' tab-' + k;
      this.root.querySelectorAll('.mobile-tabs button').forEach((b, i) => {
        const keys = ['left', 'main', 'right'];
        b.classList.toggle('on', keys[i] === k);
      });
      if (k === 'left') this.refreshLeft();
      if (k === 'right') this.refreshRight();
      if (k === 'main') this.scrollDown();
    },

    topbar(s) {
      // 手机上纪年那一串会折成五六行，把顶栏撑成半个屏。给两份文案，CSS 按宽度选。
      return h('.topbar',
        h('.title', h('span.full', G.Time.label(s)), h('span.compact', G.Time.compactLabel(s))),
        h('.acts',
          h('button.btn.ghost', { onclick: () => this.openCultivate(s) }, '修炼'),
          h('button.btn.ghost', { onclick: () => this.openMarket(s) }, '坊市'),
          h('button.btn.ghost', { onclick: () => { if (!this.busy()) G.Explore.picker(s); } }, '秘境'),
          h('button.btn.ghost', { onclick: () => G.Panels.settings() }, '设置'),
          h('button.btn.primary', {
            id: 'runWeek', disabled: this.running,
            onclick: () => this.runWeek(G.State.current)
          }, '推演本周')));
    },

    refreshRight() {
      const s = G.State.current;
      const col = this.root.querySelector('.col-right');
      if (!col) return this.render();
      G.Theme.mount(col, G.Panels.right(s, this.rightView,
        v => { this.rightView = v; this.refreshRight(); },
        () => this.refreshRight()));
    },

    refreshLeft() {
      const s = G.State.current;
      const col = this.root.querySelector('.col-left');
      if (col) G.Theme.mount(col, G.Panels.left(s));
    },

    refreshTop() {
      const s = G.State.current;
      const bar = this.root.querySelector('.topbar');
      if (bar) bar.replaceWith(this.topbar(s));
    },

    setStage(sceneId, actors, expr) {
      this.currentScene = sceneId || this.currentScene;
      this.currentActors = actors || [];
      const s = G.State.current;
      const st = G.C.stage(s, this.currentScene, this.currentActors, null, expr);
      if (this.mainEl?.stage) {
        this.mainEl.stage.replaceWith(st);
        this.mainEl.stage = st;
      }
    },

    scrollDown() {
      const w = this.mainEl?.narrWrap;
      if (w) w.scrollTop = w.scrollHeight;
    },

    /** 清掉屏幕上所有旧的选项组，避免残留按钮被误点 */
    clearOptions() {
      this.mainEl?.narrWrap?.querySelectorAll('.options').forEach(x => x.remove());
    },

    // ---------- 开场 ----------
    openingScene(s) {
      const opening = {
        student: {
          scene: 'scene_mountain_gate',
          text: '渡船在望仙峰的石阶下靠稳。\n\n你提着行李往上走，一千二百级台阶，走到一半时回头看了一眼——云海在脚下翻涌，来时的路已经看不见了。\n\n山门前立着两尊石鹤，门匾上"云霄"二字被日光晒得发白。执事在门口点名，声音顺着风飘过来，一个一个念着今年新入院的三百个人。\n\n然后念到了你的名字。'
        },
        teacher: {
          scene: 'scene_mingde',
          text: '讲堂里空无一人。\n\n你把教案在案上摊开，又合上。窗外传来弟子们上山的脚步声，一阵一阵。\n\n第一堂课还有半个时辰。你忽然想起自己当年坐在下面的时候，最怕的是什么。'
        },
        headmaster: {
          scene: 'scene_headmaster_hall',
          text: '接任的第一个清晨。\n\n大殿很静。案上摞着七院送来的册子，最上面那一本是方砚半夜送来的——学院今年的账。\n\n你翻开第一页，看了很久，然后合上了。\n\n窗外，第一批弟子已经开始晨课。'
        }
      }[s.player.role];

      this.setStage(opening.scene, []);
      this.narr.setText(opening.text);
      this.narr.sys('<b>先在右栏排好这一周的日程，然后点右上角「推演本周」。</b><br>每个时段可以安排一件事。事件会在推演过程中插入，你只需做选择。');
      this.showIdleActions(s);
    },

    idleScreen(s) {
      this.narr.clear();
      this.narr.sys(`<b>${G.Time.shortLabel(s)}</b>　${s.player.role === 'student' ? `第 ${s.academy.year} 年弟子` : ''}`);
      this.narr.el.appendChild(G.Panels.urgentList(s));
      this.showIdleActions(s);
    },

    showIdleActions(s) {
      this.clearOptions();
      const wrap = h('.options');

      // 大型活动优先于一切
      const banner = G.FestUI.banner(s, k => G.FestUI.start(s, k));
      if (banner) wrap.appendChild(banner);

      // 有人传音
      if (s.flags._pendingMsg) {
        const card = G.DialogueUI.messageCard(s, s.flags._pendingMsg,
          () => this.playMessage(s),
          () => { G.Dialogue.ignoreMessage(s); this.refreshLeft(); this.refreshRight(); this.showIdleActions(s); });
        if (card) wrap.appendChild(card);
      }

      // 院首选拔揭晓
      if (s.player.role === 'teacher' && s.flags.head_bid_done && !s.faculty.headBid) {
        wrap.appendChild(h('button.opt', {
          style: { borderColor: 'var(--cinnabar)' },
          onclick: () => this.resolveHeadBid(s)
        }, h('span.key', '★'), '院首选拔揭晓',
           h('span.hint', '名帖已经递上去了，今日出结果')));
      }

      if (G.Cultivation.canBreakthrough(s)) {
        wrap.appendChild(h('button.opt', { onclick: () => this.openBreakthrough(s) },
          h('span.key', '※'), '尝试突破',
          h('span.hint', G.Cultivation.rateHint(G.Cultivation.successRate(s, {})))));
      }
      // 上次推到一半退出的：从断点接着走，别让玩家以为要重来一周
      const mid = s.flags._midWeek && !(s.time.day === 1 && s.time.phase === 'dawn');
      wrap.appendChild(h('button.opt', { onclick: () => this.runWeek(s) },
        h('span.key', '▷'), mid ? '接着推演本周' : '推演本周',
        h('span.hint', mid ? `上次停在${G.Time.DAY_LABEL[s.time.day - 1]}·${G.Time.PHASE_LABEL[s.time.phase]}，从这里往后走` : '按右栏日程逐日推进')));

      if (G.Time.isVacation(s)) {
        wrap.appendChild(h('button.opt', { onclick: () => G.Explore.picker(s) },
          h('span.key', '※'), '游历期 · 外出探秘境',
          h('span.hint', '七八月不上课，正是往外跑的时候')));
      }

      this.mainEl.narrWrap.appendChild(wrap);
    },

    // ---------- 周推演 ----------
    async runWeek(s) {
      s = G.State.current;
      if (this.running || !s || s.ended) return;
      // 大型活动只在当月第二到四周开放，推过第四周就错过了
      const fest = G.Festival.pending(s);
      if (fest && s.time.week === 4 && !this._festWarned) {
        this._festWarned = true;
        const name = { tourney: '七院大比', hunt: '春猎', inter: '外院交流赛' }[fest];
        G.Theme.confirm('先别急', `${name}这周是最后的机会，推过去就错过了。还是直接推演本周？`,
          () => this.runWeek(G.State.current));
        return;
      }
      this._festWarned = false;
      const token = this.beginRun();
      this.refreshTop();

      try {
        // 选项容器挂在 narrWrap 上，narr.clear() 清不掉。
        // 不显式移除的话，上一轮的"推演本周""尝试突破"会一直留在屏幕上，
        // 而且会抢在新选项前面被点到。
        this.clearOptions();
        this.narr.clear();
        const digest = [];
        G.Game.beginWeek(s);

        let guard = 0;
        while (guard++ < 300) {
          if (!this.alive(token)) return;
          const r = G.Game.step(s);
          if (!r) break;

          if (r.type === 'event') {
            if (digest.length) { this.narr.sys(digest.join('<br>')); digest.length = 0; }
            this.scrollDown();
            await this.playEvent(s, r.event, token);
            if (!this.alive(token)) return;
            // 玩家没能处理掉（界面出错等）：别让同一个事件无限循环
            if (G.Game.pending === r.event) G.Game.skipEvent(s);
            continue;
          }

          if (r.type === 'activity') {
            // 自拟时段：解析 → 判定 → 一小段叙事
            if (r.cat === 'custom' && r.detail?.custom) {
              if (digest.length) { this.narr.sys(digest.join('<br>')); digest.length = 0; }
              this.scrollDown();
              await this.playCustomSlot(s, r, token);
              continue;
            }
            // 议事会要停下来让玩家做决定
            if (r.detail?.openAgenda) {
              if (digest.length) { this.narr.sys(digest.join('<br>')); digest.length = 0; }
              this.scrollDown();
              await this.playAgenda(s, r.detail.openAgenda, token);
              continue;
            }
            const line = G.Narrator.activityLine(s, r);
            if (line) digest.push(`${G.Time.DAY_LABEL[r.slot.day - 1]}·${G.Time.PHASE_LABEL[r.slot.phase]}　${line}`);
            continue;
          }

          if (r.type === 'weekEnd') {
            if (digest.length) this.narr.sys(digest.join('<br>'));
            if (r.notes?.length) this.narr.sys('<b>本周结算</b><br>' + r.notes.join('<br>'));
            break;
          }

          if (r.type === 'ended') {
            this.endRun(token);
            return this.showEnding(r.ending);
          }
        }
      } catch (e) {
        return this.fail(e, token);
      }

      if (!this.alive(token)) return;
      this.endRun(token);
      this.refreshLeft();
      this.refreshRight();
      this.refreshTop();
      this.narr.el.appendChild(G.Panels.urgentList(s));
      this.showIdleActions(s);
      this.scrollDown();
      this.maybeMessage(s);
    },

    /** 呈现一个事件：开场 → （有模型时）对话场 → 玩家选择 → 渲染结果 */
    playEvent(s, ev, token) {
      return new Promise(async resolve => {
        let finished = false;
        const done = () => { if (!finished) { finished = true; resolve(); } };
        // 任何一步抛错都要把流程交回去，否则 runWeek 永远等在这里
        const safely = fn => async (...a) => {
          try { await fn(...a); }
          catch (e) { console.error(e); this.narr.sys('<span style="color:var(--cinnabar)">这件事没能好好收尾，先往下走。</span>'); G.Game.skipEvent(s); }
          finally { done(); }
        };

        try {
          this.clearOptions();
          this.setStage(ev.scene, ev.actors);

          // 事件开场
          this.narr.append('');
          this.narr.el.appendChild(h('p', ev.seed || ''));
          this.scrollDown();

          // 对话场：事件里的人先开口，玩家亲口回应。聊得好坏会带进后面的判定。
          let extra = null;
          if (G.Dialogue.enabled(s, ev)) {
            try {
              const ss = G.Dialogue.begin(s, {
                kind: 'event', npcId: ev.actors[0], event: ev, scene: G.Narrator.sceneOf(s, ev)
              });
              await G.DialogueUI.run(s, ss, null);
              if (!this.alive(token)) return done();
              if (ss.turns.some(t => t.who === 'player')) {
                const facts = G.Dialogue.settle(s, ss);
                const mod = G.Dialogue.modifier(ss);
                extra = { mods: [mod], dialogue: ss, dialogueFacts: facts };
                // 聊过之后，选项下面那行"有几分把握"要跟着变——这是玩家能感到"说话有用"的地方
                for (const o of ev.options) {
                  if (o.check) o._hint = G.Check.vagueHint({ ...o.check, reason: (o.reason || 0) + mod });
                }
                this.narr.el.appendChild(h('.dl-mod',
                  G.Dialogue.hint(s, ss) + (ss.applied?.length ? '　' + ss.applied.join('　') : '') + '。你打算——'));
                this.refreshLeft();
              } else if (ss.turns.length) {
                this.narr.el.appendChild(h('.dl-mod', '你打算——'));
              }
              this.scrollDown();
            } catch (e) {
              console.error('[dialogue]', e);   // 对话场坏了不影响做选择
            }
          }

          const pickOpt = safely(async id => { await this.resolveAndRender(s, ev, id, null, extra, token); });
          const oops = e => {
            console.error(e);
            this.narr.sys('<span style="color:var(--cinnabar)">这件事没能好好收尾，先往下走。</span>');
            G.Game.skipEvent(s);
          };
          const onCustom = async text => {
            try {
              const intent = await this.withSlowHint(() => G.Narrator.parseCustom(s, text, ev));
              if (!this.alive(token)) return done();
              if (intent.violatesRules) {
                this.narr.el.appendChild(h('p', intent.rejectReason));
                this.scrollDown();
                // 越界不消耗回合，重新给选项；第二次再越界就按普通自定义处理
                const again = G.C.options(ev, pickOpt, async t2 => {
                  try {
                    const i2 = await this.withSlowHint(() => G.Narrator.parseCustom(s, t2, ev));
                    if (this.alive(token)) await this.resolveAndRender(s, ev, 'E', i2.violatesRules ? null : i2, extra, token);
                  } catch (e) { oops(e); }
                  finally { done(); }
                });
                this.mainEl.narrWrap.appendChild(again);
                this.scrollDown();
                return;
              }
              await this.resolveAndRender(s, ev, 'E', intent, extra, token);
            } catch (e) { oops(e); }
            done();
          };

          const opts = G.C.options(ev, pickOpt, onCustom);
          this.mainEl.narrWrap.appendChild(opts);
          this.scrollDown();
        } catch (e) {
          console.error(e);
          G.Game.skipEvent(s);
          done();
        }
      });
    },

    /** 包一层"模型慢了可以不等"的提示；提示挂在叙事区最后一行 */
    async withSlowHint(fn, anchor) {
      let el = anchor;
      if (!el) { el = h('p.sys.loading.dots', '琢磨'); this.narr.el.appendChild(el); this.scrollDown(); }
      const stop = this.slowHint(el);
      try { return await fn(); }
      finally { stop(); if (!anchor) el.remove(); }
    },

    /** 回一道传音：自由对话，聊完按聊得好坏结算关系 */
    async playMessage(s) {
      const msg = s.flags._pendingMsg;
      if (!msg || this.running) return;
      const npc = G.NPC.get(msg.npcId);
      if (!npc) { G.Dialogue.ignoreMessage(s); return this.showIdleActions(s); }
      const token = this.beginRun();
      this.refreshTop();
      try {
        this.clearOptions();
        this.narr.clear();

        const sceneId = G.DATA.static.collegeScene[npc.college] || 'scene_main_plaza';
        this.setStage(sceneId, [msg.npcId]);
        this.narr.sys(`<b>传音符 · ${npc.name}</b>`);

        const ss = G.Dialogue.begin(s, {
          kind: 'message', npcId: msg.npcId, event: null,
          scene: { id: sceneId, name: G.DATA.static.scenes.find(x => x.id === sceneId)?.name || '' }
        });
        await G.DialogueUI.run(s, ss, msg.text);
        if (!this.alive(token)) return;
        if (ss.turns.some(t => t.who === 'player')) {
          G.Dialogue.settleMessage(s, ss);
          this.narr.sys(G.Dialogue.hint(s, ss) + (ss.applied?.length ? '　' + ss.applied.join('　') : ''));
        } else {
          // 一句没说就走了，等同不理会
          G.Dialogue.ignoreMessage(s);
        }
      } catch (e) {
        return this.fail(e, token);
      }
      this.endRun(token);
      this.refreshLeft(); this.refreshRight(); this.refreshTop();
      this.showIdleActions(s);
      this.scrollDown();
    },

    /** 周末结算后，看看有没有人来传音。有模型才会有；没有就静悄悄的。 */
    async maybeMessage(s) {
      try {
        const id = G.Dialogue.drawMessenger(s);
        if (!id) return;
        const msg = await G.Dialogue.composeMessage(s, id);
        if (!msg || this.running || G.State.current !== s) return;
        G.Theme.toast(`收到一道传音符 · ${G.NPC.name(id)}`);
        this.showIdleActions(s);
        this.refreshRight();
        this.scrollDown();
      } catch (e) { console.warn('[message]', e); }
    },

    /** 自拟时段：一句话的安排，解析成行动，判定，写一小段 */
    async playCustomSlot(s, r, token) {
      const text = r.detail.custom;
      const when = `${G.Time.DAY_LABEL[r.slot.day - 1]}·${G.Time.PHASE_LABEL[r.slot.phase]}`;
      const box = h('.custom-slot', h('.cs-head', when, '　你自行安排：', h('b', text)));
      this.narr.el.appendChild(box);
      this.scrollDown();

      const intent = await this.withSlowHint(() => G.Narrator.parseCustom(s, text, null));
      if (!this.alive(token)) return;
      const res = G.Game.resolveCustom(s, text, intent);

      if (res.rejected) {
        this.narr.el.appendChild(h('p', res.reason));
        this.narr.sys('这个时段就这么过去了。');
        this.scrollDown();
        return;
      }

      // 有人在场就把 TA 请上台
      const target = (intent.targets || [])[0];
      if (target) this.setStage(null, [target], { [target]: G.C.exprFor(res.grade) });

      const payload = {
        state: s,
        scene: G.Narrator.sceneOf(s, null),
        facts: res.facts,
        event: { seed: `你打算：${text}`, actors: target ? [target] : [] },
        grade: res.grade,
        outcome: { text: `${intent.summary}——${G.Check.GRADE_LABEL[res.grade]}` },
        actors: target ? [target] : [],
        memory: G.Memory.build(s),
        important: false,
        style: { length: 260 }
      };
      const p = h('p');
      const loading = h('p.sys.loading.dots', '落笔');
      this.narr.el.appendChild(loading);
      this.narr.el.appendChild(p);
      const stop = this.slowHint(loading);
      let narrText;
      try {
        narrText = await G.Narrator._render(payload, (piece, full) => { loading.remove(); p.textContent = full; this.scrollDown(); });
      } finally { stop(); loading.remove(); }
      if (!this.alive(token)) return;
      p.remove();
      G.Theme.paragraphs(narrText).forEach(pp => this.narr.el.appendChild(h('p', pp)));
      this.narr.sys(`判定：<b>${G.Check.GRADE_LABEL[res.grade]}</b>` + (res.applied.length ? '　' + res.applied.join('　') : ''));
      G.Memory.push(s, res.facts, narrText.slice(0, 120));
      this.refreshLeft();
      this.scrollDown();
    },

    /** 院主议事：呈现议题 → 玩家表决 → 结算 */
    playAgenda(s, agenda, token) {
      return new Promise(resolve => {
        this.clearOptions();
        this.setStage('scene_headmaster_hall', ['npc_chuheshan', 'npc_bailuqing']);
        this.narr.el.appendChild(h('p.sys', { html: `<b>院务议事 · ${agenda.name}</b>` }));
        this.narr.el.appendChild(h('p', agenda.text));
        this.scrollDown();

        const wrap = h('.options');
        const affordable = agenda.options.filter(o => !(o.privy && s.gov.privy < o.privy));
        for (const o of agenda.options) {
          const hint = [];
          if (o.privy) hint.push(`动用私库 ${o.privy}`);
          if (o.budget) hint.push(`腾出预算 ${o.budget * 50}`);
          if (o.college) hint.push(`${G.State.collegeOf(o.college).name}会很不满`);
          if (o.spread) hint.push('七院各担一点');
          if (o.faction) hint.push(G.DATA.static.factionLabel[o.faction] + '会记你这份');
          if (o.reform) hint.push('算一项改革');

          wrap.appendChild(h('button.opt', {
            // 一个都付不起时全部放开，不能让议事卡在这里
            disabled: affordable.length > 0 && o.privy && s.gov.privy < o.privy,
            onclick: () => {
              wrap.querySelectorAll('button').forEach(b => b.disabled = true);
              try {
                const r = G.Governance.resolveAgenda(s, agenda, o.id);
                this.narr.el.appendChild(h('p', '你的决定：' + o.text));
                this.narr.sys(
                  `判定：<b>${G.Check.GRADE_LABEL[r.grade]}</b>` +
                  (r.notes.length ? '<br>' + r.notes.join('<br>') : '') +
                  `<br>七院人心：${r.unrest}（${G.Governance.moodName(r.unrest).name}）`);
                this.refreshLeft();
                this.scrollDown();
              } catch (e) { console.error(e); }
              setTimeout(resolve, 320);
            }
          }, h('span.key', o.id), o.text,
             hint.length ? h('span.hint', hint.join(' · ')) : null));
        }
        this.mainEl.narrWrap.appendChild(wrap);
        this.scrollDown();
      });
    },

    async resolveAndRender(s, ev, optionId, intent, extra, token) {
      // 铁律：先 commit，再叙事。叙事失败不影响状态。
      const res = G.Game.resolveEvent(s, optionId, intent, extra?.mods || null);
      if (!res) return;

      // 判定结果决定立绘表情；没有对应表情图时会自动回退到 calm
      this.setStage(ev.scene, ev.actors, G.C.exprFor(res.grade));

      this.clearOptions();

      const loading = h('p.sys.loading.dots', '推演中');
      this.narr.el.appendChild(loading);
      this.scrollDown();
      const stop = this.slowHint(loading);

      let started = false;
      const target = h('p');
      let text;
      try {
        text = await G.Narrator.renderResolution(s, res, (piece, full) => {
          if (!this.alive(token)) return;
          if (!started) { loading.remove(); this.narr.el.appendChild(target); started = true; }
          const parts = G.Theme.paragraphs(full);
          target.textContent = parts[parts.length - 1] || '';
          // 前面的段落补齐
          while (this.narr.el.querySelectorAll('p.streamed').length < parts.length - 1) {
            const i = this.narr.el.querySelectorAll('p.streamed').length;
            const el = h('p.streamed', parts[i]);
            this.narr.el.insertBefore(el, target);
          }
          this.scrollDown();
        }, extra);
      } finally { stop(); }
      if (!this.alive(token)) return;

      loading.remove();
      target.remove();
      this.narr.el.querySelectorAll('p.streamed').forEach(x => x.remove());
      G.Theme.paragraphs(text).forEach(pp => this.narr.el.appendChild(h('p', pp)));

      if (res.applied.length) {
        this.narr.sys(res.applied.join('　'));
      }
      if (G.Narrator.lastError) {
        this.narr.sys(/^没等模型/.test(G.Narrator.lastError)
          ? '<span class="muted">（这段用的是内置文本）</span>'
          : '<span style="color:var(--cinnabar)">叙事生成失败，已用内置文本代替：' + G.Narrator.lastError + '</span>');
      }

      this.refreshLeft();
      this.scrollDown();
    },

    // ---------- 突破 ----------
    openBreakthrough(s) {
      const opts = { place: 'dorm', pill: null, guardian: null };
      const body = h('div');
      const rateLine = h('.tiny.muted');

      const update = () => {
        rateLine.textContent = G.Cultivation.rateHint(G.Cultivation.successRate(s, opts));
      };

      const placeRow = h('.btn-row', ...[['dorm', '宿舍'], ['hall', '静修室'], ['vein', '灵脉节点']].map(([k, n]) =>

      const pillRow = h('.btn-row',
        h('button.btn', {
          disabled: !hasPill,
          onclick: e => {
            opts.pill = opts.pill ? null : 'pozhang_dan';
            e.target.className = 'btn' + (opts.pill ? ' primary' : '');
            update();
          }
        }, hasPill ? '服破障丹（+20%）' : '无破障丹'));

      const guardRow = h('.btn-row', ...G.NPC.classmates(s).slice(0, 4).map(n =>
        h('button.btn', {
          onclick: e => {
            const r = s.relations[n.id];
            if (r.favor < 40) { G.Theme.toast(`${n.name}与你交情尚浅，未必肯来`); return; }
            opts.guardian = opts.guardian === n.id ? null : n.id;
            guardRow.querySelectorAll('button').forEach(b => b.className = 'btn');
            if (opts.guardian) e.target.className = 'btn primary';
            update();
          }
        }, n.name)));

      G.Theme.mount(body,
        h('.panel-title', '突破地点'), placeRow,

        h('.panel-title', { style: { marginTop: '14px' } }, '请人护法（需好感 40 以上）'), guardRow,
        h('hr.hr'), rateLine,
        h('.tiny.muted', { style: { marginTop: '8px' } },
          '突破需先过心魔关。心魔来自你此前的经历——它不会凭空出现，也不会因为准备充分就消失。'));
      update();

      G.Theme.modal('尝试突破', G.State.realmName(s.cultivation.realm, s.cultivation.layer) + ' → 更上一层', body, [
        { label: '再等等' },

    async runBreakthrough(s, opts) {
      if (this.running) return;
      // 心魔关走完之前算作「推演中」：顶栏推演会灰掉，免得把 A/B/C 冲掉
      const token = this.beginRun();
      this.refreshTop();
      try {
        await this._runBreakthrough(s, opts, token);
      } catch (e) {
        this.fail(e, token);
      }
    },

    async _runBreakthrough(s, opts, token) {
      // 空闲选项（"尝试突破""推演本周"）挂在 narrWrap 上，narr.clear() 清不掉，
      // 不清的话它们会一直排在心魔关的 A/B/C 前面
      this.clearOptions();
      this.narr.clear();
      this.setStage(opts.place === 'hall' ? 'scene_meditation_hall' : 'scene_dorm_room', []);

      const bt = G.Cultivation.beginBreakthrough(s, opts);
      this.narr.setText(bt.hint);

      const loading = h('p.sys.loading.dots', '入定');
      this.narr.el.appendChild(loading);
      this.scrollDown();

      const stop = this.slowHint(loading);
      const trialText = await G.Narrator.renderDemonTrial(s, bt.trial, null).finally(stop);
      if (!this.alive(token)) return;
      loading.remove();
      G.Theme.paragraphs(trialText).forEach(p => this.narr.el.appendChild(h('p', p)));
      this.scrollDown();

      // 与心魔对峙：它开口，你回它。稳住了，成功率会好一点，最险的那条路也不至于直接走火。
      let steady = null;
      if (G.LLM.configured && G.LLM.config.enabled && G.LLM.config.dialogue !== false) {
        const npc = bt.trial.npc;
        if (npc) {
          this.setStage(null, [npc.id], { [npc.id]: 'emotion' });
          this.mainEl?.stage?.classList.add('haunt');   // 幻象：立绘褪色
        }
        const ss = G.Dialogue.begin(s, {
          kind: 'demon', npcId: null, trial: bt.trial, maxTurns: 3,
          speaker: { name: npc ? npc.name + '（幻象）' : '心魔' }
        });
        await G.DialogueUI.run(s, ss, null);
        if (!this.alive(token)) return;
        if (ss.turns.some(t => t.who === 'player')) {
          steady = G.Demon.steadiness(s, bt.trial, ss.rapport);
          this.narr.el.appendChild(h('.dl-mod',
            G.Dialogue.hint(s, ss) +
            (steady.demon ? `　心魔${steady.demon > 0 ? '+' : ''}${steady.demon}` : '') +
            (steady.saves ? '　哪怕走最险的那条路，也不会直接走火' : '') + '。'));
          G.Memory.push(s, [`突破时与心魔对峙：${G.Dialogue.hint(s, ss)}`], '');
          this.refreshLeft();
          this.scrollDown();
        }
      }

      const wrap = h('.options');
      bt.trial.choices.forEach((c, i) => {
        wrap.appendChild(h('button.opt', {
          onclick: async () => {
            if (!this.alive(token)) return;
            wrap.remove();
            try {
              const applied = G.Demon.applyChoice(s, bt.trial, c.tag);
              if (steady) applied.rateMod += steady.rateMod;
              const res = G.Cultivation.resolveBreakthrough(s, applied);
              this.endRun(token);
              await this.showBreakthroughResult(s, res);
            } catch (e) { this.fail(e, token); }
          }
        }, h('span.key', 'ABC'[i]), c.text));
      });
      this.mainEl.narrWrap.appendChild(wrap);
      this.scrollDown();
    },

    async showBreakthroughResult(s, res) {
      const txt = {
        great: `灵气破关而入的那一刻，你听见了什么东西碎裂的声音——是旧的自己。\n\n你睁开眼，${res.realmAfter}。而且不止如此，有些从前想不通的地方，忽然通了。`,
        success: `最后一道滞涩被冲开了。\n\n你睁开眼，${res.realmAfter}。窗外天色不知何时已经变了。`,
        fail: `灵气在最后关头散了。\n\n你吐出一口浊气，浑身像被抽空。修为回退了一截，还得休养一阵。\n\n没关系。这条路本来就不是一次能走完的。`,
        deviation: `灵气逆冲而上。\n\n你听见自己的经脉在响，眼前一片赤红。有人在喊你的名字，但声音很远。\n\n等你再有意识时，已经躺在丹霞院的床上了。`
      }[res.outcome];

      G.Theme.paragraphs(txt).forEach(p => this.narr.el.appendChild(h('p', p)));
      if (res.attrGained) {
        this.narr.sys(`你对<b>${G.State.ATTR_LABEL[res.attrGained]}</b>有了新的领悟。`);
      }
      if (res.outcome === 'deviation') {
        G.State.logLine('走火入魔', 'danger');
        if (s.cultivation.demonHeart >= 95) {
          G.State.commit([{ path: 'flags.deviation_fatal', op: 'set', value: true }], 'fatal');

      this.refreshLeft();
      this.refreshTop();
      this.scrollDown();

      if (G.Ending.shouldEnd(s)) {
        setTimeout(() => this.showEnding(G.Ending.finish(s)), 1200);

        this.showIdleActions(s);

(function (G) {
  'use strict';

  G.DEBUG_COMMIT = false;

  /* 禁止手机上的缩放。
   *
   * 光靠 viewport 的 user-scalable=no 是不够的——iOS 10 之后 Safari 出于
   * 无障碍考虑直接忽略这个字段。要真正挡住，得堵三条路：
   *   1. 双指捏合    → Safari 私有的 gesture* 事件，preventDefault 掉
   *   2. 双指 touch  → 有些内核不走 gesture*，直接拦 touchstart 的多指
   *   3. 双击放大    → 300ms 内的第二次 tap，拦掉
   * CSS 那边还有 touch-action，两头一起兜。
   *
   * 输入框例外：iOS 聚焦输入框时会自动放大页面，那是 font-size < 16px 引起的，
   * 已经在 CSS 里把表单字号提到 16px，不需要在这里拦。
   */
  function lockZoom() {
    const stop = e => e.preventDefault();
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(t =>
      document.addEventListener(t, stop, { passive: false }));

    document.addEventListener('touchstart', e => {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    let lastTap = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTap < 300) e.preventDefault();   // 双击放大
      lastTap = now;
    }, { passive: false });
  }

  function start() {
    lockZoom();

    const root = document.getElementById('app');
    if (!root) return console.error('缺少 #app 容器');

    // 全局错误兜底：叙事层出错不应该让整个游戏卡死
    window.addEventListener('error', e => {
      console.error('[未捕获错误]', e.error || e.message);
    });
    window.addEventListener('unhandledrejection', e => {
      console.error('[未处理的 Promise 拒绝]', e.reason);
      if (G.UI && G.UI.running) {
        G.UI.running = false;
        G.Theme.toast('推演中断，可以重试', 'danger');
        G.UI.refreshTop && G.UI.refreshTop();
      }
    });

    // 快捷键
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      const opts = document.querySelectorAll('.options .opt');
      const key = e.key.toUpperCase();
      if (/^[A-E]$/.test(key)) {
        for (const o of opts) {
          const k = o.querySelector('.key');
          if (k && k.textContent.trim() === key && !o.disabled) { o.click(); e.preventDefault(); return; }
        }
      }
      if (e.key === 'Enter' && !e.metaKey) {
        const run = document.getElementById('runWeek');
        if (run && !run.disabled) { run.click(); e.preventDefault(); }
      }
    });

    G.UI.boot(root);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();

  // 供控制台调试：G.dev.autoPlay(50)
  G.dev = {
    autoPlay(n) {
      const s = G.State.current;
      if (!s) return console.warn('还没有存档');
      for (let i = 0; i < (n || 10); i++) {
        const r = G.Game.autoWeek(s);
        if (r.type === 'ended') { console.log('结局：', r.ending.name); break; }
      }
      G.UI.render();
      return s;
    },
    state() { return G.State.current; },
    tokens() {
      const s = G.State.current;
      return G.Memory.estimateTokens(s, {
        state: s, scene: { name: '测试' }, facts: ['测试'],
        actors: [], memory: G.Memory.build(s)
      });
    }
  };

})(window.G = window.G || {});

</script>
</body>
