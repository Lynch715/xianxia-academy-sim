/* ===== systems/rumor.js — 传闻 =====
 * 你对一个人做的事，会顺着社交圈传到别人耳朵里。
 *
 *   来源  事件结算（圆满/糟糕）、对话场（聊得特别好/特别僵）、切磋赢了、背后议论、违心之事
 *   传播  每周结算时按"同院 > 同为弟子 > 其他"的亲疏往外走一两个人，八周后自然消散
 *   影响  听到的人按传闻性质和自己的性格改观——全是 ±3 以内的小数目，但会累积成一张网
 *   出口  对话场与传音的 prompt 里带上"TA 听说过的关于你的事"，人物会自己提起；
 *         关系面板与「当下要紧」也能看到
 *   反制  找听过负面传闻的人好好谈一次（对话 rapport ≥ 3），那条传闻对 TA 的影响退还一半
 *
 * 全部本地裁决，不花 token。传闻文本是模板，不带任何人的秘密——
 * 秘密只在交心时给玩家，不会因为传闻系统而泄露。
 */
(function (G) {
  'use strict';

  const MAX_ACTIVE = 8;
  const LIFE_WEEKS = 8;

  /* kind → 文本、传播力、对听者的影响 */
  const KINDS = {
    close:  { text: (p, x) => `${p}和${x}走得很近`,         juicy: 2, favor: 0,  trust: 0,  awe: 0, negative: false },
    kind:   { text: (p, x) => `${p}帮了${x}一把`,           juicy: 1, favor: 2,  trust: 1,  awe: 0, negative: false },
    strong: { text: (p, x) => `${p}切磋赢了${x}`,           juicy: 1, favor: 0,  trust: 0,  awe: 2, negative: false },
    clash:  { text: (p, x) => `${p}和${x}闹得很不愉快`,     juicy: 1, favor: -1, trust: -1, awe: 0, negative: true },
    cruel:  { text: (p, x) => `${p}对${x}做了件不地道的事`, juicy: 2, favor: -3, trust: -2, awe: 0, negative: true },
    shady:  { text: (p)    => `${p}做了件说不出口的事`,     juicy: 2, favor: -2, trust: -2, awe: 0, negative: true }
  };

  const Rumor = {
    KINDS, MAX_ACTIVE, LIFE_WEEKS,

    list(s) { return s.rumors || (s.rumors = []); },

    week(s) { return Math.floor(s.time.absoluteTurn / 21); },

    /** 起一条传闻。同一人同一性质四周内只算一条（加传播力）。 */
    add(s, kind, subjectId) {
      const K = KINDS[kind];
      if (!K) return null;
      if (subjectId && !G.NPC.get(subjectId)) subjectId = null;
      if (!subjectId && kind !== 'shady') return null;
      const list = this.list(s);
      const wk = this.week(s);

      const dup = list.find(r => r.kind === kind && r.subject === subjectId && wk - r.week < 4);
      if (dup) { dup.juicy = Math.min(3, dup.juicy + 1); return dup; }

      const r = {
        id: `r_${wk}_${kind}_${subjectId || 'x'}_${list.length}`,
        kind, subject: subjectId, week: wk,
        text: K.text(s.player.name, subjectId ? G.NPC.name(subjectId) : ''),
        juicy: K.juicy,
        heard: [],      // 已经听说的 NPC
        cleared: []     // 已经被你当面解释过的 NPC
      };
      list.push(r);
      while (list.length > MAX_ACTIVE) list.shift();
      G.State.commit([{ path: 'rumors', op: 'set', value: list },
                      { path: 'flags._rumorTotal', op: 'add', value: 1 }], 'rumor.add');
      return r;
    },

    /** 事件结算后：圆满/糟糕、以及违心之事，才值得被人说 */
    fromEvent(s, ev, opt, grade, outcome, applied) {
      const subject = (ev.actors || [])[0];
      const effs = outcome?.effects || [];
      if (effs.some(e => e.type === 'demon' && e.value > 0 && e.source === 'guilt')) {
        return this.add(s, subject ? 'cruel' : 'shady', subject);
      }
      if (!subject) return null;
      const social = ['social', 'romance', 'love', 'bond', 'life', 'trial'].includes(ev.category) || ev.dynamicActor;
      if (!social) return null;
      const favorUp = effs.some(e => e.type === 'relation' && (e.favor || 0) >= 8);
      const favorDown = effs.some(e => e.type === 'relation' && (e.favor || 0) <= -5);
      if (grade === 'perfect' && favorUp) return this.add(s, ev.dynamicActor ? 'close' : 'kind', subject);
      if (grade === 'terrible' && favorDown) return this.add(s, 'clash', subject);
      return null;
    },

    /** 对话场结算后：聊得特别好/特别僵 */
    fromDialogue(s, ss) {
      if (ss.kind === 'demon' || !ss.npcId) return null;
      if (ss.rapport >= 5) return this.add(s, 'close', ss.npcId);
      if (ss.rapport <= -5) return this.add(s, 'clash', ss.npcId);
      return null;
    },

    /** 听者对某条传闻的反应。性格与阵营只做小幅修正，方向不变。 */
    reaction(s, npcId, r) {
      const K = KINDS[r.kind];
      const npc = G.NPC.get(npcId);
      let favor = K.favor, trust = K.trust, awe = K.awe;
      const dislikes = (npc.dislikes || []).join(' ');

      if (r.kind === 'close') {
        // 有意的人会吃醋；不爱站队的人无所谓
        const rel = s.relations[npcId];
        if (npc.romanceable && rel && rel.favor >= 55 && npcId !== r.subject) favor = -2;
      }
      if (K.negative) {
        if (npc.faction === 'traditional') { favor -= 1; trust -= 1; }
        if (/背后议论|投机|撒谎|不地道/.test(dislikes)) trust -= 1;
        if (npc.faction === 'xiaoyao') favor = Math.round(favor / 2);
        // 出事的人是 TA 同院的，TA 更在意
        const sub = r.subject ? G.NPC.get(r.subject) : null;
        if (sub && sub.college && sub.college === npc.college) favor -= 1;
      }
      if (r.kind === 'strong') {
        if (/以多欺少|争强/.test(dislikes)) awe = 1;
        if (npc.track !== 'student') awe = 0;   // 教习不会因为弟子切磋赢了而敬畏
      }
      return {
        favor: Math.max(-4, Math.min(3, favor)),
        trust: Math.max(-3, Math.min(2, trust)),
        awe: Math.max(0, Math.min(3, awe))
      };
    },

    /** 某人听说了某条传闻 */
    hear(s, npcId, r) {
      if (r.heard.includes(npcId)) return;
      r.heard.push(npcId);
      const d = this.reaction(s, npcId, r);
      const deltas = [];
      if (d.favor) deltas.push({ path: `relations.${npcId}.favor`, op: 'add', value: d.favor, clamp: [-100, 100] });
      if (d.trust) deltas.push({ path: `relations.${npcId}.trust`, op: 'add', value: d.trust, clamp: [0, 100] });
      if (d.awe)   deltas.push({ path: `relations.${npcId}.awe`,   op: 'add', value: d.awe,   clamp: [0, 100] });
      if (d.favor) deltas.push({ path: 'flags._rumorFavor', op: 'add', value: d.favor });   // 统计用
      if (deltas.length) G.State.commit(deltas, 'rumor.hear');
    },

    /** 每周结算：每条活着的传闻往外走一两个人；到寿命就散了 */
    weeklyTick(s) {
      const list = this.list(s);
      if (!list.length) return [];
      const wk = this.week(s);
      const notes = [];
      const alive = [];

      for (const r of list) {
        if (wk - r.week > LIFE_WEEKS) continue;
        alive.push(r);
        const sub = r.subject ? G.NPC.get(r.subject) : null;
        const cands = G.DATA.npcs.filter(n =>
          n.id !== r.subject && !r.heard.includes(n.id) && G.NPC.available(s, n.id) && n.id !== 'npc_tantaiwujiu');
        if (!cands.length) continue;
        const n = Math.min(cands.length, r.juicy >= 2 ? 2 : 1);
        const picked = G.rng.sample(cands, n, c => {
          let w = 1;
          if (sub && sub.college && c.college === sub.college) w += 2;
          if (sub && c.track === sub.track) w += 1;
          if (c.track === 'student') w += 0.5;              // 弟子之间话最多
          if ((c.dislikes || []).join(' ').includes('背后议论')) w *= 0.5;
          return w;
        });
        for (const c of picked) this.hear(s, c.id, r);
        // 传开了就给玩家一句，让他知道网在动
        if (r.heard.length === 3 && r.kind !== 'kind' && r.kind !== 'strong') notes.push(`院里开始有人说：${r.text}。`);
      }

      if (alive.length !== list.length) {
        G.State.commit([{ path: 'rumors', op: 'set', value: alive }], 'rumor.expire');
      } else if (alive.length) {
        G.State.commit([{ path: 'rumors', op: 'set', value: alive }], 'rumor.spread');
      }
      return notes;
    },

    /** 某人听说过的关于你的事（给 prompt 与关系卡用），新的在前 */
    heardBy(s, npcId, limit) {
      return this.list(s).filter(r => r.heard.includes(npcId) && !r.cleared.includes(npcId))
        .slice().reverse().slice(0, limit || 3);
    },

    /** 当面解释：负面传闻对这个人的影响退还一半，只退一次 */
    clearFor(s, npcId) {
      const out = [];
      for (const r of this.list(s)) {
        if (!KINDS[r.kind].negative) continue;
        if (!r.heard.includes(npcId) || r.cleared.includes(npcId)) continue;
        const d = this.reaction(s, npcId, r);
        const fav = Math.ceil(-d.favor / 2), tru = Math.ceil(-d.trust / 2);
        const deltas = [];
        if (fav) deltas.push({ path: `relations.${npcId}.favor`, op: 'add', value: fav, clamp: [-100, 100] });
        if (tru) deltas.push({ path: `relations.${npcId}.trust`, op: 'add', value: tru, clamp: [0, 100] });
        if (deltas.length) G.State.commit(deltas, 'rumor.clear');
        r.cleared.push(npcId);
        out.push(r);
      }
      if (out.length) G.State.commit([{ path: 'rumors', op: 'set', value: this.list(s) }], 'rumor.cleared');
      return out;
    },

    /** 给玩家看的：传开了的那些 */
    summary(s) {
      const wk = this.week(s);
      return this.list(s)
        .filter(r => r.heard.length >= 2)
        .map(r => ({ id: r.id, text: r.text, kind: r.kind, negative: KINDS[r.kind].negative,
                     spread: r.heard.length, age: wk - r.week }))
        .reverse();
    }
  };

  G.Rumor = Rumor;

})(window.G = window.G || {});

(function (G) {
  'use strict';

  const LINES = {
    seal: {
      name: '封印之下',

      deductions: [

        { need: ['上古灵根实验记录', '苏暮寒的丹方'], gain: 25, text: '她的丹方是从那份记录上抄下来的，只改了一味药。她一直在往回走。' }
      ]
    }
  };

  const Storyline = {
    LINES,

    /** 每次 commit 后自动调用 */
    check(s) {
      if (!s.storylines) return;
      for (const k in LINES) {
        const sl = s.storylines[k];
        if (!sl || sl.unlocked) continue;
        try {
          if (LINES[k].unlock(s)) {
            sl.unlocked = true;
            s.log.push({ t: s.time.absoluteTurn, text: `【暗线浮现】${LINES[k].name}`, kind: 'major' });
          }
        } catch (e) { /* 条件依赖的字段还没生成，跳过 */ }
      }
    },

    addClue(s, key, clue, progress) {
      const deltas = [
        { path: `storylines.${key}.clues`, op: 'push', value: clue, unique: true },
        { path: `storylines.${key}.progress`, op: 'add', value: progress || 5, clamp: [0, 100] }
      ];
      G.State.commit(deltas, 'storyline.clue');

      // 不自动推论——把这一步留给玩家，才有解谜感。
      // 但要给一个明确的提示，否则玩家不会想到去点。
      const ready = this.availableDeductions(s, key)
        .find(d => !d.done && d.have.length === d.need.length);
      if (ready) {
        G.State.logLine(`【${LINES[key].name}】手上的线索似乎能串起来了`, 'major');
      }
      return ready ? { ready: true, index: ready.index } : null;
    },

    /** 检查是否凑齐可推论的线索组合 */
    tryDeduce(s, key) {
      const sl = s.storylines[key];
      const line = LINES[key];
      if (!sl || !line) return null;
      for (let i = 0; i < line.deductions.length; i++) {
        const d = line.deductions[i];
        const done = s.flags[`deduce_${key}_${i}`];
        if (done) continue;
        if (d.need.every(c => sl.clues.includes(c))) {
          G.State.commit([
            { path: `storylines.${key}.progress`, op: 'add', value: d.gain, clamp: [0, 100] },
            { path: `flags.deduce_${key}_${i}`, op: 'set', value: true }
          ], 'storyline.deduce');
          G.State.logLine(`【推论】${d.text}`, 'major');
          return d;
        }
      }
      return null;
    },

    /** 是否有可立即推论的组合（供 UI 提示徽标） */
    hasPendingDeduction(s) {
      for (const k in LINES) {
        if (!s.storylines[k]?.unlocked) continue;
        if (this.availableDeductions(s, k).some(d => !d.done && d.have.length === d.need.length)) return true;
      }
      return false;
    },

    /** 玩家主动尝试推论（在暗线面板点击） */
    availableDeductions(s, key) {
      const sl = s.storylines[key];
      const line = LINES[key];
      if (!sl || !line) return [];
      return line.deductions.map((d, i) => ({
        index: i,
        need: d.need,
        have: d.need.filter(c => sl.clues.includes(c)),
        done: !!s.flags[`deduce_${key}_${i}`]
      }));
    },

    summary(s) {
      return Object.keys(LINES).map(k => ({
        key: k,
        name: LINES[k].name,
        hint: LINES[k].hint,
        unlocked: s.storylines[k].unlocked,
        progress: s.storylines[k].progress,
        clues: s.storylines[k].clues
      }));
    },

    maxProgress(s) {
      return Math.max(...Object.keys(LINES).map(k => s.storylines[k].progress));
    }
  };

  G.Storyline = Storyline;

})(window.G = window.G || {});

/* ===== systems/quest.js — 悬赏任务 · 试炼塔 · 秘境探索 ===== */
(function (G) {
  'use strict';

  const TIERS = {
    jia:  { name: '甲等', stone: [300, 600], contrib: 100, difficulty: 70, risk: 40,
            samples: ['击退入侵妖兽', '护送贵客下山', '清剿盘踞外域的兽群'] },
    yi:   { name: '乙等', stone: [100, 300], contrib: 50,  difficulty: 55, risk: 20,
            samples: ['采集雪顶灵芝', '调查后山异象', '追回逃逸的灵兽'] },
    bing: { name: '丙等', stone: [30, 100],  contrib: 20,  difficulty: 35, risk: 3,
            samples: ['整理藏经阁', '协助丹房看火', '看守灵兽园一夜'] },
    te:   { name: '特等', stone: [1500, 3000], contrib: 500, difficulty: 88, risk: 75,
            samples: ['院主亲自下发的秘密任务'] }
  };

  const Quest = {
    TIERS,

    /** 玩家可接的最高等级 */
    maxTier(s) {
      const i = G.State.realmIndex(s.cultivation.realm);
      const layer = s.cultivation.layer;
      if (i >= 2) return 'te';
      if (i >= 1) return 'jia';
      if (layer >= 6) return 'yi';
      return 'bing';
    },

    board(s) {
      const max = this.maxTier(s);
      const order = ['bing', 'yi', 'jia', 'te'];
      const allowed = order.slice(0, order.indexOf(max) + 1);
      const seedTurn = Math.floor(s.time.absoluteTurn / 21);
      const rng = new G.RNG((s.meta.seed ^ (seedTurn * 104729)) >>> 0);
      return allowed.flatMap(t => {
        const n = t === 'te' ? (rng.chance(15) ? 1 : 0) : rng.int(1, 3);
        return Array.from({ length: n }, () => ({
          tier: t,
          name: rng.pick(TIERS[t].samples),
          stone: rng.int(TIERS[t].stone[0], TIERS[t].stone[1]),
          contrib: TIERS[t].contrib
        }));
      });
    },

    run(s, tier, team) {
      const t = TIERS[tier] || TIERS.bing;
      const teamBonus = (team?.length || 0) * 6;
      const r = G.Check.roll({
        attrKey: 'gen', difficulty: t.difficulty,
        modifiers: [teamBonus, G.Reputation.socialMod(s) * 0.5]
      });
      const mult = G.Check.GRADE_MULT[r.grade];
      const deltas = [];
      const notes = [];

      if (mult > 0) {
        const stone = Math.round(G.rng.int(t.stone[0], t.stone[1]) * mult);
        const contrib = Math.round(t.contrib * mult);
        deltas.push({ path: 'resources.stone.low', op: 'add', value: stone });
        deltas.push({ path: 'resources.contribution', op: 'add', value: contrib });
        notes.push(`灵石 +${stone}，贡献点 +${contrib}`);
        if (r.grade === 'perfect') {
          deltas.push({ path: 'reputation.value', op: 'add', value: 3, clamp: [0, 100] });
          notes.push('声望 +3');
        }
      } else {
        const lose = Math.round(t.contrib * 0.3);
        deltas.push({ path: 'resources.contribution', op: 'add', value: -lose, min: 0 });
        notes.push(`任务失败，贡献点 -${lose}`);
      }

      // 风险
      if (G.rng.chance(t.risk * (mult > 0 ? 0.4 : 1.2))) {
        deltas.push({ path: 'cultivation.injuries', op: 'push',
                      value: { type: 'wound', severity: tier === 'te' ? 3 : 1, healTurnsLeft: tier === 'te' ? 6 : 2 } });
        notes.push('你受了伤');
        if (tier === 'te' && r.grade === 'terrible') {
          G.Demon.add(s, 'death', 6, '那次任务里没能带回来的人', null);
        }
      }

      G.State.commit(deltas, 'quest:' + tier);
      return { tier: t.name, grade: r.grade, notes };
    },

    // ---------- 试炼塔 ----------
    TOWER_TRIALS: ['battle', 'mind', 'knowledge', 'survival'],
    TRIAL_ATTR: { battle: 'gen', mind: 'xin', knowledge: 'wu', survival: 'shen' },
    TRIAL_NAME: { battle: '战斗', mind: '心境', knowledge: '知识', survival: '求生' },

    tower(s) {
      const floor = (s.flags.tower_floor || 0) + 1;
      if (floor > 12) return { fail: '你已登顶青霄试炼塔。' };
      const kind = this.TOWER_TRIALS[(floor - 1) % 4];
      const r = G.Check.roll({
        attrKey: this.TRIAL_ATTR[kind],
        difficulty: 25 + floor * 5
      });
      const passed = ['perfect', 'good', 'plain'].includes(r.grade);
      const deltas = [];
      if (passed) {
        deltas.push({ path: 'flags.tower_floor', op: 'set', value: floor });
        deltas.push({ path: 'resources.contribution', op: 'add', value: floor * 8 });
        deltas.push({ path: 'cultivation.exp', op: 'add', value: floor * 6, min: 0 });
        if (floor % 4 === 0) deltas.push({ path: 'reputation.value', op: 'add', value: 2, clamp: [0, 100] });
      } else {
        deltas.push({ path: 'cultivation.demonHeart', op: 'add', value: 2, clamp: [0, 100] });
      }
      G.State.commit(deltas, 'tower');
      return { floor, kind: this.TRIAL_NAME[kind], grade: r.grade, passed };
    },

    // 秘境探索已迁至 systems/realm.js（G.Realm），这里只保留旧入口做兼容
    genRealm(s, kind) { return G.Realm.gen(s, kind === 'lingxu' ? 'lingxu' : 'houshan'); },
    explore(s, realm, action) { return G.Realm.act(s, realm, action); },

/* ===== systems/realm.js — 秘境探索 =====
 * 每个秘境是一张有向节点图（8-20 节点）。灵力与伤势是秘境内的限制资源，
 * 逼玩家在"再深入一层"和"保命撤退"之间做取舍。
 */
(function (G) {
  'use strict';

  const DEFS = {
    lingxu: {
      name: '灵墟',
      scene: 'scene_lingxu',
      size: [14, 18],
      danger: 1.35,
      intro: '石门在你身后合上。空气里有股说不出的味道，像是很久没人呼吸过的地方。',
      storyline: 'seal',
      req: { realm: 'zhuji' },
      loot: ['pozhang_dan', 'ningxin_dan']
    },
    houshan: {
      name: '后山灵窟',
      scene: 'scene_secret_realm',
      size: [8, 11],
      danger: 0.85,
      intro: '洞口比看上去要深。走了不到十步，外面的光就照不进来了。',
      req: null,
      loot: ['ningqi_dan', 'lingmo']
    },
    waiyu: {
      name: '青霄外域·迷雾深处',
      scene: 'scene_secret_realm',
      size: [10, 14],
      danger: 1.1,
      intro: '雾越走越浓。你回头看时，来路已经被吞掉了。',
      req: { realm: 'qi', layer: 6 },
      loot: ['huichun_dan', 'jianpi']
    }
  };

  const NODE_TYPES = {
    entry:    { name: '入口',   weight: 0 },
    empty:    { name: '空室',   weight: 26 },
    battle:   { name: '兽踪',   weight: 22 },
    treasure: { name: '遗物',   weight: 14 },
    trap:     { name: '机关',   weight: 14 },
    fortune:  { name: '异象',   weight: 10 },
    puzzle:   { name: '禁制',   weight: 8 },
    rest:     { name: '静水',   weight: 6 },
    core:     { name: '深处',   weight: 0 }
  };

  const Realm = {
    DEFS, NODE_TYPES,
    current: null,

    canEnter(s, kind) {
      const d = DEFS[kind];
      if (!d) return { ok: false, reason: '没有这个地方' };
      if (s.cultivation.resting > 0) return { ok: false, reason: '你还在休养，进去等于送死' };
      if (d.req) {
        const need = G.State.realmIndex(d.req.realm);
        const cur = G.State.realmIndex(s.cultivation.realm);
        if (cur < need || (cur === need && d.req.layer && s.cultivation.layer < d.req.layer)) {
          return { ok: false, reason: `境界不足，至少需要${G.State.realmName(d.req.realm, d.req.layer || 1)}` };
        }
      }
      if (kind === 'lingxu' && !s.flags.lingxu_permit) {
        return { ok: false, reason: '灵墟每年只开一次，且仅限核心弟子。你还没有资格' };
      }
      return { ok: true };
    },

    /** 生成一张节点图 */
    gen(s, kind) {
      const d = DEFS[kind] || DEFS.houshan;
      const rng = new G.RNG((s.meta.seed ^ (s.time.absoluteTurn * 31337) ^ kind.length) >>> 0);
      const size = rng.int(d.size[0], d.size[1]);
      const types = Object.keys(NODE_TYPES).filter(k => NODE_TYPES[k].weight > 0);

      const nodes = [];
      for (let i = 0; i < size; i++) {
        const type = i === 0 ? 'entry'
                   : i === size - 1 ? 'core'
                   : rng.weighted(types.map(t => ({ t, weight: NODE_TYPES[t].weight })), x => x.weight).t;
        nodes.push({ i, type, visited: i === 0, searched: false, cleared: false, next: [] });
      }

      // 主干 + 分支：保证连通，但让路径有选择
      for (let i = 0; i < size - 1; i++) {
        nodes[i].next.push(i + 1);
        if (i + 2 < size && rng.chance(38)) nodes[i].next.push(i + 2);
        if (i + 3 < size && rng.chance(14)) nodes[i].next.push(i + 3);
      }

      const maxQi = 100 + G.State.realmIndex(s.cultivation.realm) * 20;
      this.current = {
        kind, def: d, nodes, at: 0, turns: 0,
        hp: 100, maxHp: 100, qi: maxQi, maxQi,
        loot: [], clues: [], log: [d.intro], ended: false, outcome: null
      };
      return this.current;
    },

    node(r) { return r.nodes[r.at]; },

    /** 当前可选的行动 */
    actions(r) {
      const n = this.node(r);
      const out = [];
      const nexts = n.next.filter(i => r.nodes[i]);
      if (nexts.length) {
        out.push({ id: 'advance', label: nexts.length > 1 ? `继续深入（${nexts.length} 条路）` : '继续深入',
                   cost: 8, hint: '灵力 -8' });
      }
      if (!n.searched && n.type !== 'entry') {
        out.push({ id: 'search', label: '原地搜索', cost: 4, hint: '可能有收获，也可能碰到不该碰的' });
      }
      if (n.type === 'puzzle' && !n.cleared) {
        out.push({ id: 'crack', label: '尝试破解禁制', cost: 15, hint: '神识判定' });
      }
      out.push({ id: 'rest', label: '就地调息', cost: 0, hint: '恢复灵力与伤势，但可能被偷袭' });
      out.push({ id: 'retreat', label: '原路撤退', cost: 0, hint: '保住已有收获的八成' });
      return out;
    },

    /** 执行一次行动 */
    act(s, r, action, targetNode) {
      if (r.ended) return { text: '', ended: true };
      r.turns++;
      const out = { action, text: '', ended: false, gain: null };
      const n = this.node(r);

      switch (action) {
        case 'advance': {
          const nexts = n.next.filter(i => r.nodes[i]);

        items: r.loot.filter(l => l.type === 'item').map(l => l.id),
        clues: r.clues, depth: r.at, total: r.nodes.length, turns: r.turns, how

    /** 供 UI 显示的进度描述 */
    depthLabel(r) {

      if (pct >= 100) return '最深处';
      if (pct >= 70) return '深处';
      if (pct >= 40) return '中段';
      if (pct >= 10) return '浅处';

        if (c.grade === 'terrible') f.injured = true;
      } else {
        f.risk += 3;
      }

      f.results.push({ stage: st.id, name: st.name, grade: c.grade, choice: ch.text });
      f.stage++;

      // 深入且运气差 → 触发上古封印松动

      const sealed = st.id === 'crisis' && G.rng.chance(sealChance);

    settleHunt(s) {
      const f = this.current;
      const deltas = [];
      const notes = [];

      const stone = f.harvest * 2;
      const contrib = Math.round(f.harvest * 0.6);
      deltas.push({ path: 'resources.stone.low', op: 'add', value: stone, min: 0 });
      deltas.push({ path: 'resources.contribution', op: 'add', value: contrib, min: 0 });
      deltas.push({ path: 'cultivation.exp', op: 'add', value: f.harvest, min: 0 });
      notes.push(`猎获折价 ${stone} 下品灵石，贡献点 +${contrib}`);

      if (f.injured) {
        deltas.push({ path: 'cultivation.injuries', op: 'push',
                      value: { type: 'wound', severity: 2, healTurnsLeft: 3 } });
        notes.push('你带着伤回来的');
      }

      // 御灵院弟子有机会契约灵兽
      if (s.player.college === 'yuling' && f.harvest > 60 && !s.flags.beast_contract) {
        deltas.push({ path: 'flags.beast_contract', op: 'set', value: true });
        deltas.push({ path: 'attrs.xin', op: 'add', value: 1 });
        notes.push('你契约了一头幼兽。它一路跟着你回了院');
      }

        deltas.push({ path: 'flags.vein_anomaly', op: 'add', value: 2 });
        deltas.push({ path: 'storylines.seal.progress', op: 'add', value: 12, clamp: [0, 100] });
        deltas.push({ path: 'storylines.seal.clues', op: 'push', value: '外域震动的时辰', unique: true });

      deltas.push({ path: 'reputation.value', op: 'add', value: Math.round(G.Reputation.scale(s, rep)), clamp: [0, 100] });

    interAcademy(s) {
      const rel = s.relations.npc_lingxiaoke;
      const gap = (G.State.realmIndex(rel.npcRealm) * 9 + rel.npcLayer)
                - (G.State.realmIndex(s.cultivation.realm) * 9 + s.cultivation.layer);
      const c = G.Check.roll({
        attrKey: 'gen', difficulty: 55 + gap * 4,
        modifiers: [G.Reputation.socialMod(s) * 0.5]
      });
      const won = ['perfect', 'good'].includes(c.grade);
      const deltas = [];
      const notes = [];

      if (c.grade === 'perfect') {
        notes.push('你赢了，而且赢得干净。凌霄客下台时朝你抱了个拳。');
        deltas.push({ path: 'reputation.value', op: 'add', value: Math.round(G.Reputation.scale(s, 14)), clamp: [0, 100] });
        deltas.push({ path: 'resources.contribution', op: 'add', value: 150 });
        deltas.push({ path: 'relations.npc_lingxiaoke.favor', op: 'add', value: 20, clamp: [-100, 100] });
        deltas.push({ path: 'relations.npc_lingxiaoke.awe', op: 'add', value: 25, clamp: [0, 100] });
        deltas.push({ path: 'relations.npc_bailuqing.favor', op: 'add', value: 12, clamp: [-100, 100] });
      } else if (won) {
        notes.push('你险胜。凌霄客说了句「下次未必」。');
        deltas.push({ path: 'reputation.value', op: 'add', value: Math.round(G.Reputation.scale(s, 8)), clamp: [0, 100] });
        deltas.push({ path: 'resources.contribution', op: 'add', value: 90 });
        deltas.push({ path: 'relations.npc_lingxiaoke.favor', op: 'add', value: 12, clamp: [-100, 100] });
        deltas.push({ path: 'relations.npc_lingxiaoke.awe', op: 'add', value: 15, clamp: [0, 100] });
      } else if (c.grade === 'plain') {
        notes.push('平手。两边都不太服气。');
        deltas.push({ path: 'resources.contribution', op: 'add', value: 40 });
        deltas.push({ path: 'relations.npc_lingxiaoke.favor', op: 'add', value: 6, clamp: [-100, 100] });
      } else {
        notes.push('你输了。凌霄客没有多说什么，这比说什么都难受。');
        deltas.push({ path: 'reputation.value', op: 'add', value: -3, clamp: [0, 100] });
        deltas.push({ path: 'relations.npc_bailuqing.favor', op: 'add', value: -6, clamp: [-100, 100] });
        G.Demon.add(s, 'inferior', 5, '交流赛上输给了星落书院', 'npc_lingxiaoke');
      }

      deltas.push({ path: 'relations.npc_lingxiaoke.met', op: 'set', value: true });
      deltas.push({ path: 'cultivation.exp', op: 'add', value: won ? 140 : 70, min: 0 });
      deltas.push({ path: 'flags.inter_academy_done', op: 'add', value: 1 });
      G.State.commit(deltas, 'festival.inter');
      G.State.logLine('外院交流赛：' + (won ? '胜' : c.grade === 'plain' ? '平' : '负'), 'major');

      return { grade: c.grade, won, notes };
    },

    // ================= 便捷查询 =================
    /** 本月是否有大型活动 */
    /* 三项活动都是弟子参赛。从当月第二周开到第四周，推过就算错过；
     * 早期版本只开第二周一周，而且教习、院主也会看到参赛横幅。 */
    pending(s) {
      if (s.player.role !== 'student') return null;
      const m = s.time.month;
      if (s.time.week < 2) return null;
      if (m === 4 && !this._doneThisYear(s, 'tourney')) return 'tourney';
      if (m === 3 && !this._doneThisYear(s, 'hunt')) return 'hunt';
      if (m === 5 && !this._doneThisYear(s, 'inter')) return 'inter';
      return null;
    },

    _doneThisYear(s, key) {
      return s.flags[`festival_${key}_${s.time.era}`] === true;
    },

    markDone(s, key) {
      G.State.commit([{ path: `flags.festival_${key}_${s.time.era}`, op: 'set', value: true }], 'festival.mark');
    }
  };

  G.Festival = Festival;

/* ===== systems/faculty.js — 教习路线 =====
 * 弟子培养 · 备课授课 · 学术研究 · 院务 · 教学评价 · 院首之争

(function (G) {

  const GIVEN_F = ['疏影','未晞','听澜','知微','拾光','衔月','念安','漱玉','清欢','望舒','昭华','素问','向晚','窈然'];

  const TEACH_STYLES = {

    guide:     { name: '循循善诱', growth: 1.0, affinity: 0.30, risk: -0.10, desc: '稳，弟子亲近你，成长不快但不容易坏' },
    laissez:   { name: '放任自学', growth: 0.7, affinity: 0.05, risk: 0.0, desc: '省时段，天赋高的自己会跑，天赋差的会掉队' },
    practical: { name: '实战导向', growth: 1.15, affinity: 0.10, risk: 0.30, desc: '出成绩最快，也最容易受伤' }
  };

  const RESEARCH_TOPICS = [
    { id: 'r_pill',    name: '改良丹方',       college: 'danxia',   attr: 'xue', cost: 12, payoff: '丹道', desc: '把一味贵重药引换成三味便宜的' },
    { id: 'r_array',   name: '新阵法推演',     college: 'fulu',     attr: 'xue', cost: 14, payoff: '阵法', desc: '一种能自行修补的护山禁制' },
    { id: 'r_sword',   name: '剑意拆解',       college: 'jianyuan', attr: 'xue', cost: 10, payoff: '剑道', desc: '把无法言传的东西写成能教的东西' },
    { id: 'r_beast',   name: '契约术改良',     college: 'yuling',   attr: 'xue', cost: 12, payoff: '御灵', desc: '让契约不再是单向的束缚' },
    { id: 'r_star',    name: '星轨误差修正',   college: 'tianji',   attr: 'xue', cost: 16, payoff: '推演', desc: '三百年来所有卜算都差了半分' },
    { id: 'r_law',     name: '院规修订案',     college: 'mingde',   attr: 'xue', cost: 12, payoff: '律法', desc: '有些条文该改了，但没人敢提' },
    { id: 'r_craft',   name: '器修新工艺',     college: 'baiyi',    attr: 'xue', cost: 11, payoff: '器修', desc: '一种更省灵材的锻法' },
    { id: 'r_root',    name: '灵根成因考',     college: null,       attr: 'xue', cost: 22, payoff: '灵根', desc: '没人敢碰的题目', storyline: 'rootSecret' }
  ];

  const Faculty = {
    TEACH_STYLES, RESEARCH_TOPICS,

    // ================= 初始化 =================
    init(s) {
      if (s.player.role !== 'teacher') return;
      s.faculty = s.faculty || {
        disciples: [],
        style: 'guide',
        prepared: 0,           // 已备课时段，影响下次授课质量
        lecturesGiven: 0,
        research: null,        // { id, progress, need }
        doneTopics: [],
        papers: 0,
        evaluations: [],       // 每学期一条
        duties: 0,             // 院务参与度
        headBid: null          // 院首之争状态
      };
      if (!s.faculty.disciples.length) this.assignDisciples(s, 4);
    },

    /** 学院分配弟子 */
    assignDisciples(s, n) {
      const out = s.faculty.disciples.slice();
      for (let i = 0; i < n; i++) out.push(this.genDisciple(s));
      G.State.commit([{ path: 'faculty.disciples', op: 'set', value: out }], 'faculty.assign');
      return out.slice(-n);
    },

    genDisciple(s) {
      const female = G.rng.chance(48);
      const name = G.rng.pick(SURNAMES) + G.rng.pick(female ? GIVEN_F : GIVEN_M);
      const talent = G.rng.weighted(
        [{ v: 'low', weight: 30 }, { v: 'mid', weight: 45 }, { v: 'high', weight: 20 }, { v: 'rare', weight: 5 }],
        x => x.weight).v;
      return {
        id: 'd_' + (s.time.absoluteTurn) + '_' + G.rng.int(1000, 9999),
        name,
        gender: female ? 'female' : 'male',
        talent,                                   // 资质
        realm: 'qi', layer: G.rng.int(3, 5),
        exp: 0,
        affinity: G.rng.int(5, 20),               // 对你的亲近
        pressure: 0,                              // 压力，过高会出事
        trait: G.rng.pick(['勤勉', '偷懒', '钻牛角尖', '心浮气躁', '沉默', '爱问', '要强', '怯懦']),
        note: '',
        graduated: false, broken: false,
        joinedTurn: s.time.absoluteTurn
      };
    },

    talentCoef(t) { return ({ low: 0.65, mid: 1.0, high: 1.45, rare: 2.1 })[t] || 1; },
    talentName(t) { return ({ low: '资质平平', mid: '中人之姿', high: '天资不错', rare: '百年难遇' })[t] || ''; },

    // ================= 备课与授课 =================
    prepare(s) {
      s = G.State.current;
      const r = G.Check.roll({ attrKey: 'xue', difficulty: 35 });
      const gain = { perfect: 3, good: 2, plain: 1, bad: 1, terrible: 0 }[r.grade];
      G.State.commit([{ path: 'faculty.prepared', op: 'add', value: gain, clamp: [0, 5] }], 'faculty.prepare');
      return { grade: r.grade, gain, total: Math.min(5, s.faculty.prepared) };
    },

    /** 上一节正课 */
    lecture(s) {
      s = G.State.current;
      const f = s.faculty;
      const prep = f.prepared;
      const style = TEACH_STYLES[f.style];
      const r = G.Check.roll({
        attrKey: 'xue', difficulty: 45,
        modifiers: [prep * 7, (s.attrs.jiao ?? 5) * 1.2],
        reason: prep > 0 ? 8 : -8
      });

      const mult = Math.max(0, G.Check.GRADE_MULT[r.grade]);
      const deltas = [
        { path: 'faculty.prepared', op: 'set', value: Math.max(0, prep - 1) },
        { path: 'faculty.lecturesGiven', op: 'add', value: 1 },
        { path: 'resources.contribution', op: 'add', value: Math.round(12 * mult), min: 0 }
      ];

      // 弟子获益
      const grown = [];
      const ds = f.disciples.map(d => {
        if (d.graduated || d.broken) return d;
        const gain = Math.round(28 * mult * this.talentCoef(d.talent) * style.growth);
        const aff = Math.round((r.grade === 'perfect' ? 3 : 1) * (1 + style.affinity));
        // 正课是集体课，本身压力很小。真正压垮人的是长期被盯着单独练。
        // 早期版本这里给到 3，一个月十来节课就把所有弟子推到临界了。
        const pres = style.risk > 0 ? Math.round(2 * (1 + style.risk)) : 1;
        grown.push({ name: d.name, gain });
        return { ...d, exp: d.exp + gain, affinity: Math.min(100, d.affinity + aff),
                 pressure: Math.max(0, Math.min(100, d.pressure + pres)) };
      });
      deltas.push({ path: 'faculty.disciples', op: 'set', value: ds });

      if (r.grade === 'perfect') {
        deltas.push({ path: 'reputation.value', op: 'add',
                      value: Math.round(G.Reputation.scale(s, 2)), clamp: [0, 100] });
      }
      if (r.grade === 'terrible') {
        deltas.push({ path: 'reputation.value', op: 'add', value: -2, clamp: [0, 100] });
      }

      G.State.commit(deltas, 'faculty.lecture');
      this.checkDiscipleBreakthrough(s);
      return { grade: r.grade, prep, grown };
    },

    /** 单独指导某个弟子 */
    tutor(s, discipleId) {
      // UI 的事件回调可能握着一个已经被替换掉的 state（读档、换存档都会换对象）。
      // 一律以 G.State.current 为准，否则会出现"指导了但数值没动"这种诡异现象。
      s = G.State.current;

      if (!d || d.graduated || d.broken) return { fail: '这个弟子已经不在你名下了' };

      const style = TEACH_STYLES[f.style];
      const r = G.Check.roll({
        attrKey: 'jiao', difficulty: 42,
        modifiers: [d.affinity * 0.2, -d.pressure * 0.15]
      });
      const mult = Math.max(0, G.Check.GRADE_MULT[r.grade]);
      const gain = Math.round(70 * mult * this.talentCoef(d.talent) * style.growth);
      const aff = Math.round((r.grade === 'perfect' ? 12 : r.grade === 'good' ? 8 : 3) * (1 + style.affinity));
      let pres = Math.round(4 * (1 + style.risk));
      if (r.grade === 'perfect') pres = -6;
      if (r.grade === 'terrible') pres = 14;

        ...x, exp: x.exp + gain,
        affinity: Math.max(0, Math.min(100, x.affinity + aff)),
        pressure: Math.max(0, Math.min(100, x.pressure + pres)),
        lastTutor: s.time.absoluteTurn      // 被单独指导过，一段时间内不会因"被忽视"涨压力
      });
      G.State.commit([{ path: 'faculty.disciples', op: 'set', value: ds }], 'faculty.tutor');

    // ================= 弟子成长 =================

    checkDiscipleBreakthrough(s) {

        while (x.exp >= this.expNeed(x) && guard++ < 6) {

        x.highMonths = x.pressure >= 85 ? (x.highMonths || 0) + 1 : 0;

            x.broken = true;

            news.push(`${x.name}走火入魔，修为尽废。他被抬出你的院子时还在道歉。` +
              (n === 1 ? '院里记了你一笔。再有下一次，这讲台你就站不住了。' : ''));
            G.Demon.add(s, 'guilt', 14, `${x.name}是在你手上出的事`, null);
            G.State.commit([
              { path: 'flags.disciple_accident', op: 'set', value: n },
              { path: 'reputation.value', op: 'add', value: -8, clamp: [0, 100] }
            ], 'faculty.accident');
          } else {
            x.pressure = 45;
            x.highMonths = 0;
            news.push(`${x.name}修炼时出了岔子，好在没伤到根本。你该让他歇歇了。`);
          }
        }
        // 跟了你五年还没结丹的，也到了该出师的时候
        if (!x.broken && s.time.absoluteTurn - x.joinedTurn >= 5 * 48 * 21) {
          x.graduated = true;
          x.pressure = 0;
          news.push(`${x.name}在你门下满五年，出师了。临走前给你磕了个头。`);
        }
        return x;
      });

      G.State.commit([{ path: 'faculty.disciples', op: 'set', value: ds }], 'faculty.monthly');
      news.push(...this.checkDiscipleBreakthrough(s));

      // 补充新弟子
      const active = G.State.current.faculty.disciples.filter(d => !d.graduated && !d.broken).length;
      if (active < 3 && G.rng.chance(active < 2 ? 100 : 50)) {
        const [nd] = this.assignDisciples(s, 1);
        news.push(`院里给你分了个新弟子：${nd.name}，${this.talentName(nd.talent)}。`);
      }
      return news;
    },

    // ================= 学术研究 =================
    /** 每个题目一辈子只能做一次——否则会出现"著述五十部"这种荒唐数字 */
    availableTopics(s) {
      const done = s.faculty?.doneTopics || [];
      const mine = RESEARCH_TOPICS.filter(t => (!t.college || t.college === s.player.college) && !done.includes(t.id));
      const others = RESEARCH_TOPICS.filter(t => t.college && t.college !== s.player.college && !done.includes(t.id));
      return mine.concat(others.slice(0, 2));
    },

    startResearch(s, topicId) {
      const t = RESEARCH_TOPICS.find(x => x.id === topicId);
      if (!t) return { fail: '没有这个题目' };
      if (s.faculty.research) return { fail: '手上还有一个题目没做完' };
      G.State.commit([{ path: 'faculty.research', op: 'set',
                        value: { id: t.id, progress: 0, need: t.cost } }], 'faculty.research.start');
      return { topic: t };
    },

    doResearch(s) {
      s = G.State.current;
      // 没选题就自动挑一个本院的——排了"研究"却卡在没选题上，是很蠢的死路
      if (!s.faculty.research) {
        const t = this.availableTopics(s)[0];
        if (!t) return { fail: '眼下没有可做的题目' };
        this.startResearch(s, t.id);
      }
      const r0 = s.faculty.research;
      if (!r0) return { fail: '还没有选题' };
      const t = RESEARCH_TOPICS.find(x => x.id === r0.id);
      const r = G.Check.roll({ attrKey: 'xue', difficulty: 52 });
      const step = { perfect: 3, good: 2, plain: 1, bad: 0, terrible: -1 }[r.grade];
      const prog = Math.max(0, r0.progress + step);

      if (prog < r0.need) {
        G.State.commit([{ path: 'faculty.research.progress', op: 'set', value: prog }], 'faculty.research');
        return { grade: r.grade, step, progress: prog, need: r0.need, topic: t, done: false };
      }

      // 成果落地
      const deltas = [
        { path: 'faculty.research', op: 'set', value: null },
        { path: 'faculty.doneTopics', op: 'push', value: t.id, unique: true },
        { path: 'faculty.papers', op: 'add', value: 1 },
        { path: 'flags.research_breakthrough', op: 'add', value: 1 },
        { path: 'attrs.xue', op: 'add', value: 1 },
        { path: 'reputation.value', op: 'add', value: Math.round(G.Reputation.scale(s, 10)), clamp: [0, 100] },
        { path: 'resources.contribution', op: 'add', value: 200 }
      ];
      if (t.storyline) {
        deltas.push({ path: `storylines.${t.storyline}.progress`, op: 'add', value: 18, clamp: [0, 100] });
        deltas.push({ path: `storylines.${t.storyline}.clues`, op: 'push', value: '上古灵根实验记录', unique: true });
      }
      G.State.commit(deltas, 'faculty.research.done');
      G.State.logLine(`《${t.name}》成书，藏经阁收录`, 'major');
      return { grade: r.grade, topic: t, done: true };
    },

    // ================= 院务 =================
    duty(s, kind) {
      const table = {
        meeting: { name: '教务会议', attr: 'shi', diff: 40, rep: 1, faction: true },
        invigilate: { name: '监考', attr: 'xue', diff: 30, rep: 1 },
        patrol: { name: '巡视纪律', attr: 'jiao', diff: 38, rep: 1 },
        mediate: { name: '处理弟子纠纷', attr: 'jiao', diff: 50, rep: 2 }
      };
      const d = table[kind] || table.meeting;
      const r = G.Check.roll({ attrKey: d.attr, difficulty: d.diff });
      const mult = Math.max(0, G.Check.GRADE_MULT[r.grade]);
      const deltas = [
        { path: 'faculty.duties', op: 'add', value: 1 },
        { path: 'resources.contribution', op: 'add', value: Math.round(20 * mult), min: 0 },
        { path: 'reputation.value', op: 'add',
          value: Math.round(G.Reputation.scale(s, d.rep * mult)), clamp: [0, 100] }
      ];
      if (r.grade === 'terrible') deltas.push({ path: 'reputation.value', op: 'add', value: -2, clamp: [0, 100] });
      G.State.commit(deltas, 'faculty.duty');
      return { name: d.name, grade: r.grade };
    },

    // ================= 教学评价（每学期） =================
    evaluate(s) {
      const f = s.faculty;
      const active = f.disciples.filter(d => !d.broken);
      const avgAff = active.length ? active.reduce((a, d) => a + d.affinity, 0) / active.length : 0;
      const avgProg = active.length
        ? active.reduce((a, d) => a + G.State.realmIndex(d.realm) * 9 + d.layer, 0) / active.length : 0;

      const avgPress = active.length ? active.reduce((a, d) => a + d.pressure, 0) / active.length : 0;
      const broken = f.disciples.filter(d => d.broken).length;

      // 弟子匿名评分 40%：亲近你固然加分，但把他们逼得喘不过气会体现在这里
      const byDisciple = Math.max(0, Math.min(40, avgAff * 0.38 - avgPress * 0.18));
      const byPeer = Math.min(25, (s.attrs.sheng ?? 5) * 1.8 + f.papers * 3);              // 同僚互评 25%
      const byHead = Math.min(35, f.lecturesGiven * 0.5 + f.duties * 1.0 + avgProg * 1.0); // 院首考评 35%
      const score = Math.max(0, Math.round(byDisciple + byPeer + byHead - broken * 8));

      const tier = score >= 90 ? '优' : score >= 62 ? '良' : score >= 40 ? '中' : '下';
      const deltas = [
        { path: 'faculty.evaluations', op: 'push',
          value: { year: s.academy.year, score, tier }, maxLen: 20 }
      ];
      const rep = { '优': 6, '良': 3, '中': 0, '下': -4 }[tier];
      deltas.push({ path: 'reputation.value', op: 'add',
                    value: Math.round(G.Reputation.scale(s, rep)), clamp: [0, 100] });
      if (tier === '优') deltas.push({ path: 'attrs.sheng', op: 'add', value: 1 });
      if (tier === '下') G.Demon.add(s, 'inferior', 5, '那年的教学评价', null);

      G.State.commit(deltas, 'faculty.evaluate');
      G.State.logLine(`学期教学评价：${tier}（${score} 分）`, 'major');
      return { score, tier, byDisciple: Math.round(byDisciple), byPeer: Math.round(byPeer), byHead: Math.round(byHead) };
    },

    /** 连续五年优秀 —— 结局 9 的硬条件之一 */
    excellentStreak(s) {
      const e = s.faculty?.evaluations || [];
      let n = 0;
      for (let i = e.length - 1; i >= 0; i--) {
        if (e[i].tier === '优') n++; else break;
      }
      return n;
    },

    // ================= 院首之争 =================
    canBidHead(s) {
      return (s.attrs.xue ?? 0) >= 11 &&
             s.reputation.value >= 62 &&
             (s.faculty?.papers || 0) >= 2 &&
             !s.flags.became_head;
    },

    /** 竞争者实力 */
    rivalScore(s) {
      // 顾长青坐镇剑渊，苏暮寒与钟离衡是常年提名者
      const base = 58 + s.academy.year * 2;
      const su = (s.relations.npc_sumuhan?.favor || 0) * -0.08;
      const zhong = (s.relations.npc_zhonglihen?.favor || 0) * -0.08;
      return Math.round(base + su + zhong);
    },

    bidHead(s, approach) {
      const APPROACH = {
        merit:    { name: '以政绩服人', attr: 'xue', reason: 12, faction: null },
        ally:     { name: '拉拢同僚',   attr: 'shi', reason: 8,  faction: 'pragmatic' },
        reform:   { name: '许诺改革',   attr: 'shi', reason: 4,  faction: 'reform' },
        tradition:{ name: '以资历为凭', attr: 'sheng', reason: 10, faction: 'traditional' }
      };
      const a = APPROACH[approach] || APPROACH.merit;
      const rivalS = this.rivalScore(s);

      const r = G.Check.roll({
        attrKey: a.attr,
        difficulty: Math.max(35, Math.min(85, rivalS)),
        reason: a.reason,
        modifiers: [
          s.reputation.value * 0.2,
          (s.faculty.papers || 0) * 4,
          this.excellentStreak(s) * 5,
          (s.flags.jindan_disciples || 0) * 6,
          a.faction ? (s.reputation.factions[a.faction] || 0) * 0.15 : 0
        ]
      });

      const deltas = [];
      const won = ['perfect', 'good'].includes(r.grade);
      if (a.faction) {
        deltas.push({ path: `reputation.factions.${a.faction}`, op: 'add', value: 12, clamp: [-100, 100] });
      }

      if (won) {
        deltas.push({ path: 'flags.became_head', op: 'set', value: true });
        deltas.push({ path: 'reputation.value', op: 'add',
                      value: Math.round(G.Reputation.scale(s, 15)), clamp: [0, 100] });
        deltas.push({ path: 'attrs.sheng', op: 'add', value: 2 });
        deltas.push({ path: 'faculty.headBid', op: 'set', value: 'won' });
      } else {
        deltas.push({ path: 'faculty.headBid', op: 'set', value: 'lost' });
        deltas.push({ path: 'reputation.value', op: 'add', value: -3, clamp: [0, 100] });
        if (r.grade === 'terrible') {
          G.Demon.add(s, 'inferior', 8, '院首之争落败那天', null);
          deltas.push({ path: 'relations.npc_guchangqing.favor', op: 'add', value: -8, clamp: [-100, 100] });
        }
      }
      G.State.commit(deltas, 'faculty.bidHead');
      G.State.logLine(won ? '你成了院首。' : '院首之争，你落选了。', 'major');
      return { grade: r.grade, won, approach: a, rivalScore: rivalS };
    },

    // ================= 摘要 =================
    summary(s) {
      const f = s.faculty;
      if (!f) return null;
      const active = f.disciples.filter(d => !d.graduated && !d.broken);
      return {
        disciples: active.length,
        jindan: s.flags.jindan_disciples || 0,
        broken: f.disciples.filter(d => d.broken).length,
        papers: f.papers,
        lectures: f.lecturesGiven,
        prepared: f.prepared,
        style: TEACH_STYLES[f.style].name,
        research: f.research ? RESEARCH_TOPICS.find(t => t.id === f.research.id) : null,
        researchProgress: f.research ? `${f.research.progress}/${f.research.need}` : null,
        lastEval: f.evaluations[f.evaluations.length - 1] || null,
        streak: this.excellentStreak(s),
        isHead: !!s.flags.became_head
      };
    }
  };

  G.Faculty = Faculty;

})(window.G = window.G || {});

      // 灵脉议题要等暗线浮现
      const usable = pool.filter(a => a.id !== 'g_vein' || s.storylines.seal.unlocked);
      return G.rng.pick(usable.length ? usable : pool);
    },

    resolveAgenda(s, agenda, optionId) {
      s = G.State.current;
      const o = agenda.options.find(x => x.id === optionId) || agenda.options[0];
      const r = G.Check.roll({
        attrKey: 'jue', difficulty: 45, reason: o.reason || 0,
        modifiers: [(s.attrs.wei ?? 5) * 1.5, -this.avgUnrest(s) * 0.25]
      });
      const mult = Math.max(0, G.Check.GRADE_MULT[r.grade]);
      const deltas = [
        { path: 'gov.agendaDone', op: 'push', value: agenda.id, unique: true },
        { path: `gov.agendaAt.${agenda.id}`, op: 'set', value: s.time.absoluteTurn }
      ];
      const notes = [];

      // 预算与私库
      if (o.budget) {
        deltas.push({ path: 'gov.budget', op: 'add', value: o.budget * 50 });
        notes.push(`腾出预算 ${o.budget * 50}`);
      }
      if (o.privy) {
        deltas.push({ path: 'gov.privy', op: 'add', value: -o.privy, min: 0 });
        notes.push(`动用私库 ${o.privy}`);
      }

      // 满意度
      const unrest = {};
      if (o.college) unrest[o.college] = 14;
      if (o.unrest) Object.assign(unrest, o.unrest);
      const spreadAll = o.spread ? 5 : (o.unrestAll || 0);
      const soften = r.grade === 'perfect' ? -4 : r.grade === 'terrible' ? 6 : 0;
      this.addUnrest(s, unrest, spreadAll + soften);

      // 属性与声望
      for (const [k, path] of [['wei','attrs.wei'],['jue','attrs.jue'],['ren','attrs.ren'],['yuan','attrs.yuan'],['de','attrs.de']]) {
        if (o[k]) deltas.push({ path, op: 'add', value: o[k] });
      }
      if (o.rep) {
        deltas.push({ path: 'reputation.value', op: 'add',
                      value: Math.round(G.Reputation.scale(s, o.rep * (mult || 0.5))), clamp: [0, 100] });
      }
      if (o.faction) {
        deltas.push({ path: `reputation.factions.${o.faction}`, op: 'add', value: 10, clamp: [-100, 100] });
      }
      if (o.reform) {
        deltas.push({ path: 'gov.reforms', op: 'add', value: 1 });
        deltas.push({ path: 'flags.reforms_passed', op: 'add', value: 1 });
        notes.push('改革推行了一项');
      }
      if (o.seal) {
        deltas.push({ path: 'storylines.seal.progress', op: 'add', value: o.seal, clamp: [0, 100] });
      }
      if (o.threat) {
        deltas.push({ path: 'gov.threatProgress', op: 'add', value: o.threat });
      }
      if (o.successor) {
        deltas.push({ path: 'gov.successor', op: 'set', value: o.successor });
        notes.push('接班人有了着落');
      }
      if (o.demon) G.Demon.add(s, 'guilt', o.demon, `${agenda.name}那次的决定`, null);

      // 糟糕判定的额外代价
      if (r.grade === 'terrible') {
        deltas.push({ path: 'attrs.wei', op: 'add', value: -1 });
        notes.push('这个决定办砸了，威望受损');
      }

      G.State.commit(deltas, 'gov.agenda');
      G.State.logLine(`【院务】${agenda.name}：${o.text}`, 'major');
      return { grade: r.grade, option: o, notes, unrest: this.avgUnrest(s) };
    },

    // ================= 外部威胁 =================
    rollThreat(s) {
      if (s.gov.threat) return null;
      const keys = Object.keys(THREATS).filter(k => !s.flags['threat_done_' + k]);
      if (!keys.length) return null;
      const k = G.rng.pick(keys);
      G.State.commit([
        { path: 'gov.threat', op: 'set', value: k },
        { path: 'gov.threatProgress', op: 'set', value: 0 }
      ], 'gov.threat');
      G.State.logLine(`【外患】${THREATS[k].name}逼近`, 'danger');
      return THREATS[k];
    },

    /** 应对威胁的一次行动 */
    handleThreat(s, approach) {
      s = G.State.current;
      const k = s.gov.threat;
      if (!k) return approach === 'auto' ? { idle: true } : { fail: '眼下没有外患' };
      const t = THREATS[k];
      // 随机应变：按外患的路数挑对口的办法
      if (approach === 'auto') {
        approach = { force: 'force', politics: 'talk', infiltrate: 'purge' }[t.kind] || 'talk';
        if (approach === 'force' && (s.attrs.wei ?? 5) < (s.attrs.ren ?? 5) - 4) approach = 'ally';
      }

      const APPROACH = {
        force:    { name: '以力慑之', attr: 'wei', good: ['force'], bad: ['politics'] },
        talk:     { name: '交涉斡旋', attr: 'yuan', good: ['politics'], bad: ['force'] },
        ally:     { name: '结外援',   attr: 'ren', good: ['politics', 'force'], bad: ['infiltrate'] },
        purge:    { name: '内部清查', attr: 'jue', good: ['infiltrate'], bad: ['force'] },
        concede:  { name: '暂避锋芒', attr: 'de', good: [], bad: [] }
      };
      const a = APPROACH[approach] || APPROACH.talk;

      let mod = 0;
      if (a.good.includes(t.kind)) mod += 15;
      if (a.bad.includes(t.kind)) mod -= 15;
      if (approach === 'ally' && (s.relations.npc_bailuqing?.favor || 0) >= 40) mod += 10;
      if (approach === 'purge' && s.storylines.mole.progress >= 50) mod += 12;

      const r = G.Check.roll({
        attrKey: a.attr, difficulty: t.power,
        modifiers: [mod, -this.avgUnrest(s) * 0.2]
      });
      const step = { perfect: 45, good: 30, plain: 15, bad: 0, terrible: -15 }[r.grade];
      const prog = Math.max(0, (s.gov.threatProgress || 0) + step);
      const deltas = [{ path: 'gov.threatProgress', op: 'set', value: prog }];
      const notes = [];

      if (approach === 'concede') {
        this.addUnrest(s, {}, 8);
        deltas.push({ path: 'reputation.value', op: 'add', value: -3, clamp: [0, 100] });
        notes.push('退让让全院不安');
      }
      if (r.grade === 'terrible') {
        this.addUnrest(s, {}, 10);
        deltas.push({ path: 'attrs.wei', op: 'add', value: -1 });
        notes.push('这一步走错了');
      }

      let resolved = false;
      if (prog >= 100) {
        resolved = true;
        deltas.push({ path: 'gov.threat', op: 'set', value: null });
        deltas.push({ path: 'gov.threatProgress', op: 'set', value: 0 });
        deltas.push({ path: `flags.threat_done_${k}`, op: 'set', value: true });
        deltas.push({ path: 'flags.threat_resolved', op: 'set', value: true });
        deltas.push({ path: 'reputation.value', op: 'add',
                      value: Math.round(G.Reputation.scale(s, 12)), clamp: [0, 100] });
        deltas.push({ path: 'attrs.wei', op: 'add', value: 1 });
        this.addUnrest(s, {}, -12);
        notes.push(`${t.name}退了`);
      }

      G.State.commit(deltas, 'gov.threat.handle');
      if (resolved) G.State.logLine(`【外患平息】${t.name}`, 'major');
      return { grade: r.grade, approach: a, threat: t, progress: prog, resolved, notes };
    },

    /* 没有待议的事时，议事就是例会。开得好，威望一点点攒起来——
     * 这是院主唯一稳定的威望来源，否则威望只会被外患和坏决定磨光。 */
    routine(s) {
      s = G.State.current;
      const r = G.Check.roll({
        attrKey: 'jue', difficulty: 35, reason: 12,
        modifiers: [-this.avgUnrest(s) * 0.15]
      });
      const step = { perfect: 2, good: 1, plain: 0, bad: 0, terrible: 0 }[r.grade];
      const prog = (s.flags._weiProgress || 0) + step;
      const deltas = [];
      const notes = [];
      if (prog >= 6) {
        deltas.push({ path: 'attrs.wei', op: 'add', value: 1 });
        deltas.push({ path: 'flags._weiProgress', op: 'set', value: prog - 6 });
        notes.push('几次例会下来，底下人说话客气了些。威望+1');
      } else {
        deltas.push({ path: 'flags._weiProgress', op: 'set', value: prog });
      }
      if (r.grade === 'terrible') {
        this.addUnrest(s, {}, 2);
        notes.push('例会上吵了起来');
      }
      G.State.commit(deltas, 'gov.routine');
      return { routine: true, grade: r.grade, notes };
    },

    // ================= 巡院与传承 =================
    patrol(s, target) {
      const c = target || G.rng.pick(COLLEGES);
      const r = G.Check.roll({ attrKey: 'ren', difficulty: 42 });
      const mult = G.Check.GRADE_MULT[r.grade];
      const deltas = [];
      const notes = [];

      if (mult > 0) {
        this.addUnrest(s, { [c]: -Math.round(12 * mult) });
        notes.push(`${G.State.collegeOf(c).name}的人心稳了些`);
        if (r.grade === 'perfect') {
          deltas.push({ path: 'attrs.ren', op: 'add', value: 1 });
          notes.push('你从一个不起眼的弟子身上看出了东西');
        }
      } else {
        this.addUnrest(s, { [c]: 5 });
        notes.push(`你去得不是时候，${G.State.collegeOf(c).name}反倒更不安了`);
      }
      G.State.commit(deltas, 'gov.patrol');
      return { college: c, grade: r.grade, notes };
    },

    teachHeir(s) {
      if (!s.gov.successor) return { fail: '你还没定下接班人' };
      const r = G.Check.roll({ attrKey: 'de', difficulty: 48 });
      const deltas = [{ path: 'gov.audits', op: 'add', value: 1 }];
      if (['perfect', 'good'].includes(r.grade)) {
        deltas.push({ path: 'flags.heir_ready', op: 'add', value: 1 });
        deltas.push({ path: 'attrs.de', op: 'add', value: r.grade === 'perfect' ? 1 : 0 });
      }
      G.State.commit(deltas, 'gov.heir');
      return { grade: r.grade, ready: s.flags.heir_ready || 0 };
    },

    // ================= 每月结算 =================
    monthlyTick(s) {
      s = G.State.current;
      if (s.player.role !== 'headmaster' || !s.gov) return [];
      const notes = [];

      // 灵脉与坊市收入
      const income = 800 + Math.round(s.reputation.value * 6) - this.avgUnrest(s) * 4;
      G.State.commit([{ path: 'gov.budget', op: 'add', value: Math.max(0, income) }], 'gov.income');
      notes.push(`本月进项 ${Math.max(0, income)}`);

      // 不满自然漂移。没有外患时人心是会自己缓和的——
      // 早期版本让它只涨不落，结果院主路线八成活不过两年。
      let drift = (s.attrs.wei ?? 5) >= 12 ? -3 : -1;
      if (s.gov.threat) drift += 4;
      this.addUnrest(s, {}, drift);

      // 离心过高 → 逼宫
      const avg = this.avgUnrest(s);
      if (avg >= 88) {
        notes.push('七院离心，殿上已经有人不肯来议事了。');
        if (G.rng.chance(20)) {
          G.State.commit([{ path: 'flags.forced_abdication', op: 'set', value: true }], 'gov.abdicate');
        }
      } else if (avg >= 70) {
        notes.push('各院怨言不小，你该出去走走了。');
      }

      // 外患自行推进
      if (s.gov.threat && G.rng.chance(35)) {
        this.addUnrest(s, {}, 4);
        notes.push(`${THREATS[s.gov.threat].name}又逼近了一步。`);
      } else if (!s.gov.threat && s.time.absoluteTurn > 400 && G.rng.chance(12)) {
        const t = this.rollThreat(s);
        if (t) notes.push(`【外患】${t.name}——${t.desc}`);
      }

      return notes;
    },

    summary(s) {
      const g = s.gov;
      if (!g) return null;
      return {
        budget: g.budget, privy: g.privy,
        unrest: this.avgUnrest(s),
        mood: this.moodName(this.avgUnrest(s)),
        worst: COLLEGES.slice().sort((a, b) => this.unrestOf(s, b) - this.unrestOf(s, a))[0],
        threat: g.threat ? THREATS[g.threat] : null,
        threatProgress: g.threatProgress || 0,
        reforms: g.reforms,
        successor: g.successor,
        heirReady: s.flags.heir_ready || 0,
        agendaLeft: this.availableAgendas(s).length
      };
    }
  };

  G.Governance = Governance;

})(window.G = window.G || {});

      if (s.ended) return true;
      if (s.flags.deviation_fatal || s.flags.expelled || s.flags.sacrificed_self) return true;
      if (s.flags.died_defending || s.flags.forced_abdication) return true;

      if (s.player.role === 'teacher' && G.Faculty.accidentCount(s) >= 2) return true;

      if (s.flags.choose_guard_seal) return true;

      if (s.player.role === 'student' && s.academy.year >= 5 && s.flags.graduation_chosen) return true;

      const cands = E
        .filter(e => !e.role || e.role === s.player.role)
        .filter(e => { try { return e.cond(s); } catch (err) { return false; } })
        .sort((a, b) => b.prio - a.prio);

      const e = cands[0] || E[E.length - 1];
      return {
        ...e,
        text: typeof e.text === 'function' ? e.text(s) : e.text,
        resume: this.buildResume(s)

    /** 存档履历：关键抉择时间线 + 最终关系网 + 成就 */
    buildResume(s) {
      const majors = s.log.filter(l => l.kind === 'major' || l.kind === 'danger').slice(-12);
      const rel = Object.keys(s.relations)
        .map(id => ({ id, name: G.NPC.name(id), ...s.relations[id] }))
        .filter(r => r.met)
        .sort((a, b) => b.favor - a.favor)

        role: s.player.role,
        realm: G.State.realmName(s.cultivation.realm, s.cultivation.layer),
        years: s.academy.year,
        turns: s.meta.playedTurns,
        reputation: s.reputation.value,
        repTier: G.Reputation.tierName(s),
        rank: G.Academy.lastRank(s),
        demonHeart: s.cultivation.demonHeart,
        faction: G.Reputation.dominant(s).name,
        storylines: G.Storyline.summary(s).filter(x => x.unlocked),
        milestones: majors,
        relations: rel

    },

    finish(s) {
      const e = this.evaluate(s);
      G.State.commit([{ path: 'ended', op: 'set', value: { id: e.id, at: Date.now() } }], 'ending');
      return e;
    },

    /** 已解锁的结局图鉴（跨存档，存在 config 里） */
    gallery() {
      const cfg = G.Save.readConfig();
      return cfg.unlockedEndings || [];
    },

    unlock(id) {
      const cfg = G.Save.readConfig();
      cfg.unlockedEndings = cfg.unlockedEndings || [];
      if (!cfg.unlockedEndings.includes(id)) {
        cfg.unlockedEndings.push(id);
        G.Save.writeConfig(cfg);
      }
    }
  };

  G.Ending = Ending;

        if (intent.riskLevel === 'high') {
          deltas.push({ path: 'cultivation.injuries', op: 'push',
                        value: { type: 'wound', severity: 1, healTurnsLeft: 1 } });
          applied.push('受伤');
        }
        if (intent.riskLevel !== 'low') {
          G.Demon.add(s, 'guilt', 2, intent.summary);
          applied.push('心魔+2');
        }
      }

      if (deltas.length) G.State.commit(deltas, 'custom.slot');
      G.State.logLine(`自拟：${intent.summary}——${G.Check.GRADE_LABEL[grade]}`, 'info');

      return {
        rejected: false, text, intent, grade, check: r, applied,
        facts: [
          `你自行安排了这个时段：${intent.summary}`,
          `判定结果：${G.Check.GRADE_LABEL[grade]}`,
          applied.length ? `数值变化：${applied.join('，')}` : ''
        ].filter(Boolean)
      };
    },

    /** 跳过事件（罕见，用于异常兜底） */
    skipEvent(s) {
      if (!this.pending) return;
      this.pending = null;
      this._advanceEvent(s || G.State.current);
    },

    _advanceEvent(s) {
      this._slotIndex++;
      if (s?.flags?._weekPlan) {
        G.State.commit([{ path: 'flags._weekPlan.done', op: 'set', value: this._slotIndex }], 'event.done');
      }
    },

    // ---------- 周末结算 ----------
    endWeek(s) {
      const notes = [];
      s.flags._midWeek = false;
      delete s.flags._weekPlan;
      G.Cultivation.weeklyTick(s);
      notes.push(...G.Rumor.weeklyTick(s));

      // 时间推进到下周
      s.time.week++;
      if (s.time.week > 4) {
        s.time.week = 1;
        s.time.month++;
        if (s.time.month > 12) { s.time.month = 1; s.time.era++; }
        notes.push(...this.monthEnd(s));
      }
      s.time.day = 1;
      s.time.phase = 'dawn';

      // 学年推进：九月为新学年
      if (s.time.month === 9 && s.time.week === 1 && s.flags._lastYearMark !== s.time.era) {
        s.flags._lastYearMark = s.time.era;
        G.Academy.advanceYear(s);
        notes.push({
          student: `新学年开始，你已是第 ${s.academy.year} 年弟子。`,
          teacher: `新学年开始，这是你在讲台上的第 ${s.academy.year} 年。`,
          headmaster: `新学年开始，你执掌云霄的第 ${s.academy.year} 年。`
        }[s.player.role]);
      }

      G.State.commit([], 'endWeek');

      if (G.Ending.shouldEnd(s)) {
        return { type: 'ended', ending: G.Ending.finish(s) };
      }
      return { type: 'weekEnd', notes, results: this._results };
    },

    monthEnd(s) {
      const notes = [];
      notes.push(...G.Economy.monthlyTick(s));
      G.Demon.monthlyTick(s);
      G.Reputation.monthlyTick(s);
      notes.push(...G.Relation.npcTick(s));
      notes.push(...G.Faculty.monthlyTick(s));
      notes.push(...G.Governance.monthlyTick(s));

      // 月考
      if (s.player.role === 'student' && [10, 11, 12, 1, 2, 3, 4, 5].includes(s.time.month)) {
        const r = G.Academy.exam(s, 'monthly');
        notes.push(`月考揭榜：第 ${r.rank} 名 / ${G.Academy.TOTAL}。${r.rewards.join('，')}`);
      }
      // 期末
      if (s.time.month === 1 || s.time.month === 6) {
        if (s.player.role === 'student') {
          const r = G.Academy.exam(s, 'final');
          notes.push(`学期大考：第 ${r.rank} 名。`);
        } else if (s.player.role === 'teacher') {
          const e = G.Faculty.evaluate(s);
          notes.push(`学期教学评价：${e.tier}（弟子 ${e.byDisciple} · 同僚 ${e.byPeer} · 院首 ${e.byHead}）`);
        }
        if (s.time.month === 6) G.State.commit([{ path: 'academy.term', op: 'add', value: 1 }], 'term');
      }
      // 劝退预警
      if (s.flags.expelled_pending === 'exam' && !s.flags.expelled) {
        notes.push('执事堂通知：你连着两次考试垫底，下次再垫底就要劝退。');
      } else if (s.flags.expelled_pending && !s.flags.expelled) {
        // 被人栽赃引出来的预警：听证会已经开过、或者续章作废了，就撤掉
        const waiting = s.events.activeChains.some(c => c.eventId === 'evt_expulsion_hearing');
        if (!waiting) delete s.flags.expelled_pending;
        else notes.push('执事堂通知：栽赃那件事要开听证会，结果出来之前你都背着劝退的名头。');
      }
      return notes;
    },

    // ---------- 便捷入口 ----------
    /** 无人值守自动推演一周（测试与"快进"用） */
    autoWeek(s, chooser) {
      this.beginWeek(s);
      let guard = 0;
      while (guard++ < 200) {
        const r = this.step(s);
        if (!r) break;
        if (r.type === 'event') {
          const ev = r.event;
          const opts = ev.options.filter(o => !o.custom);
          const pick = chooser ? chooser(ev, opts) : G.rng.pick(opts);
          this.resolveEvent(s, pick.id);
        }
        if (r.type === 'weekEnd' || r.type === 'ended') return r;
      }
      return { type: 'weekEnd', notes: ['(推演超时)'], results: this._results };
    }
  };

  G.Game = Game;

})(window.G = window.G || {});

    async parseAction(s, freeText, ev) {

/* ===== llm/memory.js — 上下文压缩 =====
 * 总输入稳定在 2500-3000 token，与游戏进度无关。
 * 这是整个设计里最要紧的工程约束。
 */
(function (G) {
  'use strict';

  const SUMMARIZE_EVERY = 8;    // 每 8 回合压一次
  const KEEP_RECENT = 3;        // 保留最近 3 回合原文
  const MAX_SUMMARY_CHARS = 900;

  const Memory = {
    SUMMARIZE_EVERY, KEEP_RECENT,

    /** 记录一回合的事实 */
    push(s, facts, digest) {
      const rec = s.llmMemory.recentTurns.slice();
      rec.push({
        turn: s.time.absoluteTurn,
        facts: (facts || []).slice(0, 6),
        digest: (digest || '').slice(0, 160)
      });
      while (rec.length > KEEP_RECENT + SUMMARIZE_EVERY) rec.shift();
      G.State.commit([{ path: 'llmMemory.recentTurns', op: 'set', value: rec }], 'memory.push');
    },

    /** 组装给 prompt 用的记忆块 */
    build(s) {
      const rec = s.llmMemory.recentTurns.slice(-KEEP_RECENT);
      return {
        summary: s.llmMemory.summary || '',
        recent: rec.map(r => r.facts.join('；')).filter(Boolean)
      };
    },

    /** 是否到了该压缩的时候 */
    shouldSummarize(s) {
      const pending = s.llmMemory.recentTurns.filter(r => r.turn > s.llmMemory.summarizedUpTo);
      return pending.length >= SUMMARIZE_EVERY + KEEP_RECENT;
    },

    /** 执行压缩。有 LLM 用 LLM，没有就用本地规则压。 */
    async compress(s) {
      const pending = s.llmMemory.recentTurns
        .filter(r => r.turn > s.llmMemory.summarizedUpTo)
        .slice(0, SUMMARIZE_EVERY);
      if (!pending.length) return;

      const lines = pending.map(r => r.facts.join('；')).filter(Boolean);
      let next;

      if (G.LLM.configured) {
        try {
          next = await G.LLM.summarize(s.llmMemory.summary, lines);
        } catch (e) {
          next = this.localCompress(s.llmMemory.summary, lines);
        }
      } else {
        next = this.localCompress(s.llmMemory.summary, lines);
      }

      if (next.length > MAX_SUMMARY_CHARS) {
        next = next.slice(next.length - MAX_SUMMARY_CHARS);
        const cut = next.indexOf('。');
        if (cut > 0 && cut < 80) next = next.slice(cut + 1);
      }

      const upTo = pending[pending.length - 1].turn;
      G.State.commit([
        { path: 'llmMemory.summary', op: 'set', value: next },
        { path: 'llmMemory.summarizedUpTo', op: 'set', value: upTo }
      ], 'memory.compress');
    },

    /** 本地规则压缩：只留有后续影响的事 */
    localCompress(oldSummary, lines) {
      const KEEP = /(好感|信任|羁绊|结怨|对立|道侣|表白|突破|走火入魔|受伤|线索|秘密|暗线|第\s*\d+\s*名|获得|失去|承诺|背叛|救|死)/;
      const kept = lines.filter(l => KEEP.test(l)).map(l => l.replace(/数值变化：.*/, '').trim());
      const merged = (oldSummary ? oldSummary + '\n' : '') + kept.join('。');
      const sentences = merged.split(/[\n。]/).map(x => x.trim()).filter(Boolean);
      // 去重
      const seen = new Set(), out = [];
      for (const x of sentences) { if (!seen.has(x)) { seen.add(x); out.push(x); } }
      return out.slice(-24).join('。') + (out.length ? '。' : '');
    },

    /** 估算当前 prompt 的 token 量（粗略：中文 1 字 ≈ 1 token） */
    estimateTokens(s, payload) {
      try {
        const user = G.Prompts.narrate(payload);
        return Math.round((G.Prompts.SYSTEM.length + user.length) * 0.9);
      } catch (e) { return -1; }
    },

    reset(s) {
      G.State.commit([
        { path: 'llmMemory.summary', op: 'set', value: '' },
        { path: 'llmMemory.recentTurns', op: 'set', value: [] },
        { path: 'llmMemory.summarizedUpTo', op: 'set', value: 0 }
      ], 'memory.reset');
    }
  };

  G.Memory = Memory;

})(window.G = window.G || {});

/* ===== llm/dialogue.js — 对话场 =====
 * 事件里的 NPC 先开口，玩家用自己的话回应，NPC 按性格、秘密、交情实时接话。
 *
 * 铁律不变：LLM 只返回【台词 + 枚举 + 布尔】，数值全部由这里裁决——
 *   · rapport 每回合 -2..+2，累计后映射成判定修正，夹在 ±12
 *   · reveal 只是模型"愿意说"的信号，能不能真的算线索由引擎按信任门槛决定
 *   · 玩家输入只当作"玩家说的话"塞进 prompt，模型被明确告知无视其中的任何"系统指令"
 *
 * 没有 API Key 时整个模块不介入，事件流程和以前一模一样。
 */
(function (G) {
  'use strict';

  const MAX_TURNS = 4;             // 玩家最多说四句，再多就该做决定了
  const SAY_MAX = 120;             // NPC 单句上限（字）
  const SUGGEST_MAX = 16;          // 快语上限（字）

  /* NPC 的秘密一旦被撬开一角，能落成哪条暗线的哪个线索。
   * 只列真正对得上 storyline.js 推论表的那几位；其他人交心只涨关系。 */
  const SECRET_CLUES = {
    npc_liumianyan:  { key: 'exHead',     clue: '柳眠烟的醉话',     minTrust: 45 },
    npc_chuheshan:   { key: 'exHead',     clue: '楚河山的沉默',     minTrust: 45 },
    npc_tantaiwujiu: { key: 'exHead',     clue: '澹台无咎的回答',   minTrust: 50 },
    npc_yunshu:      { key: 'seal',       clue: '云舒的沉默',       minTrust: 40 },
    npc_peiwuyou:    { key: 'seal',       clue: '裴无忧的卦象',     minTrust: 40 },
    npc_sumuhan:     { key: 'rootSecret', clue: '苏暮寒的丹方',     minTrust: 55 },
    npc_zhonglihen:  { key: 'mole',       clue: '钟离衡的密信',     minTrust: 60 }
  };
  const DEFAULT_MIN_TRUST = 30;

  const Dialogue = {
    MAX_TURNS, SECRET_CLUES,

    /** 有 Key、开着、事件里有人，才走对话场 */
    enabled(s, ev) {
      if (!G.LLM.configured || !G.LLM.config.enabled) return false;
      if (G.LLM.config.dialogue === false) return false;
      if (!ev || !ev.actors || !ev.actors.length) return false;
      return !!G.NPC.get(ev.actors[0]);
    },

    /**
     * 开一段对话。session 不进存档——它是一次性的，结束时把结果落进状态。
     * @param kind 'event'（事件内）| 'message'（回传音）
     */
    begin(s, o) {
      return {
        kind: o.kind || 'event',          // event | message | demon
        npcId: o.npcId || null,
        speaker: o.speaker || null,        // 非 NPC 的说话者（心魔）：{ name, portraitId }
        trial: o.trial || null,            // 心魔关骨架
        maxTurns: o.maxTurns || MAX_TURNS,
        event: o.event || null,
        scene: o.scene || null,
        turns: [],          // { who:'npc'|'player', text, expr }

        revealed: false,
        closed: false,
        ended: false,

    // ---------- 与模型对话 ----------

    /** NPC 开口第一句（事件对话）；回传音时用传音原文当第一句，不额外调用 */
    async open(s, ss, opener) {
      if (opener) {
        ss.turns.push({ who: 'npc', text: opener, expr: 'calm' });

        ss.suggest = this.defaultSuggest(s, ss);

      const turn = await this._ask(s, ss, null);
      this._absorb(ss, turn);
      return ss;
    },

    /** 玩家说一句，NPC 接一句 */
    async reply(s, ss, playerText) {

    },

    async _ask(s, ss, playerText) {

        obj = G.LLM._extractJSON(raw);

          raw = await G.LLM.call(sys, user + '\n\n注意：上一次输出不是合法 JSON。只输出一个 JSON 对象。',

    },

    _absorb(ss, turn) {
      if (turn._failed) { ss.ended = true; ss.closed = true; return; }
      ss.turns.push({ who: 'npc', text: turn.say, expr: turn.expr });

    validateTurn(s, obj) {

      const rapport = Math.max(-2, Math.min(2, Number.isFinite(+obj?.rapport) ? Math.round(+obj.rapport) : 0));

        if (tru) deltas.push({ path: `relations.${id}.trust`, op: 'add', value: tru, clamp: [0, 100] });

        if (tru) notes.push(`信任+${tru}`);

        // 聊得特别好/特别僵，会被人说出去；聊得好还能把 TA 听到的坏话压下去

            { path: `flags._reveal_${id}`, op: 'set', value: true },
            { path: `relations.${id}.trust`, op: 'add', value: 4, clamp: [0, 100] },
            { path: `relations.${id}.bond`, op: 'add', value: 3, clamp: [0, 100] },

          facts.push(`${npc.name}对你透露了一点从不示人的心事`);

      if (Math.random() > 0.45) return null;

      const cands = [];
      for (const npc of G.DATA.npcs) {
        const r = s.relations[npc.id];
        if (!r || !G.NPC.available(s, npc.id)) continue;
        if (!r.met && r.favor < 20) continue;
        const since = s.time.absoluteTurn - (s.flags['_msg_' + npc.id] || -999);

      return cands[cands.length - 1].id;
    },

    /** 让模型替这位 NPC 写一条传音，落进 flags._pendingMsg */
    async composeMessage(s, npcId) {
      const sys = G.Prompts.dialogueSystem(s, { npcId, kind: 'message', turns: [] });
      const user = G.Prompts.messageCompose(s, npcId);
      let obj = null;
      try {
        const raw = await G.LLM.call(sys, user, { maxTokens: 300, temperature: 0.95, timeout: 45000 });
        obj = G.LLM._extractJSON(raw);
      } catch (e) { return null; }
      if (!obj) return null;
      const text = G.LLM.sanitize(String(obj.text || '')).replace(/\s+/g, ' ').trim().slice(0, 90);
      if (text.length < 4) return null;

      G.State.commit([
        { path: 'flags._pendingMsg', op: 'set', value: msg },
        { path: 'flags._lastMsgTurn', op: 'set', value: s.time.absoluteTurn },
        { path: `flags._msg_${npcId}`, op: 'set', value: s.time.absoluteTurn }
      ], 'message.compose');
      return msg;
    },

    /** 不理会：对方会记得 */
    ignoreMessage(s) {
      const msg = s.flags._pendingMsg;
      if (!msg) return;
      G.Relation.act(s, msg.npcId, 'ignore_long');
      G.State.commit([{ path: 'flags._pendingMsg', op: 'set', value: null }], 'message.ignore');
      G.State.logLine(`${G.NPC.name(msg.npcId)}的传音，你没有回。`, 'info');
    },

    /** 回话结束：按聊得好坏给关系，清掉待办 */

      G.State.commit([{ path: 'flags._pendingMsg', op: 'set', value: null }], 'message.settle');
      G.State.logLine(`回了${G.NPC.name(ss.npcId)}的传音：${this.hint(s, ss)}`, 'info');

      const last = ss.turns.filter(t => t.who === 'npc' && t.text).slice(-1)[0];

/* ==== llm/narrator.js ==== */
/* ===== llm/narrator.js — 叙事调度 =====
 * 关键纪律：commit 必须在调用 LLM【之前】完成。
 * 叙事失败只影响表现，不影响状态，重试即可。
 */
(function (G) {
  'use strict';

  const Narrator = {
    busy: false,
    lastError: null,

    sceneOf(s, ev) {
      const id = ev?.scene || G.DATA.static.collegeScene[s.player.college] || 'scene_main_plaza';
      const meta = G.DATA.static.scenes.find(x => x.id === id);
      return { id, name: meta?.name || '云霄仙院', desc: ev?.sceneDesc || '' };
    },

    /**
     * 渲染一次事件结算的叙事。
     * @param {object} res  G.Event.resolve 的返回值
     * @param {function} onChunk 流式回调 (piece, full)
     */
    async renderResolution(s, res, onChunk, extra) {
      const ev = res.event;
      const dlgFacts = extra?.dialogueFacts || [];
      const payload = {
        state: s,
        scene: this.sceneOf(s, ev),
        facts: dlgFacts.concat(res.facts),
        event: ev,
        grade: res.grade,
        outcome: res.outcome,
        actors: ev.actors || [],
        memory: G.Memory.build(s),
        important: this.isImportant(ev, res),
        dialogue: extra?.dialogue || null
      };

      const text = await this._render(payload, onChunk);

      // 记忆推进。对话稿本身太长不进记忆，只留"聊完之后对方态度如何"和交心这两类事实
      const remember = dlgFacts.filter(f => !f.startsWith('此前的对话')).concat(res.facts);
      G.Memory.push(s, remember, text.slice(0, 150));
      if (G.Memory.shouldSummarize(s)) {
        G.Memory.compress(s).catch(e => console.warn('[memory] 压缩失败', e));
      }
      return text;
    },

    /** 渲染事件的开场（玩家做选择之前） */
    async renderPrompt(s, ev, onChunk) {
      const payload = {
        state: s,
        scene: this.sceneOf(s, ev),
        facts: (ev.facts || []).concat([ev.seed]).filter(Boolean),
        event: ev,
        grade: null,
        outcome: { narrative: ev.seed },
        actors: ev.actors || [],
        memory: G.Memory.build(s),
        important: false,
        style: { length: 900 }
      };
      return await this._render(payload, onChunk);
    },

    async _render(payload, onChunk) {
      this.lastError = null;
      if (G.LLM.configured && G.LLM.config.enabled) {
        this.busy = true;
        try {
          const t = await G.LLM.narrate(payload, onChunk);
          if (t && t.length > 40) return t;
          throw new Error('返回内容过短');
        } catch (e) {
          this.lastError = e.message;
          console.warn('[narrator] LLM 失败，降级为模板：', e.message);
        } finally {
          this.busy = false;
        }
      }
      const t = G.Fallback.narrate(payload);
      if (onChunk) onChunk(t, t);
      return t;
    },

    /** 哪些场景值得用高级模型 */
    isImportant(ev, res) {
      if (!ev) return false;
      if (ev.important) return true;
      if (ev.fixed) return true;
      if (ev.category === 'storyline' || ev.category === 'crisis') return true;
      if (res && (res.grade === 'perfect' || res.grade === 'terrible')) return true;
      return false;
    },

    // ---------- 心魔关 ----------
    async renderDemonTrial(s, trial, onChunk) {
      if (G.LLM.configured && G.LLM.config.enabled) {
        try {
          return await G.LLM.demonTrial(s, trial, onChunk);
        } catch (e) {
          this.lastError = e.message;
        }
      }
      const t = G.Fallback.demonTrial(s, trial);
      if (onChunk) onChunk(t, t);
      return t;
    },

    // ---------- 结局 ----------
    async renderEpilogue(s, ending) {
      if (G.LLM.configured && G.LLM.config.enabled) {
        try { return await G.LLM.epilogue(s, ending); }
        catch (e) { this.lastError = e.message; }
      }
      return G.Fallback.epilogue(s, ending);
    },

    // ---------- 自定义行动 ----------
    async parseCustom(s, text, ev) {
      if (G.LLM.configured && G.LLM.config.enabled) {
        try { return await G.LLM.parseAction(s, text, ev); }
        catch (e) { this.lastError = e.message; }
      }
      return G.Fallback.parseAction(s, text, ev);
    },

    /** 简短的活动结果播报（不走 LLM，省钱） */
    activityLine(s, r) {
      if (!r || r.type !== 'activity') return '';
      const d = r.detail || {};
      if (d.fail) return d.fail;
      if (d.idle) return '';
      switch (r.cat) {
        case 'cultivate':
          return `${r.name}，修为 +${d.gain || 0}。`;
        case 'study': {
