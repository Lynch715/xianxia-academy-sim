      const s = this.current;
      return s.attrs[LUCK_ATTR[s.player.role]] || 0;
    }
  };

  G.State = State;

})(window.G = window.G || {});


/* ==== core/check.js ==== */
/* ===== core/check.js — 五档判定引擎 =====
 * 圆满 perfect / 尚可 good / 平淡 plain / 不利 bad / 糟糕 terrible
 * 属性主导，运气次之，选择合理性可顶约 1.4 个档位。
 */
(function (G) {
  'use strict';

  const GRADES = ['terrible', 'bad', 'plain', 'good', 'perfect'];

  const GRADE_LABEL = {
    perfect: '圆满', good: '尚可', plain: '平淡', bad: '不利', terrible: '糟糕'
  };

  // 各档结果的收益倍率
  const GRADE_MULT = { perfect: 1.5, good: 1.0, plain: 0.4, bad: -0.5, terrible: -1.0 };

  function bump(grade, dir) {
    const i = GRADES.indexOf(grade);
    return GRADES[Math.max(0, Math.min(GRADES.length - 1, i + dir))];
  }

  const Check = {
    GRADES, GRADE_LABEL, GRADE_MULT, bump,

    /** attr 原始值(0-18) → 0-100 */
    normalize(v, cap) {
      const c = cap || G.State.ATTR_SETS[G.State.current.player.role].cap;
      return Math.max(0, Math.min(100, (v / c) * 100));
    },

    /**
     * @param {object} o
     *   attrKey    参与判定的属性键，null 表示纯运气
     *   difficulty 10-90
     *   modifiers  数组或数字，关系/道具/环境/状态加成，合计 clamp ±30
     *   reason     选择合理性 -15 ~ +20
     *   noCrit     禁用奇遇/失手
     * @returns {{grade, score, roll, detail}}
     */
    roll(o) {
      const s = G.State.current;
      const cap = G.State.ATTR_SETS[s.player.role].cap;

      const attrRaw = o.attrKey ? (s.attrs[o.attrKey] || 0) : cap * 0.5;
      const base = this.normalize(attrRaw, cap) * 0.5;                       // 0-50

      let mod = Array.isArray(o.modifiers)
        ? o.modifiers.reduce((a, b) => a + (Number(b) || 0), 0)
        : (Number(o.modifiers) || 0);
      mod = Math.max(-30, Math.min(30, mod));

      const rsn = Math.max(-15, Math.min(20, Number(o.reason) || 0));
      const dif = 50 - Math.max(10, Math.min(90, Number(o.difficulty) || 50));

      const roll = G.rng.int(1, 100);
      const luck = (roll - 55) * 0.6;                                        // -32 ~ +27

      const score = base + mod + rsn + dif + luck;

      let grade = score >= 70 ? 'perfect'
                : score >= 45 ? 'good'
                : score >= 20 ? 'plain'
                : score >= -5 ? 'bad'
                : 'terrible';

      let crit = null;
      if (!o.noCrit) {
        const luckAttr = G.State.luckValue();
        const critHi = 96 - Math.floor(this.normalize(luckAttr, cap) * 0.06); // 机缘满 → 90
        if (roll >= critHi)      { grade = bump(grade, 1);  crit = 'up'; }
        else if (roll <= 5)      { grade = bump(grade, -1); crit = 'down'; }
      }

      return {
        grade, score: Math.round(score), roll, crit,
        detail: { base: Math.round(base), mod, rsn, dif, luck: Math.round(luck), attrKey: o.attrKey }
      };
    },

    /** 简单二元判定，用于内部小概率分支 */
    pass(o) {
      const r = this.roll(o);
      return GRADES.indexOf(r.grade) >= 2;
    },

    /** 给玩家看的模糊提示，绝不暴露精确数字 */
    vagueHint(o) {
      const s = G.State.current;
      const cap = G.State.ATTR_SETS[s.player.role].cap;
      const attrRaw = o.attrKey ? (s.attrs[o.attrKey] || 0) : cap * 0.5;
      const est = this.normalize(attrRaw, cap) * 0.5 + (50 - (o.difficulty || 50)) + (o.reason || 0);
      if (est >= 55) return '你觉得这事不难';
      if (est >= 30) return '有几分把握';
      if (est >= 5)  return '心里没底';
      if (est >= -20) return '恐怕力有不逮';
      return '这几乎是自寻死路';
    }
  };

  G.Check = Check;

})(window.G = window.G || {});


/* ==== core/time.js ==== */
/* ===== core/time.js — 时间推进 =====
 * 回合粒度是"周"：玩家排完一周日程 → 推演本周 → 逐时段结算，遇事件暂停。
 * 一天三时段 晨/午/暮，一周七天 = 21 时段。
 */
(function (G) {
  'use strict';

  const PHASES = ['dawn', 'noon', 'dusk'];
  const PHASE_LABEL = { dawn: '晨', noon: '午', dusk: '暮' };
  const DAY_LABEL = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  const MONTH_CN = ['', '正月', '二月', '三月', '四月', '五月', '六月',
                    '七月', '八月', '九月', '十月', '冬月', '腊月'];

  // 学年节点：月份 → 固定事件 id
  const FIXED_BY_MONTH = {
    9:  'fixed_opening_ceremony',
    10: 'fixed_freshman_exam',
    12: 'fixed_dongzhi_debate',
    1:  'fixed_term_final',
    3:  'fixed_spring_hunt',
    4:  'fixed_seven_college_tourney',
    5:  'fixed_inter_academy',
    6:  'fixed_year_final'
  };

  const Time = {
    PHASES, PHASE_LABEL, DAY_LABEL, MONTH_CN, FIXED_BY_MONTH,

    label(s) {
      const t = s.time;
      return `灵元历${t.era}年 · ${MONTH_CN[t.month]} · 第${t.week}周 · ${DAY_LABEL[t.day - 1]} · ${PHASE_LABEL[t.phase]}`;
    },

    shortLabel(s) {
      const t = s.time;
      return `${MONTH_CN[t.month]}第${t.week}周`;
    },

    /** 手机顶栏用：去掉纪年，一行放得下 */
    compactLabel(s) {
      const t = s.time;
      return `${MONTH_CN[t.month]}·第${t.week}周·${DAY_LABEL[t.day - 1]}${PHASE_LABEL[t.phase]}`;
    },

    /** 是否游历期（七、八月） */
    isVacation(s) { return s.time.month === 7 || s.time.month === 8; },

    /** 推进一个时段。返回 {rolledDay, rolledWeek, rolledMonth, rolledYear} */
    advancePhase(s) {
      const t = s.time;
      const flags = { day: false, week: false, month: false, year: false };
      t.absoluteTurn++;

      const i = PHASES.indexOf(t.phase);
      if (i < PHASES.length - 1) {
        t.phase = PHASES[i + 1];
        return flags;
      }

      t.phase = 'dawn';
      t.day++;
      flags.day = true;

      if (t.day > 7) {
        t.day = 1;
        t.week++;
        flags.week = true;
      }
      if (t.week > 4) {
        t.week = 1;
        t.month++;
        flags.month = true;
      }
      if (t.month > 12) {
        t.month = 1;
        t.era++;
        flags.year = true;
      }
      return flags;
    },

    /** 推进整整一周（21 时段），供跳过用 */
    advanceWeek(s) {
      for (let i = 0; i < 21; i++) this.advancePhase(s);
    },

    /** 学年切换：九月为新学年起点 */
    isNewAcademicYear(s) { return s.time.month === 9 && s.time.week === 1 && s.time.day === 1; },

    /** 本月是否有固定事件待触发 */
    pendingFixedEvent(s) {
      const id = FIXED_BY_MONTH[s.time.month];
      if (!id) return null;
      const key = `${s.time.era}_${s.time.month}_${id}`;
      if (s.flags['fixed_done_' + key]) return null;
      // 固定事件安排在当月第二周
      if (s.time.week !== 2) return null;
      return { id, key };
    },

    markFixedDone(s, key) { s.flags['fixed_done_' + key] = true; }
  };

  G.Time = Time;

})(window.G = window.G || {});


/* ==== core/save.js ==== */
/* ===== core/save.js — 存档 =====
 * localStorage 三个槽位 + 自动存档槽 + JSON 导入导出。
 * 读档时用 seed + rngCursor 重建随机流，保证可复现。
 */
(function (G) {
  'use strict';

  const PREFIX = 'xxxy_save_';
  const AUTO = PREFIX + 'auto';
  const PREV = PREFIX + 'prev';      // 上一局：开新局时自动备份，误点也找得回来
  const CFG_KEY = 'xxxy_config';

  const Save = {
    _throttle: null,
    enabled: true,

    slots() {
      const out = [];
      for (let i = 1; i <= 3; i++) {
        const raw = this._read(PREFIX + i);
        out.push(raw ? this._digest(raw, i) : { slot: i, empty: true });
      }
      const auto = this._read(AUTO);
      out.push(auto ? this._digest(auto, 'auto') : { slot: 'auto', empty: true });
      return out;
    },

    _digest(s, slot) {
      return {
        slot, empty: false,
        name: s.player.name,
        role: s.player.role,
        realm: G.State.realmName(s.cultivation.realm, s.cultivation.layer),
        time: G.Time.label(s),
        turns: s.meta.playedTurns,
        savedAt: s.meta.savedAt || s.meta.createdAt
      };
    },

    _read(key) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) { console.warn('[save] 读取失败', key, e); return null; }
    },

    _write(key, s) {
      try {
        s.meta.savedAt = Date.now();
        s.meta.rngCursor = G.rng ? G.rng.cursor : 0;
        localStorage.setItem(key, JSON.stringify(s));
        return true;
      } catch (e) {
        console.error('[save] 写入失败，可能是容量超限', e);
        return false;
      }
    },

    save(slot) { return this._write(PREFIX + slot, G.State.current); },

    autosave() {
      if (!this.enabled || !G.State.current) return;
      clearTimeout(this._throttle);
      this._throttle = setTimeout(() => { this._throttle = null; this._write(AUTO, G.State.current); }, 400);
    },

    /**
     * 立刻把一切落盘：自动存档 + 玩家配置（含 API 密钥）。
     * 退出、切后台、锁屏、关标签页时调用——节流里那 400ms 若正好撞上退出，
     * 最后一次改动就丢了。这里不等，直接写。
     */
    flush() {
      if (this._throttle) { clearTimeout(this._throttle); this._throttle = null; }
      if (this.enabled && G.State.current) this._write(AUTO, G.State.current);
      if (G.LLM && G.LLM.config) G.LLM.save();
    },

    /** 监听所有"玩家要走了"的信号。pagehide 是 iOS 上唯一靠得住的那个。 */
    watchExit() {
      if (this._watching) return;
      this._watching = true;
      const f = () => this.flush();
      window.addEventListener('pagehide', f);
      window.addEventListener('beforeunload', f);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') f(); });
      window.addEventListener('blur', f);
      // 兜底：每 30 秒也写一次，防止哪个信号在某个浏览器上根本不发
      setInterval(() => { if (this._throttle) f(); }, 30000);
    },

    /** 开新局之前把上一局挪到「上一局」槽，误点「入院」也找得回来 */
    backupAuto(force) {
      const cur = this._read(AUTO);
      // 一步没玩的新局不值得备份（否则会把真正的上一局顶掉）；显式对调时例外
      if (cur && cur.meta && (force || (cur.meta.playedTurns || 0) > 0)) {
        try { localStorage.setItem(PREV, JSON.stringify(cur)); } catch (e) { /* 容量不够就算了 */ }
      }
    },
    hasPrev() { return !!this._read(PREV); },
    /** 当前局与上一局对调：先把上一局读出来，再把当前局挪进备份槽，两边都不丢 */
    swapPrev() {
      const prev = this._read(PREV);
      if (!prev) return false;
      this.backupAuto(true);
      if (!this.adopt(prev)) return false;
      this._write(AUTO, G.State.current);
      return true;
    },

    load(slot) {
      const s = this._read(slot === 'auto' ? AUTO : PREFIX + slot);
      if (!s) return false;
      return this.adopt(s);
    },

    adopt(s) {
      const migrated = this.migrate(s);
      G.State.current = migrated;
      G.initRNG(migrated.meta.seed, migrated.meta.rngCursor || 0);
      G.State.recalc();
      G.State.emit('loaded', {});
      return true;
    },

    /** 版本迁移。新增字段在这里补默认值，老存档才不会炸。 */
    migrate(s) {
      s.meta = s.meta || {};
      s.rumors = s.rumors || [];        // 1.1 传闻系统，老存档补空表
      const v = s.meta.version || '0.0.0';
      if (v !== G.State.VERSION) {
        s.storylines = s.storylines || {
          seal:{unlocked:false,progress:0,clues:[]}, exHead:{unlocked:false,progress:0,clues:[]},
          mole:{unlocked:false,progress:0,clues:[]}, rootSecret:{unlocked:false,progress:0,clues:[]}
        };
        s.llmMemory = s.llmMemory || { summary:'', recentTurns:[], summarizedUpTo:0 };
        s.events = s.events || { activeChains:[], cooldowns:{}, seen:[], pendingFixed:[], queue:[] };
        s.events.queue = s.events.queue || [];
        s.log = s.log || [];
        s.flags = s.flags || {};
        s.reputation = s.reputation || { value:5, tags:[], factions:{traditional:0,reform:0,xiaoyao:0,pragmatic:0} };
        // 1.2 卡关修复：旧的劝退预警改成带来源；「想想」之后没下文的补一个
        if (s.flags.expelled_pending === true &&
            !(s.events.activeChains || []).some(c => c.eventId === 'evt_expulsion_hearing')) {
          s.flags.expelled_pending = 'exam';
        }
        if (s.flags.confession_pending && !s.flags.confession_handled &&
            !(s.events.activeChains || []).some(c => c.eventId === 'evt_confession_followup')) {
          s.events.activeChains.push({ chainId: 'evt_confession_received', eventId: 'evt_confession_followup',
                                       actor: null, dueTurn: (s.time?.absoluteTurn || 0) + 21 });
        }
        s.meta.version = G.State.VERSION;
        // P5 新增的两条路线状态，老存档补齐
        const cur = G.State.current;
        G.State.current = s;
        try { G.Faculty.init(s); G.Governance.init(s); } finally { G.State.current = cur; }
      }
      return s;
    },

    del(slot) { localStorage.removeItem(slot === 'auto' ? AUTO : slot === 'prev' ? PREV : PREFIX + slot); },

    exportJSON() {
      const s = G.State.current;
      s.meta.savedAt = Date.now();
      s.meta.rngCursor = G.rng ? G.rng.cursor : 0;
      return JSON.stringify(s, null, 2);
    },

    exportFile() {
      const blob = new Blob([this.exportJSON()], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const s = G.State.current;
      a.download = `云霄仙院_${s.player.name}_${G.Time.shortLabel(s)}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    },

    importJSON(text) {
      try {
        const s = JSON.parse(text);
        if (!s.player || !s.meta) throw new Error('不是有效的存档文件');
        return this.adopt(s);
      } catch (e) { console.error('[save] 导入失败', e); return false; }
    },

    // ---------- 玩家配置（LLM 密钥等，与存档分离） ----------
    readConfig() {
      try { return JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); }
      catch (e) { return {}; }
    },
    writeConfig(cfg) {
      try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); return true; }
      catch (e) { return false; }
    },
    clearConfig() { localStorage.removeItem(CFG_KEY); }
  };

  G.Save = Save;

})(window.G = window.G || {});

/* ===== systems/npc.js — NPC 索引与查询 ===== */
(function (G) {
  'use strict';

  const NPC = {
    _map: null,

    index() {
      if (!this._map) {
        this._map = {};
        for (const n of G.DATA.npcs) this._map[n.id] = n;
      }
      return this._map;
    },

    get(id) { return this.index()[id] || null; },
    name(id) { return this.get(id)?.name || '某人'; },
    all() { return G.DATA.npcs; },

    byTrack(track) { return G.DATA.npcs.filter(n => n.track === track); },
    byCollege(c) { return G.DATA.npcs.filter(n => n.college === c); },
    romanceable() { return G.DATA.npcs.filter(n => n.romanceable); },

    /** 当前是否可能出现在游戏中 */
    available(s, id) {
      const n = this.get(id);
      if (!n) return false;
      if (n.appearMonth && !n.appearMonth.includes(s.time.month)) return false;
      return true;
    },

    /** 玩家同院的同届同窗 */
    classmates(s) {
      return G.DATA.npcs.filter(n => n.track === 'student' && n.grade === 'same');
    },

    /** 玩家所属学院的院首/教习 */
    facultyOf(college) {
      return G.DATA.npcs.filter(n => n.track === 'faculty' && n.college === college);
    },

    portraitPath(id, expr) {
      return `assets/portraits/${id}_${expr || 'calm'}.webp`;
    },

    /** 送礼判定：礼物是否投其所好 */
    giftReaction(id, itemId) {
      const n = this.get(id);
      if (!n) return 'gift_neutral';
      const item = G.DATA.static.items.find(i => i.id === itemId);
      if (!item) return 'gift_neutral';
      const hay = (n.gift || []).join(' ') + ' ' + (n.likes || []).join(' ');
      const bad = (n.dislikes || []).join(' ');
      if (hay.includes(item.name)) return 'gift_liked';
      if (bad.includes(item.name)) return 'gift_disliked';
      // 价值兜底：贵重礼物至少不亏
      if (item.price >= 150) return 'gift_liked';
      return 'gift_neutral';
    }
  };

  G.NPC = NPC;

})(window.G = window.G || {});

/* ===== systems/cultivation.js — 修炼 · 突破 · 心魔 ===== */
(function (G) {
  'use strict';

  const Cultivation = {

    // ---------- 修为上限 ----------
    expMaxFor(realm, layer) {
      switch (realm) {
        case 'qi':       return Math.round(500 * (1 + layer * 0.15));
        // 原来是 8000×层：全排打坐一周三百来点，五年都出不了筑基，
        // 金丹、毕业、一代天骄全成了摆设
        case 'zhuji':    return 2500 * layer;
        case 'jindan':   return 40000 * layer;
        case 'yuanying': return 200000 * layer;
        default:         return 1000000;
      }
    },

    // ---------- 系数 ----------
    rootCoef(s) {
      const D = G.DATA.static;
      const q = D.spiritRootQuality.find(x => x.id === s.player.spiritRoot.quality);
      let coef = q ? q.coef : 1.0;
      // 所修功法属性与灵根契合时额外加成
      const tech = D.techniques.find(t => t.id === s.cultivation.technique);
      if (tech && tech.element && s.player.spiritRoot.elements.includes(tech.element)) {
        coef *= 1.15;
      }
      return coef;
    },

    techMult(s) {
      const t = G.DATA.static.techniques.find(x => x.id === s.cultivation.technique);
      return t ? t.mult : 1.0;
    },

    envCoef(place) {
      return ({ dorm: 1.0, hall: 1.2, vein: 1.5, realm: 2.2, field: 1.1 })[place] || 1.0;
    },

    moodCoef(s) { return 1 - s.cultivation.demonHeart / 250; },

    /** 单次修炼收益 */
    gainFor(s, place) {
      const wu = s.attrs.wu ?? s.attrs.xiu ?? 5;
      const base = 4 + wu * 1.2;
      const talent = G.DATA.static.talents.find(t => t.id === s.player.talent);
      let g = base * this.techMult(s) * this.rootCoef(s) * this.envCoef(place) * this.moodCoef(s);
      if (talent?.mods?.swordExp && s.player.college === 'jianyuan') g *= (1 + talent.mods.swordExp);
      return Math.max(1, Math.floor(g));
    },

    /** 执行一次打坐修炼 */
    meditate(s, place) {
      place = place || 'dorm';
      const gain = this.gainFor(s, place);
      const deltas = [{ path: 'cultivation.exp', op: 'add', value: gain, min: 0 }];

      // 小概率杂念：心魔上涨
      if (G.rng.chance(8 + s.cultivation.demonHeart * 0.1)) {
        deltas.push({ path: 'cultivation.demonHeart', op: 'add', value: 1, clamp: [0, 100] });
      }
      G.State.commit(deltas, 'meditate');
      G.State.logLine(`打坐修炼，修为 +${gain}`, 'cultivate');
      return { gain, place };
    },

    // ---------- 突破 ----------
    canBreakthrough(s) {
      return s.cultivation.exp >= s.cultivation.expMax && s.cultivation.resting <= 0;
    },

    layerPenalty(s) {
      const c = s.cultivation;
      return c.realm === 'qi' ? c.layer * 2 : c.layer * 4;
    },

    successRate(s, opts) {
      opts = opts || {};
      const xin = s.attrs.xin ?? 5;
      let r = 55 + xin * 3;
      if (opts.pill === 'pozhang_dan') r += 20;
      r += ({ dorm: 0, hall: 5, vein: 12, realm: 8 })[opts.place] || 0;
      if (opts.guardian) r += 10;
      r -= s.cultivation.demonHeart * 0.5;
      r -= this.layerPenalty(s);
      const talent = G.DATA.static.talents.find(t => t.id === s.player.talent);
      if (talent?.mods?.demonGain < 0) r += 5;
      return Math.max(8, Math.min(92, Math.round(r)));
    },

    /** 第一步：进入突破，抽取心魔关 */
    beginBreakthrough(s, opts) {
      opts = opts || {};
      const rate = this.successRate(s, opts);
      const trial = G.Demon.pickTrial(s);
      s.flags._btOpts = opts;
      s.flags._btRate = rate;
      return { rate, trial, hint: this.rateHint(rate) };
    },

    rateHint(rate) {
      if (rate >= 80) return '你感到丹田内的灵气异常温顺，像是早就等着这一刻。';
      if (rate >= 60) return '灵气流转尚算平稳，只是偶有一丝滞涩。';
      if (rate >= 40) return '你感到丹田内的灵气比往日躁动。';
      if (rate >= 20) return '经脉隐隐作痛，有什么东西在里面横冲直撞。';
      return '还没开始，你的手指就已经在抖了。';
    },

    /** 第二步：心魔关选择完成后结算 */
    resolveBreakthrough(s, trialResult) {
      const opts = s.flags._btOpts || {};
      let rate = s.flags._btRate || 50;
      rate += trialResult.rateMod || 0;
      rate = Math.max(3, Math.min(96, rate));

      // 消耗丹药
      const deltas = [];
      if (opts.pill && s.resources.items[opts.pill] > 0) {
        deltas.push({ path: `resources.items.${opts.pill}`, op: 'add', value: -1, min: 0 });
      }
      deltas.push({ path: 'cultivation.breakthroughAttempts', op: 'add', value: 1 });

      let outcome;
      if (trialResult.tag === 'catastrophe') {
        outcome = 'deviation';
      } else {
        const roll = G.rng.int(1, 100);
        if (roll <= Math.floor(rate * 0.15)) outcome = 'great';
        else if (roll <= rate)               outcome = 'success';
        else if (roll >= 97 || s.cultivation.demonHeart >= 80) outcome = 'deviation';
        else                                 outcome = 'fail';
      }

      const c = s.cultivation;
      const result = { outcome, rate, realmBefore: G.State.realmName(c.realm, c.layer) };

      if (outcome === 'great' || outcome === 'success') {
        const next = this.nextRealm(c.realm, c.layer);
        deltas.push({ path: 'cultivation.realm', op: 'set', value: next.realm });
        deltas.push({ path: 'cultivation.layer', op: 'set', value: next.layer });
        deltas.push({ path: 'cultivation.exp', op: 'set', value: 0 });
        deltas.push({ path: 'cultivation.demonHeart', op: 'add', value: -8, clamp: [0, 100] });
        deltas.push({ path: 'reputation.value', op: 'add', value: next.realm !== c.realm ? 6 : 2, clamp: [0, 100] });
        if (outcome === 'great') {
          const attrKey = G.rng.pick(G.State.ATTR_SETS[s.player.role].keys);
          deltas.push({ path: `attrs.${attrKey}`, op: 'add', value: 1 });
          result.attrGained = attrKey;
        }
        result.realmAfter = G.State.realmName(next.realm, next.layer);
      } else if (outcome === 'fail') {
        const lost = Math.floor(c.expMax * (G.rng.int(10, 30) / 100));
        const rest = G.rng.int(1, 4);
        deltas.push({ path: 'cultivation.exp', op: 'add', value: -lost, min: 0 });
        deltas.push({ path: 'cultivation.resting', op: 'set', value: rest });
        deltas.push({ path: 'cultivation.demonHeart', op: 'add', value: 6, clamp: [0, 100] });
        result.expLost = lost; result.restWeeks = rest;
      } else { // deviation 走火入魔
        const lost = Math.floor(c.expMax * 0.4);
        deltas.push({ path: 'cultivation.exp', op: 'add', value: -lost, min: 0 });
        deltas.push({ path: 'cultivation.resting', op: 'set', value: G.rng.int(4, 8) });
        deltas.push({ path: 'cultivation.demonHeart', op: 'add', value: 22, clamp: [0, 100] });
        deltas.push({ path: 'cultivation.injuries', op: 'push',
                      value: { type: 'deviation', severity: 3, healTurnsLeft: 8 } });
        result.expLost = lost;
      }

      delete s.flags._btOpts; delete s.flags._btRate;
      G.State.commit(deltas, 'breakthrough:' + outcome);
      G.State.logLine(
        outcome === 'great' ? `突破大成功，晋入${result.realmAfter}` :
        outcome === 'success' ? `突破成功，晋入${result.realmAfter}` :
        outcome === 'fail' ? '突破失败，修为回退' : '走火入魔！',
        outcome === 'deviation' ? 'danger' : 'major'
      );
      return result;
    },

    nextRealm(realm, layer) {
      const list = G.State.REALMS;
      const i = list.findIndex(r => r.id === realm);
      const cur = list[i];
      if (layer < cur.layers) return { realm, layer: layer + 1 };
      const nx = list[Math.min(i + 1, list.length - 1)];
      return { realm: nx.id, layer: 1 };
    },

    // ---------- 每周维护 ----------
    weeklyTick(s) {
      const deltas = [];
      if (s.cultivation.resting > 0) {
        deltas.push({ path: 'cultivation.resting', op: 'add', value: -1, min: 0 });
      }
      const inj = s.cultivation.injuries;
      if (inj.length) {
        const left = inj.map(i => ({ ...i, healTurnsLeft: i.healTurnsLeft - 1 }))
                        .filter(i => i.healTurnsLeft > 0);
        deltas.push({ path: 'cultivation.injuries', op: 'set', value: left });
      }
      if (deltas.length) G.State.commit(deltas, 'cultivation.weekly');
    }
  };

  G.Cultivation = Cultivation;

})(window.G = window.G || {});

        { tag: 'doubt',    text: '这太顺了。是不是哪里不对',               rateMod: -6,  demon: +6 }
      ]
    }
  };

  const Demon = {
    SOURCES,

    /** 记录一个心魔来源 */
    add(s, type, weight, note, targetId) {
      const src = s.cultivation.demonSources.slice();
      const exist = src.find(x => x.type === type && x.targetId === targetId);
      if (exist) exist.weight += weight;
      else src.push({ type, weight, note: note || '', targetId: targetId || null });

      const talent = G.DATA.static.talents.find(t => t.id === s.player.talent);
      let gain = weight;
      if (talent?.mods?.demonGain) gain *= (1 + talent.mods.demonGain);
      for (const t of s.player.traits) {
        const tr = G.DATA.static.traits.find(x => x.id === t);
        if (tr?.mods?.demonGain) gain *= (1 + tr.mods.demonGain);
      }

      // 边际递减：心魔越重，再往上压得越慢。
      // 否则事件密度一上来，随便玩玩也能在两年内堆到 100，

        { path: 'cultivation.demonSources', op: 'set', value: src },

          ? { ...x, weight: Math.max(0, x.weight - amount) } : x)
        .filter(x => x.weight > 0);

        { path: 'cultivation.demonSources', op: 'set', value: src },
        { path: 'cultivation.demonHeart', op: 'add', value: -amount, clamp: [0, 100] }

      const src = s.cultivation.demonSources.filter(x => x.weight > 0);
      let type, note = '', targetId = null;

      if (!src.length || s.cultivation.demonHeart < 10) {
        type = 'clear';
      } else {
        const picked = G.rng.weighted(src, x => x.weight);
        type = SOURCES[picked.type] ? picked.type : 'guilt';
        note = picked.note;
        targetId = picked.targetId;
      }

      const tpl = SOURCES[type];
      const severity = s.cultivation.demonHeart >= 60 ? 'severe'
                     : s.cultivation.demonHeart >= 30 ? 'moderate' : 'mild';

      // 严重时选项收益打折、惩罚加重
      const choices = tpl.choices.map(c => ({
        ...c,
        rateMod: severity === 'severe' ? Math.round(c.rateMod * 0.7) : c.rateMod
      }));

      // 极高心魔且选了最差项 → 直接走火入魔
      if (severity === 'severe') {
        const worst = choices.reduce((a, b) => a.rateMod < b.rateMod ? a : b);
        worst.catastrophe = true;
      }

      return {
        type, label: tpl.label, core: tpl.core, note, targetId, severity,
        npc: targetId ? G.NPC.get(targetId) : null,
        choices
      };
    },

    /**
     * 与心魔对峙（对话式心魔关）的结算。
     * steady 是引擎从对话里累出来的"道心稳不稳"，-8..8。
     *  · 成功率修正夹在 ±8——比最好的选项（+12..15）小，对话是加分不是替代
     *  · 心魔本身随之升降，夹在 ±4
     *  · 稳到 5 以上，连"最险的那条路"都不会直接走火：这是对峙做得好的真正奖励
     */
    steadiness(s, trial, steady) {
      const v = Math.max(-8, Math.min(8, Math.round(Number(steady) || 0)));
      const rateMod = Math.max(-8, Math.min(8, Math.round(v * 1.2)));
      const demon = Math.max(-4, Math.min(4, -Math.round(v * 0.5)));
      if (demon) {
        G.State.commit([{ path: 'cultivation.demonHeart', op: 'add', value: demon, clamp: [0, 100] }],
                       'demon.steadiness');
      }
      const saves = v >= 5;
      if (saves && trial) for (const c of trial.choices) if (c.catastrophe) c.catastrophe = false;
      return { steady: v, rateMod, demon, saves };
    },

    /** 玩家在心魔关做出选择 */
    applyChoice(s, trial, choiceTag) {
      const c = trial.choices.find(x => x.tag === choiceTag) || trial.choices[0];
      const deltas = [{ path: 'cultivation.demonHeart', op: 'add', value: c.demon, clamp: [0, 100] }];
      if (c.demon < 0 && trial.type !== 'clear') {
        const src = s.cultivation.demonSources
          .map(x => x.type === trial.type ? { ...x, weight: Math.max(0, x.weight + c.demon / 2) } : x)
          .filter(x => x.weight > 0);
        deltas.push({ path: 'cultivation.demonSources', op: 'set', value: src });
      }
      G.State.commit(deltas, 'demon.choice:' + choiceTag);
      return { tag: c.tag, rateMod: c.rateMod, catastrophe: !!c.catastrophe };
    },

    /** 每月自然累积/消退 */
    monthlyTick(s) {
      const talent = G.DATA.static.talents.find(t => t.id === s.player.talent);
      let drift = s.cultivation.demonSources.length ? 1 : -2;
      if (talent?.id === 'clear_heart') drift -= 1;
      if (s.attrs.xin >= 8) drift -= 1;
      // 心魔很重的时候，人自己也会想办法喘气
      if (s.cultivation.demonHeart >= 75) drift -= 2;
      G.State.commit(
        [{ path: 'cultivation.demonHeart', op: 'add', value: drift, clamp: [0, 100] }],
        'demon.monthly'
      );
    },

    level(v) {
      if (v >= 80) return { name: '心魔缠身', tone: 'danger' };
      if (v >= 60) return { name: '躁动',     tone: 'warn' };
      if (v >= 30) return { name: '有隙',     tone: 'warn' };
      if (v >= 10) return { name: '平稳',     tone: 'ok' };
      return { name: '澄明', tone: 'ok' };
    }
  };

  G.Demon = Demon;

})(window.G = window.G || {});


/* ==== systems/relation.js ==== */
/* ===== systems/relation.js — 人际关系四维 =====
 * 好感 favor / 信任 trust / 敬畏 awe / 羁绊 bond
 * 阶段迁移是单向门 + strained 状态；只有背叛类事件能真正降级。
 */
(function (G) {
  'use strict';

  const STAGES = [
    { id: 'stranger',  name: '陌生',   need: { favor: -100 } },
    { id: 'acquainted',name: '相识',   need: { favor: 15 } },
    { id: 'friendly',  name: '好感',   need: { favor: 45 } },
    { id: 'friend',    name: '友人',   need: { favor: 60, trust: 40 } },
    { id: 'close',     name: '挚友',   need: { favor: 78, trust: 65, bond: 40 } },
    { id: 'confidant', name: '知己',   need: { favor: 88, trust: 80, bond: 60 } }
  ];

  const ROMANCE = [
    { id: 'ambiguous', name: '暧昧', need: { favor: 62, trust: 50, bond: 30 } },
    { id: 'heartfelt', name: '心动', need: { favor: 75, trust: 62, bond: 45 } },
    { id: 'together',  name: '相恋', need: { favor: 85, trust: 75, bond: 60 } },
    { id: 'daolv',     name: '道侣', need: { favor: 90, trust: 85, bond: 75 } }
  ];

  const HOSTILE = [
    { id: 'friction', name: '摩擦', at: -20 },
    { id: 'opposed',  name: '对立', at: -50 },
    { id: 'nemesis',  name: '死敌', at: -80 }
  ];

  // 标准行为 → 四维变化
  const ACTIONS = {
    gift_liked:      { favor: [8, 15], trust: [2, 5] },
    gift_neutral:    { favor: [3, 6] },
    gift_disliked:   { favor: [-6, -2] },
    help_in_need:    { favor: [10, 25], trust: [8, 15], bond: [5, 10] },
    defend_public:   { favor: [15, 15], trust: [10, 10], awe: [5, 5] },
    gossip_behind:   { favor: [-50, -20], trust: [-40, -20] },
    respect_dissent: { favor: [-5, -5], trust: [10, 10] },
    shared_death:    { favor: [30, 30], trust: [25, 25], bond: [40, 40] },
    break_promise:   { favor: [-25, -25], trust: [-30, -30] },
    defeat_them:     { awe: [8, 15], favor: [-3, 3] },
    lose_to_them:    { awe: [-2, 2], favor: [2, 6] },
    deep_talk:       { favor: [5, 10], trust: [8, 14], bond: [4, 8] },
    ignore_long:     { favor: [-3, -3] }
  };

  const Relation = {
    STAGES, ROMANCE, HOSTILE, ACTIONS,

    initAll(s) {
      for (const npc of G.DATA.npcs) {
        if (npc.appearMonth && !npc.appearMonth.includes(s.time.month)) {
          // 延后出场的 NPC 仍建档，只是不会被抽到
        }
        s.relations[npc.id] = {
          favor: npc.initial.favor, trust: npc.initial.trust,
          awe: npc.initial.awe, bond: npc.initial.bond,
          stage: 'stranger', romance: null, strained: false,
          flags: [], lastInteractTurn: 0, log: [],
          npcRealm: npc.realm, npcLayer: npc.layer, met: false
        };
      }
      for (const id in s.relations) this.refreshStage(s, id);
    },

    get(s, id) { return s.relations[id]; },

    /** 施加一次标准行为 */
    act(s, npcId, actionKey, scale) {
      const a = ACTIONS[actionKey];
      if (!a) return null;
      const deltas = [];
      const applied = {};
      for (const dim of ['favor', 'trust', 'awe', 'bond']) {
        if (!a[dim]) continue;
        const [lo, hi] = a[dim];
        let v = G.rng.int(lo, hi) * (scale || 1);
        v = this.applyModifiers(s, npcId, dim, v);
        if (!v) continue;
        applied[dim] = Math.round(v);
        deltas.push({
          path: `relations.${npcId}.${dim}`, op: 'add', value: Math.round(v),
          clamp: dim === 'favor' ? [-100, 100] : [0, 100]
        });
      }
      deltas.push({ path: `relations.${npcId}.lastInteractTurn`, op: 'set', value: s.time.absoluteTurn });
      deltas.push({ path: `relations.${npcId}.met`, op: 'set', value: true });
      G.State.commit(deltas, 'relation:' + actionKey);

      if (actionKey === 'gossip_behind' || actionKey === 'break_promise') {
        this.setStrained(s, npcId, true);
        G.Rumor.add(s, 'cruel', npcId);
        G.Demon.add(s, 'guilt', 3, `你对${G.NPC.name(npcId)}做过的事`, npcId);
      }
      return applied;
    },

    /** 直接调整（事件 outcome 用） */
    adjust(s, npcId, dims, note) {
      const deltas = [];
      for (const dim in dims) {
        const v = this.applyModifiers(s, npcId, dim, dims[dim]);
        if (!v) continue;
        deltas.push({
          path: `relations.${npcId}.${dim}`, op: 'add', value: Math.round(v),
          clamp: dim === 'favor' ? [-100, 100] : [0, 100]
        });
      }
      deltas.push({ path: `relations.${npcId}.lastInteractTurn`, op: 'set', value: s.time.absoluteTurn });
      deltas.push({ path: `relations.${npcId}.met`, op: 'set', value: true });
      if (note) {
        const r = s.relations[npcId];
        const log = (r.log || []).concat([{ turn: s.time.absoluteTurn, text: note }]).slice(-5);
        deltas.push({ path: `relations.${npcId}.log`, op: 'set', value: log });
      }
      G.State.commit(deltas, 'relation.adjust');
    },

    /** 性格与天赋对关系变化的修正 */
    applyModifiers(s, npcId, dim, v) {
      const npc = G.NPC.get(npcId);
      let m = 1;
      for (const t of s.player.traits) {
        const tr = G.DATA.static.traits.find(x => x.id === t);
        if (tr?.mods?.social) m += tr.mods.social;
        if (tr?.mods?.trust && dim === 'trust') m += tr.mods.trust;
      }
      const talent = G.DATA.static.talents.find(t => t.id === s.player.talent);
      if (talent?.mods?.social) m += talent.mods.social;
      if (talent?.mods?.beast && npc?.college === 'yuling' && dim === 'favor') m += 0.3;
      // 世故影响正向社交
      const shi = s.attrs.shi ?? 5;
      if (v > 0 && (dim === 'favor' || dim === 'trust')) m += (shi - 5) * 0.04;

      // 边际递减：交情越深，再进一步越难。这是为了让"挚友"和"知己"之间有真实的跨度。
      if (v > 0) {
        const cur = s.relations[npcId]?.[dim] ?? 0;
        const f = cur >= 88 ? 0.2 : cur >= 75 ? 0.4 : cur >= 60 ? 0.65 : cur >= 45 ? 0.85 : 1;
        m *= f;
      }
      return v * Math.max(0.15, m);
    },

    setStrained(s, npcId, on) {
      G.State.commit([{ path: `relations.${npcId}.strained`, op: 'set', value: !!on }], 'relation.strained');
    },

    /** 重算阶段。只升不降，除非 forceDown。 */
    refreshStage(s, npcId) {
      const r = s.relations[npcId];
      if (!r) return;
      const npc = G.NPC.get(npcId);

      // 敌对线独立计算
      if (r.favor <= -20) {
        const h = HOSTILE.slice().reverse().find(x => r.favor <= x.at);
        r.stage = h ? h.id : 'friction';
        r.romance = null;
        return;
      }

      let best = STAGES[0];
      for (const st of STAGES) {
        const n = st.need;
        if ((n.favor === undefined || r.favor >= n.favor) &&
            (n.trust === undefined || r.trust >= n.trust) &&
            (n.bond  === undefined || r.bond  >= n.bond)) best = st;
      }
      const curIdx = STAGES.findIndex(x => x.id === r.stage);
      const newIdx = STAGES.findIndex(x => x.id === best.id);
      if (newIdx > curIdx || curIdx === -1) r.stage = best.id;

      // 恋爱线：需 romanceable + 已推进过感情剧情标记
      if (npc?.romanceable && r.flags.includes('romance_open')) {
        let rb = null;
        for (const st of ROMANCE) {
          if (r.favor >= st.need.favor && r.trust >= st.need.trust && r.bond >= st.need.bond) rb = st;
        }
        if (rb) {
          const ci = ROMANCE.findIndex(x => x.id === r.romance);
          const ni = ROMANCE.findIndex(x => x.id === rb.id);
          if (ni > ci) r.romance = rb.id;
        }
      }
    },

    stageName(r) {
      if (r.romance) return ROMANCE.find(x => x.id === r.romance)?.name || '相识';
      const h = HOSTILE.find(x => x.id === r.stage);
      if (h) return h.name;
      return STAGES.find(x => x.id === r.stage)?.name || '陌生';
    },

    /** 关系达到阈值可解锁的内容层级 */
    unlockLevel(r) {
      if (r.favor >= 85 && r.bond >= 50) return 3;   // 深层秘密
      if (r.favor >= 70 && r.trust >= 60) return 2;  // 个人支线
      if (r.favor >= 50) return 1;                    // 私人对话与背景
      return 0;
    },

    // ---------- NPC 自主生活 ----------
    /** 每月：未在场 NPC 也在成长、也在变化 */
    npcTick(s) {
      const deltas = [];
      const news = [];
      for (const npc of G.DATA.npcs) {
        const r = s.relations[npc.id];
        if (!r) continue;

        // 长期忽视，好感自然衰减
        const idle = s.time.absoluteTurn - r.lastInteractTurn;
        if (idle > 21 && r.favor > 0) {
          deltas.push({ path: `relations.${npc.id}.favor`, op: 'add', value: -3, clamp: [-100, 100] });
        }

        // 修为自行推进
        const pace = npc.growth?.realmPerYear || 1;
        if (G.rng.chance(pace * 6)) {
          const nx = G.Cultivation.nextRealm(r.npcRealm, r.npcLayer);
          const capIdx = npc.track === 'student' ? 2 : 6;
          if (G.State.realmIndex(nx.realm) <= capIdx) {
            deltas.push({ path: `relations.${npc.id}.npcRealm`, op: 'set', value: nx.realm });
            deltas.push({ path: `relations.${npc.id}.npcLayer`, op: 'set', value: nx.layer });
            if (r.met) news.push(`${npc.name}已是${G.State.realmName(nx.realm, nx.layer)}。`);
          }
        }

        // strained 自然缓和
        if (r.strained && idle > 12 && G.rng.chance(30)) {
          deltas.push({ path: `relations.${npc.id}.strained`, op: 'set', value: false });
        }
      }
      if (deltas.length) G.State.commit(deltas, 'npcTick');
      return news;
    },

    /** 好感 60+ 的 NPC 进入主动事件池 */
    activeNpcs(s) {
      return G.DATA.npcs.filter(n => {
        const r = s.relations[n.id];
        return r && r.favor >= 60 && !r.strained;
      });
    },

    /** 吃醋检测：最近 4 周内玩家与他人好感增幅过大 */
    jealousyTarget(s) {
      const cands = G.DATA.npcs.filter(n => {
        const r = s.relations[n.id];
        return n.romanceable && r && r.favor >= 70 && r.romance;
      });
      if (!cands.length) return null;
      return G.rng.pick(cands);
    },

    /** 供 LLM prompt 使用的在场关系描述 */
    describe(s, npcId) {
      const r = s.relations[npcId];
      const npc = G.NPC.get(npcId);
      if (!r || !npc) return '';
      const recent = (r.log || []).slice(-2).map(x => x.text).join('；');
      return `${npc.name} · ${npc.title} · ${G.State.realmName(r.npcRealm, r.npcLayer)}\n` +

             `  与你：${this.stageName(r)}（好感${r.favor} 信任${r.trust} 敬畏${r.awe} 羁绊${r.bond}）` +
             (r.strained ? '【关系紧张】' : '') + '\n' +
             (recent ? `  近事：${recent}\n` : '') +
             `  说话方式：${npc.voice}`;
    }
  };

  G.Relation = Relation;

})(window.G = window.G || {});


/* ==== systems/event.js ==== */
/* ===== systems/event.js — 事件抽取与结算 =====
 * 事件是 JSON DSL 描述的纯数据。引擎负责条件筛选、加权抽取、判定、结算。
 * 变体机制：同一骨架挂多组 variants，抽中后再选一组，等效扩容 3-4 倍。
 */
(function (G) {
  'use strict';

  const EventSys = {

    pool() { return G.DATA.events; },

    // ---------- 条件求值 ----------
    match(s, ev, opt) {
      const c = ev.conditions || {};
      opt = opt || {};

      if (c.role && !c.role.includes(s.player.role)) return false;
      if (c.college && !c.college.includes(s.player.college)) return false;
      // 时间门槛统一用"周"表示 —— absoluteTurn 是时段数，一周 21 个，
      // 直接拿它当门槛会让本该在第 80 周出现的事件在第 6 周就跳出来。
      const week = Math.floor(s.time.absoluteTurn / 21);
      if (c.minWeek && week < c.minWeek) return false;
      if (c.maxWeek && week > c.maxWeek) return false;
      if (c.minTurn && s.time.absoluteTurn < c.minTurn) return false;
      if (c.maxTurn && s.time.absoluteTurn > c.maxTurn) return false;
      // 事件是周初一次抽完的，那时恒为清晨。时段要求改由 Game.beginWeek
      // 在安排插入位置时满足，抽取时不看。
      if (c.phase && !opt.anyPhase && !c.phase.includes(s.time.phase)) return false;
      if (c.month && !c.month.includes(s.time.month)) return false;
      if (c.year && !c.year.includes(s.academy.year)) return false;

      if (c.realm) {
        const i = G.State.realmIndex(s.cultivation.realm);
        if (c.realm.min !== undefined && i < G.State.realmIndex(c.realm.min)) return false;
        if (c.realm.max !== undefined && i > G.State.realmIndex(c.realm.max)) return false;
      }

      if (c.attrs) {
        for (const k in c.attrs) {
          const [lo, hi] = c.attrs[k];
          const v = s.attrs[k] ?? 0;
          if (v < lo || v > hi) return false;
        }
      }

      if (c.relations) {
        for (const id in c.relations) {
          const r = s.relations[id];
          if (!r) return false;
          for (const dim in c.relations[id]) {
            const [lo, hi] = c.relations[id][dim];
            const v = r[dim] ?? 0;
            if (v < lo || v > hi) return false;
          }
        }
      }

      if (c.demonHeart) {
        const [lo, hi] = c.demonHeart;
        if (s.cultivation.demonHeart < lo || s.cultivation.demonHeart > hi) return false;
      }

      if (c.reputation) {
        const [lo, hi] = c.reputation;
        if (s.reputation.value < lo || s.reputation.value > hi) return false;
      }

      if (c.flags)    for (const f of c.flags)    if (!s.flags[f]) return false;
      if (c.notFlags) for (const f of c.notFlags) if (s.flags[f])  return false;

      if (c.storyline) {
        for (const k in c.storyline) {
          const sl = s.storylines[k];
          const need = c.storyline[k];
          if (!sl) return false;
          if (need.unlocked !== undefined && sl.unlocked !== need.unlocked) return false;
          if (need.minProgress !== undefined && sl.progress < need.minProgress) return false;
        }
      }

      // 涉及的 NPC 必须当前可出场
      for (const id of (ev.actors || [])) if (!G.NPC.available(s, id)) return false;

      // 动态主角（感情线）：没有合适的人就不触发
      if (ev.dynamicActor && !(opt.actor && G.NPC.available(s, opt.actor)) &&
          !this.resolveDynamicActor(s, ev.dynamicActor)) return false;

      // 冷却
      const cd = s.events.cooldowns[ev.id];
      if (cd && s.time.absoluteTurn < cd) return false;

      // 同一 NPC 三周内不重复（一周 21 个时段）。事件链的下一章不受这条限制，
      // 否则间隔一两周的续章总要多等。
      if (!opt.chain) for (const id of (ev.actors || [])) {
        const last = s.flags['_npcEvt_' + id] || -9999;
        if (s.time.absoluteTurn - last < 3 * 21) return false;
      }

      return true;
    },

    weightOf(s, ev) {
      let w = ev.weight || 20;
      if (s.events.seen.includes(ev.id)) w *= 0.15;
      // 与玩家关系越近的 NPC，其事件越容易出现
      for (const id of (ev.actors || [])) {
        const r = s.relations[id];
        if (r) w *= 1 + Math.max(0, r.favor) / 120;
      }
      // 所属学院相关事件加权
      if (ev.conditions?.college?.includes(s.player.college)) w *= 1.4;
      return w;
    },

    /** 抽取本周事件（1-3 个） */
    drawWeekly(s) {
      const out = [];

      // 1. 固定事件优先
      // 固定事件也要过身份、周数等条件（冷却和 NPC 间隔除外）；
      // 不满足的今年就跳过，别把学生的开学典礼塞给院主。
      const fixed = G.Time.pendingFixedEvent(s);
      if (fixed) {
        const ev = this.pool().find(e => e.id === fixed.id);
        G.Time.markFixedDone(s, fixed.key);
        if (ev && this.match(s, { ...ev, actors: [] }, { anyPhase: true, chain: true })) {
          out.push(this.instantiate(s, ev));
        }
      }

      // 2. 事件链续接。续章迟迟对不上条件（人不在、身份变了）就作废，
      // 不能一直挂在「当下要紧」里。
      const CHAIN_EXPIRE = 12 * 21;
      for (const chain of s.events.activeChains.slice()) {
        if (s.time.absoluteTurn < chain.dueTurn) continue;
        const ev = this.pool().find(e => e.id === chain.eventId);
        const drop = () => { s.events.activeChains = s.events.activeChains.filter(x => x !== chain); };
        if (!ev) { drop(); continue; }
        if (this.match(s, ev, { anyPhase: true, chain: true, actor: chain.actor })) {
          out.push(this.instantiate(s, ev, { actor: chain.actor }));
          drop();
        } else if (s.time.absoluteTurn > chain.dueTurn + CHAIN_EXPIRE) {
          drop();
        }
      }

      // 3. 随机池
      const n = Math.max(0, G.rng.int(1, 3) - out.length);
      if (n > 0) {
        const cands = this.pool().filter(e => !e.fixed && !e.chainOnly && this.match(s, e, { anyPhase: true }));
        const picked = G.rng.sample(cands, n, e => this.weightOf(s, e));
        for (const e of picked) out.push(this.instantiate(s, e));
      }

      return out;
    },

    /**
     * 动态主角：把"当前关系最深的可攻略对象"解析成具体 NPC。
     * 这让一套感情事件能服务八条线，而不必为每个人各写一份。
     */
    resolveDynamicActor(s, kind) {
      let pool = G.NPC.romanceable().filter(n => G.NPC.available(s, n.id));

      if (kind === 'romance_top') {
        pool = pool.filter(n => {
          const r = s.relations[n.id];
          return r && r.favor >= 55 && r.trust >= 40 && !r.strained;
        });
      } else if (kind === 'partner') {
        // 优先取已进入恋爱阶段的；专属感情链走完但阶段还没跳上去时，
        // 用 in_relationship + 高好感兜底，否则整条道侣线会永远触发不了
        const inRomance = pool.filter(n => s.relations[n.id]?.romance);
        pool = inRomance.length ? inRomance
          : (s.flags.in_relationship
              ? pool.filter(n => (s.relations[n.id]?.favor || 0) >= 60)
              : []);
      } else if (kind === 'closest') {
        pool = pool.filter(n => (s.relations[n.id]?.favor || 0) >= 40);
      }

      if (!pool.length) return null;
      pool.sort((a, b) => {
        const ra = s.relations[a.id], rb = s.relations[b.id];
        return (rb.favor + rb.bond * 0.6) - (ra.favor + ra.bond * 0.6);
      });
      return pool[0].id;
    },

    /** 把事件模板实例化（选变体、绑定 NPC、算出选项的模糊提示） */
    instantiate(s, ev, opt) {
      const inst = JSON.parse(JSON.stringify(ev));
      if (inst.variants && inst.variants.length) {
        const v = G.rng.pick(inst.variants);
        Object.assign(inst, v);
        delete inst.variants;
      }
      inst.actors = inst.actors || [];

      if (inst.dynamicActor) {
        const id = (opt?.actor && G.NPC.available(s, opt.actor))
          ? opt.actor : this.resolveDynamicActor(s, inst.dynamicActor);
        if (id && !inst.actors.includes(id)) inst.actors.unshift(id);
        inst._dynamic = id;
        // 把文本里的占位换成具体名字。effect 的 note 也要换——
        // 它会进关系日志和心魔来源，漏了就会在面板上看到生的 {{TA}}
        const name = G.NPC.name(id);
        const swap = t => typeof t === 'string' ? t.replace(/\{\{TA\}\}/g, name) : t;
        inst.seed = swap(inst.seed);
        inst.facts = (inst.facts || []).map(swap);
        for (const o of inst.options || []) {
          o.text = swap(o.text);
          for (const k in (o.outcomes || {})) {
            const oc = o.outcomes[k];
            oc.narrative = swap(oc.narrative);
            oc.text = swap(oc.text);
            for (const eff of (oc.effects || [])) if (eff.note) eff.note = swap(eff.note);
          }
        }
      }

      inst._actorNames = inst.actors.map(id => G.NPC.name(id));

      // 动态 reason 修正
      for (const o of inst.options || []) {
        if (o.reasonIf) {
          for (const cond of o.reasonIf) {
            if (cond.flag && s.flags[cond.flag]) o.reason = (o.reason || 0) + cond.value;
            if (cond.notFlag && !s.flags[cond.notFlag]) o.reason = (o.reason || 0) + cond.value;
            if (cond.attr) {
              const v = s.attrs[cond.attr.key] ?? 0;
              if (v >= cond.attr.min) o.reason = (o.reason || 0) + cond.value;
            }
          }
        }
        if (o.check) o._hint = G.Check.vagueHint({ ...o.check, reason: o.reason });
      }
      // 永远保留自定义行动
      if (!inst.options.some(o => o.custom)) {
        inst.options.push({ id: 'E', text: '【自定义行动】', custom: true });
      }
      return inst;
    },

    /** 玩家选择某个选项 → 判定 → 结算 */
    resolve(s, ev, optionId, customIntent, extraMods) {
      const opt = ev.options.find(o => o.id === optionId);
      if (!opt) return null;

      let grade = 'plain', checkInfo = null;
      // 对话场带来的修正：聊得好坏顶得上一档半，但绝不越过 ±12
      const extra = Array.isArray(extraMods) ? extraMods.map(x => Math.max(-12, Math.min(12, Number(x) || 0))) : [];

      if (opt.custom && customIntent) {
        checkInfo = G.Check.roll({
          attrKey: customIntent.check?.attr || null,
          difficulty: customIntent.check?.difficulty ?? 50,
          reason: customIntent.reason ?? 0,
          modifiers: this.contextModifiers(s, ev).concat(extra)
        });
        grade = checkInfo.grade;
      } else if (opt.check) {
        checkInfo = G.Check.roll({
          attrKey: opt.check.attr,
          difficulty: opt.check.difficulty,
          reason: opt.reason || 0,
          modifiers: this.contextModifiers(s, ev).concat(extra)
        });
        grade = checkInfo.grade;
      } else if (opt.fixedGrade) {
        grade = opt.fixedGrade;
      }

      const outcome = this.pickOutcome(opt, grade);
      const applied = this.applyOutcome(s, ev, outcome, grade);
      G.Rumor.fromEvent(s, ev, opt, grade, outcome, applied);

      // 记录。cooldown 写的是**周**，存的是时段——跟 minWeek 一个道理，
      // 直接当时段用的话 cooldown:40 只隔两周就又跳出来了。
      const cd = (ev.cooldown ?? 30) * 21;
      s.events.cooldowns[ev.id] = s.time.absoluteTurn + cd;
      if (!s.events.seen.includes(ev.id)) s.events.seen.push(ev.id);
      for (const id of ev.actors) s.flags['_npcEvt_' + id] = s.time.absoluteTurn;

      // 事件链
      // chainNext 可以是一个或多个；options 限定只有选了哪些选项才接续
      const nexts = Array.isArray(ev.chainNext) ? ev.chainNext : (ev.chainNext ? [ev.chainNext] : []);
      for (const cn of nexts) {
        if (!(cn.on || []).includes(grade)) continue;
        if (cn.options && !cn.options.includes(optionId)) continue;
        s.events.activeChains.push({
          chainId: ev.chainId || ev.id,
          eventId: cn.eventId,
          actor: ev._dynamic || null,
          dueTurn: s.time.absoluteTurn + (cn.delayWeeks || 1) * 21
        });
      }

      G.State.commit([], 'event.resolve');   // 触发一次 recalc + autosave

      return {
        event: ev, option: opt, grade, check: checkInfo,
        outcome, applied,
        facts: this.buildFacts(s, ev, opt, grade, outcome, applied, customIntent)
      };
    },

    /** 关系/状态带来的判定修正 */
    contextModifiers(s, ev) {
      const mods = [];
      for (const id of (ev.actors || [])) {
        const r = s.relations[id];
        if (!r) continue;
        mods.push(r.favor * 0.12);
        if (r.strained) mods.push(-8);
      }
      if (s.cultivation.resting > 0) mods.push(-10);
      if (s.cultivation.injuries.length) mods.push(-5 * s.cultivation.injuries.length);
      if (s.cultivation.demonHeart >= 60) mods.push(-6);
      return mods;
    },

    pickOutcome(opt, grade) {
      const oc = opt.outcomes || {};
      return oc[grade] || oc.fixed || oc.default || { effects: [], text: '' };
    },

    /** 把 outcome 的 effects 转成 deltas 并 commit */
    applyOutcome(s, ev, outcome, grade) {
      const mult = G.Check.GRADE_MULT[grade] ?? 1;
      const deltas = [];
      const summary = [];

      for (const eff of (outcome.effects || [])) {
        switch (eff.type) {

          case 'exp': {
            const v = Math.round(eff.value * (eff.noScale ? 1 : Math.abs(mult)) * (mult < 0 ? -1 : 1));
            deltas.push({ path: 'cultivation.exp', op: 'add', value: v, min: 0 });
            if (v) summary.push(`修为${v > 0 ? '+' : ''}${v}`);
            break;
          }
          case 'attr': {
            deltas.push({ path: `attrs.${eff.key}`, op: 'add', value: eff.value });
            summary.push(`${G.State.ATTR_LABEL[eff.key]}${eff.value > 0 ? '+' : ''}${eff.value}`);
            break;
          }
          case 'stone': {
            const v = Math.round(eff.value * (eff.noScale ? 1 : Math.max(0.3, mult)));
            deltas.push({ path: `resources.stone.${eff.grade || 'low'}`, op: 'add', value: v, min: 0 });
            if (v) summary.push(`灵石${v > 0 ? '+' : ''}${v}`);
            break;
          }
          case 'contribution': {
            const v = Math.round(eff.value * (eff.noScale ? 1 : Math.max(0.3, mult)));
            deltas.push({ path: 'resources.contribution', op: 'add', value: v, min: 0 });
            if (v) summary.push(`贡献点${v > 0 ? '+' : ''}${v}`);
            break;
          }
          case 'item': {
            deltas.push({ path: `resources.items.${eff.id}`, op: 'add', value: eff.value || 1, min: 0 });
            const it = G.DATA.static.items.find(i => i.id === eff.id);
            summary.push(`${it ? it.name : eff.id} ×${eff.value || 1}`);
            break;
          }
          case 'technique': {
            deltas.push({ path: 'resources.techniques', op: 'push', value: eff.id, unique: true });
            summary.push('获得功法');
            break;
          }
          case 'relation': {
            const target = eff.npc || (ev.actors || [])[0];
            if (!target) break;
            for (const dim of ['favor', 'trust', 'awe', 'bond']) {
              if (eff[dim] === undefined) continue;
              // 走 applyModifiers，性格/天赋修正与边际递减才会生效
              const raw = eff[dim] * (eff.noScale ? 1 : (mult > 0 ? mult : 1));
              const v = Math.round(G.Relation.applyModifiers(s, target, dim, raw));
              deltas.push({
                path: `relations.${target}.${dim}`, op: 'add', value: v,
                clamp: dim === 'favor' ? [-100, 100] : [0, 100]
              });
              if (v) summary.push(`${G.NPC.name(target)}${({favor:'好感',trust:'信任',awe:'敬畏',bond:'羁绊'})[dim]}${v > 0 ? '+' : ''}${v}`);
            }
            deltas.push({ path: `relations.${target}.met`, op: 'set', value: true });
            deltas.push({ path: `relations.${target}.lastInteractTurn`, op: 'set', value: s.time.absoluteTurn });
            if (eff.note) {
              const r = s.relations[target];
              const log = (r.log || []).concat([{ turn: s.time.absoluteTurn, text: eff.note }]).slice(-5);
              deltas.push({ path: `relations.${target}.log`, op: 'set', value: log });
            }
            if (eff.openRomance) {
              deltas.push({ path: `relations.${target}.flags`, op: 'push', value: 'romance_open', unique: true });
            }
            break;
          }
          case 'reputation': {
            let v = eff.value * (eff.noScale ? 1 : (mult > 0 ? mult : 1));
            v = Math.round(G.Reputation.scale(s, v));
            deltas.push({ path: 'reputation.value', op: 'add', value: v, clamp: [0, 100] });
            if (v) summary.push(`声望${v > 0 ? '+' : ''}${v}`);
            break;
          }
          case 'faction': {
            deltas.push({ path: `reputation.factions.${eff.key}`, op: 'add', value: eff.value, clamp: [-100, 100] });
            summary.push(`${G.DATA.static.factionLabel[eff.key]}倾向${eff.value > 0 ? '+' : ''}${eff.value}`);
            break;
          }
          case 'demon': {
            if (eff.value > 0) G.Demon.add(s, eff.source || 'guilt', eff.value, eff.note, eff.npc);
            else G.Demon.resolve(s, eff.source || 'guilt', -eff.value, eff.npc);
            summary.push(`心魔${eff.value > 0 ? '+' : ''}${eff.value}`);
            break;
          }
          case 'conduct': {
            deltas.push({ path: 'academy.conduct', op: 'add', value: eff.value });
            summary.push(`品行${eff.value > 0 ? '+' : ''}${eff.value}`);
            break;
          }
          case 'injury': {
            deltas.push({ path: 'cultivation.injuries', op: 'push',
                          value: { type: eff.key || 'wound', severity: eff.value || 1, healTurnsLeft: eff.weeks || 2 } });
            summary.push('受伤');
            break;
          }
          case 'flag': {
            // op:add 用于计数型 flag（暗线解锁条件之类），set 会把别处攒下的数冲掉
            if (eff.op === 'add') deltas.push({ path: `flags.${eff.key}`, op: 'add', value: eff.value ?? 1 });
            else deltas.push({ path: `flags.${eff.key}`, op: 'set', value: eff.value === undefined ? true : eff.value });
            break;
          }
          case 'storyline': {
            deltas.push({ path: `storylines.${eff.key}.progress`, op: 'add', value: eff.value, clamp: [0, 100] });
            if (eff.clue) deltas.push({ path: `storylines.${eff.key}.clues`, op: 'push', value: eff.clue, unique: true });
            summary.push('线索');
            break;
          }
          case 'rest': {
            deltas.push({ path: 'cultivation.resting', op: 'add', value: eff.value });
            summary.push(`需休养${eff.value}周`);
            break;
          }

          // ---- 教习专属：让事件能真正碰到弟子，而不是只改玩家自己的数值 ----
          case 'disciple': {
            if (s.player.role !== 'teacher' || !s.faculty) break;
            const pool = s.faculty.disciples.filter(d => !d.graduated && !d.broken);
            if (!pool.length) break;
            let d;
            switch (eff.pick) {
              case 'stressed': d = pool.slice().sort((a, b) => b.pressure - a.pressure)[0]; break;
              case 'weakest':  d = pool.slice().sort((a, b) => (a.exp + G.State.realmIndex(a.realm) * 9000) - (b.exp + G.State.realmIndex(b.realm) * 9000))[0]; break;
              case 'best':     d = pool.slice().sort((a, b) => (b.exp + G.State.realmIndex(b.realm) * 9000) - (a.exp + G.State.realmIndex(a.realm) * 9000))[0]; break;
              case 'closest':  d = pool.slice().sort((a, b) => b.affinity - a.affinity)[0]; break;
              default:         d = G.rng.pick(pool);
            }
            const scale = eff.noScale ? 1 : (mult > 0 ? mult : 1);
            const next = s.faculty.disciples.map(x => x.id !== d.id ? x : {
              ...x,
              exp: Math.max(0, x.exp + Math.round((eff.exp || 0) * scale)),
              affinity: Math.max(0, Math.min(100, x.affinity + Math.round((eff.affinity || 0) * scale))),
              pressure: Math.max(0, Math.min(100, x.pressure + Math.round((eff.pressure || 0) * (eff.pressure > 0 ? 1 : scale)))),
              broken: eff.broken ? true : x.broken,
              lastTutor: eff.counts ? s.time.absoluteTurn : x.lastTutor
            });
            deltas.push({ path: 'faculty.disciples', op: 'set', value: next });
            if (eff.broken) {
              deltas.push({ path: 'flags.disciple_accident', op: 'set', value: G.Faculty.accidentCount(s) + 1 });
              summary.push(`${d.name}离开了你的门下`);
            } else {
              const bits = [];
              if (eff.exp) bits.push(`修为${eff.exp > 0 ? '+' : ''}${Math.round(eff.exp * scale)}`);
              if (eff.affinity) bits.push(`亲近${eff.affinity > 0 ? '+' : ''}${eff.affinity}`);
              if (eff.pressure) bits.push(`压力${eff.pressure > 0 ? '+' : ''}${eff.pressure}`);
              if (bits.length) summary.push(`${d.name} ${bits.join(' ')}`);
            }
            break;
          }

          case 'faculty': {
            if (s.player.role !== 'teacher' || !s.faculty) break;
            for (const k of ['prepared', 'papers', 'duties']) {
              if (eff[k] === undefined) continue;
              deltas.push({ path: `faculty.${k}`, op: 'add', value: eff[k],
                            clamp: k === 'prepared' ? [0, 5] : undefined, min: 0 });
              summary.push(`${({ prepared: '教案', papers: '著述', duties: '院务' })[k]}${eff[k] > 0 ? '+' : ''}${eff[k]}`);
            }
            break;
          }

          // ---- 院主专属 ----
          case 'gov': {
            if (s.player.role !== 'headmaster' || !s.gov) break;
            if (eff.budget) {
              deltas.push({ path: 'gov.budget', op: 'add', value: eff.budget, min: 0 });
              summary.push(`学院预算${eff.budget > 0 ? '+' : ''}${eff.budget}`);
            }
            if (eff.privy) {
              deltas.push({ path: 'gov.privy', op: 'add', value: eff.privy, min: 0 });
              summary.push(`私库${eff.privy > 0 ? '+' : ''}${eff.privy}`);
            }
            if (eff.threatProgress) {
              deltas.push({ path: 'gov.threatProgress', op: 'add', value: eff.threatProgress, clamp: [0, 100] });
              summary.push(`外患化解${eff.threatProgress > 0 ? '+' : ''}${eff.threatProgress}`);
            }
            if (eff.unrest !== undefined || eff.unrestAll !== undefined) {
              G.Governance.addUnrest(s, eff.unrest || {}, eff.unrestAll || 0);
              const v = eff.unrestAll || 0;
              if (v) summary.push(`七院人心${v > 0 ? '恶化' : '缓和'}${Math.abs(v)}`);
            }
            break;
          }
        }
      }

      if (deltas.length) G.State.commit(deltas, 'event.effects');
      return summary;
    },

    /** 生成交给叙事层的"确凿事实"列表 */
    buildFacts(s, ev, opt, grade, outcome, applied, customIntent) {
      const facts = (ev.facts || []).slice();
      facts.push(`你选择了：${opt.custom ? (customIntent?.summary || '自定义行动') : opt.text}`);
      facts.push(`判定结果：${G.Check.GRADE_LABEL[grade]}`);
      if (outcome.text) facts.push(outcome.text);
      if (applied.length) facts.push(`数值变化：${applied.join('，')}`);
      return facts;
    }
  };

  G.Event = EventSys;

})(window.G = window.G || {});


/* ==== systems/academy.js ==== */
/* ===== systems/academy.js — 课程 · 考核 · 排名 · 贡献点 =====
 * 全院 300 人排名用正态分布模拟，只有核心 NPC 单独维护并强制插入。
 */
(function (G) {
  'use strict';

  const Academy = {

    TOTAL: 300,

    initCourses(s) {
      if (s.player.role !== 'student') return;
      const D = G.DATA.static.courses;
      s.academy.courses.required = D.required.map(c => c.id);
      // 默认选修：本院两门
      const mine = D.elective.filter(e => e.college === s.player.college).map(e => e.id);
      const others = D.elective.filter(e => e.college !== s.player.college).map(e => e.id);
      s.academy.courses.elective = mine.concat(others).slice(0, 2);
    },

    courseById(id) {
      const D = G.DATA.static.courses;
      return D.required.find(c => c.id === id) || D.elective.find(c => c.id === id) || null;
    },

    availableElectives(s) {
      return G.DATA.static.courses.elective.filter(e => {
        if (!e.req) return true;
        if (e.req.attr) return (s.attrs[e.req.attr] ?? 0) >= e.req.min;
        return true;
      });
    },

    setElectives(s, ids) {
      G.State.commit([{ path: 'academy.courses.elective', op: 'set', value: ids.slice(0, 3) }], 'academy.electives');
    },

    /** 上一节课的收益 */
    attendClass(s, courseId) {
      const c = this.courseById(courseId);
      if (!c) return null;
      const attrKey = c.attr;
      const r = G.Check.roll({ attrKey, difficulty: 40, reason: 0, modifiers: [] });
      const mult = Math.max(0.3, G.Check.GRADE_MULT[r.grade]);
      const exp = Math.round(c.expBonus * mult * G.Cultivation.rootCoef(s));
      const contrib = r.grade === 'perfect' ? 3 : r.grade === 'good' ? 2 : 1;

      const deltas = [
        { path: 'cultivation.exp', op: 'add', value: exp, min: 0 },
        { path: 'resources.contribution', op: 'add', value: contrib, min: 0 },
        { path: `flags.study_${courseId}`, op: 'add', value: 1 }
      ];
      if (c.cost) deltas.push({ path: 'resources.stone.low', op: 'add', value: -c.cost, min: 0 });

      // 学满 20 次同类课程，属性 +1
      const cnt = (s.flags['study_' + courseId] || 0) + 1;
      if (cnt % 20 === 0) deltas.push({ path: `attrs.${attrKey}`, op: 'add', value: 1 });

      G.State.commit(deltas, 'academy.class');
      return { course: c, grade: r.grade, exp, contrib, attrUp: cnt % 20 === 0 ? attrKey : null };
    },

    /** 缺课 */
    missClass(s) {
      G.State.commit([
        { path: 'academy.attendance.missed', op: 'add', value: 1 },
        { path: 'resources.contribution', op: 'add', value: -5, min: 0 },
        { path: 'academy.conduct', op: 'add', value: -2 }
      ], 'academy.miss');
    },

    // ---------- 考核 ----------
    /** 玩家综合分 0-100 */
    scoreOf(s) {
      const c = s.cultivation;
      const realmScore = (G.State.realmIndex(c.realm) * 9 + c.layer) * 2.2;      // 修为进境 30%
      const skillAttr = ((s.attrs.gen ?? 0) + (s.attrs.shen ?? 0)) / 2;
      const skill = G.Check.normalize(skillAttr) * 0.25;                          // 术法掌握 25%
      const studyCnt = Object.keys(s.flags).filter(k => k.startsWith('study_'))
        .reduce((a, k) => a + s.flags[k], 0);
      const study = Math.min(20, studyCnt * 0.25);                                // 课业完成 20%
      const contrib = Math.min(15, s.resources.contribution / 200);               // 贡献点 15%
      const conduct = Math.max(0, Math.min(10, 8 + s.academy.conduct * 0.5));     // 品行 10%
      return Math.max(0, Math.min(100,
        Math.min(30, realmScore) + skill + study + contrib + conduct));
    },

    /** 分数 → 名次。用正态分布，均值随学年上移。 */
    rankOf(s, score) {
      const yearShift = (s.academy.year - 1) * 4;
      // 三百人不是静止的靶子——他们也在进步。sd 放宽，避免玩家一到筑基就霸榜。
      const mean = 42 + yearShift, sd = 18;
      const z = (score - mean) / sd;
      const pct = 1 - this._normCdf(z);                    // 高于你的比例
      let rank = Math.max(1, Math.round(pct * this.TOTAL));

      // 核心 NPC 强制占位
      const rivals = G.NPC.classmates(s);
      for (const n of rivals) {
        const r = s.relations[n.id];
        const npcScore = this._npcScore(s, n, r);
        if (npcScore > score && rank <= this._npcRank(n)) rank++;
      }
      return Math.max(1, Math.min(this.TOTAL, rank));
    },

    _npcRank(n) { return ({ npc_shenjinglan: 1, npc_qinjiusi: 6, npc_zhaomingqi: 40, npc_yesusu: 55, npc_wenjiujiu: 88 })[n.id] || 150; },

    _npcScore(s, n, r) {
      const base = (G.State.realmIndex(r.npcRealm) * 9 + r.npcLayer) * 2.2;
      return Math.min(30, base) + ({ npc_shenjinglan: 55, npc_qinjiusi: 48, npc_zhaomingqi: 32, npc_yesusu: 30, npc_wenjiujiu: 24 })[n.id] || 20;
    },

    _normCdf(z) {
      const t = 1 / (1 + 0.2316419 * Math.abs(z));
      const d = 0.3989423 * Math.exp(-z * z / 2);
      let p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
      return z > 0 ? 1 - p : p;
    },

    /** 月考 / 期末考 */
    exam(s, kind) {
      const score = this.scoreOf(s);
      const rank = this.rankOf(s, score);
      const deltas = [];
      const rewards = [];

      let contrib = 0, rep = 0;
      if (rank <= 10)       { contrib = 100; rep = 6; rewards.push('藏经阁高层通行令'); }
      else if (rank <= 30)  { contrib = 50;  rep = 3; rewards.push('精品丹药一份'); }
      else if (rank <= 100) { contrib = 20;  rep = 1; }
      else if (rank > this.TOTAL - 30) {
        deltas.push({ path: 'academy.warnings', op: 'add', value: 1 });
        rep = -2;
        rewards.push('末位警告');
        G.Demon.add(s, 'inferior', 4, '院试垫底', null);
      }

      if (contrib) deltas.push({ path: 'resources.contribution', op: 'add', value: contrib });
      if (rep) deltas.push({ path: 'reputation.value', op: 'add', value: rep, clamp: [0, 100] });
      if (rank <= 10) deltas.push({ path: 'flags.library_pass', op: 'set', value: true });
      if (rank <= 30) deltas.push({ path: 'resources.items.ningqi_dan', op: 'add', value: 3 });

      const record = { term: s.academy.term, year: s.academy.year, kind, rank, score: Math.round(score), total: this.TOTAL };
      deltas.push({ path: 'academy.grades', op: 'push', value: record, maxLen: 30 });

      G.State.commit(deltas, 'academy.exam');
      G.State.logLine(`${kind === 'final' ? '期末大考' : '月考'}：第 ${rank} 名 / ${this.TOTAL}`, 'major');

      // 连续两次末位 → 劝退预警；预警期间再垫底一次就真的劝退，考好了就撤销。
      // 早期版本只挂预警不处理，之后每个月都提示一遍「面临劝退」。
      const bottom = rank > this.TOTAL - 30;
      if (s.flags.expelled_pending === 'exam') {
        if (bottom) {
          G.State.commit([{ path: 'flags.expelled', op: 'set', value: true }], 'academy.expel');
          G.State.logLine('执事堂的劝退文书送到了你手上', 'danger');
        } else {
          delete s.flags.expelled_pending;
          G.State.logLine('这次没垫底，执事堂撤了劝退预警', 'major');
        }
      } else if (!s.flags.expelled_pending) {
        const g = s.academy.grades.slice(-2);
        if (g.length === 2 && g.every(x => x.rank > this.TOTAL - 30) && s.academy.warnings >= 2) {
          s.flags.expelled_pending = 'exam';
        }
      }

      return { rank, score: Math.round(score), rewards, record };
    },

    lastRank(s) {
      const g = s.academy.grades;
      return g.length ? g[g.length - 1].rank : null;
    },

    /** 学年推进 */
    advanceYear(s) {
      G.State.commit([
        { path: 'academy.year', op: 'add', value: 1 },
        { path: 'academy.term', op: 'set', value: 1 }
      ], 'academy.year');
    },

    /** 毕业条件 */
    canGraduate(s) {
      return s.academy.year >= 5 &&
             G.State.realmIndex(s.cultivation.realm) >= G.State.realmIndex('jindan');
    }
  };

  G.Academy = Academy;

})(window.G = window.G || {});

/* ===== systems/economy.js — 货币 · 收入 · 支出 · 坊市 ===== */
(function (G) {
  'use strict';

  const RATE = { low: 1, mid: 100, high: 10000, supreme: 1000000 };

  const Economy = {
    RATE,

    /** 折算为下品灵石总额 */
    totalLow(s) {
      const st = s.resources.stone;
      return st.low + st.mid * RATE.mid + st.high * RATE.high + st.supreme * RATE.supreme;
    },

    format(s) {
      const st = s.resources.stone;
      const parts = [];
      if (st.supreme) parts.push(`极品${st.supreme}`);
      if (st.high) parts.push(`上品${st.high}`);
      if (st.mid) parts.push(`中品${st.mid}`);
      parts.push(`下品${st.low}`);
      return parts.join(' · ');
    },

    canAfford(s, lowAmount) { return this.totalLow(s) >= lowAmount; },

    /** 支付，自动破开高阶灵石 */
    pay(s, lowAmount) {
      if (!this.canAfford(s, lowAmount)) return false;
      let need = lowAmount;
      const st = { ...s.resources.stone };

      const use = Math.min(st.low, need);
      st.low -= use; need -= use;

      for (const [k, v] of [['mid', RATE.mid], ['high', RATE.high], ['supreme', RATE.supreme]]) {
        while (need > 0 && st[k] > 0) {
          st[k] -= 1;
          st.low += v;
          const u = Math.min(st.low, need);
          st.low -= u; need -= u;
        }
      }
      G.State.commit([{ path: 'resources.stone', op: 'set', value: st }], 'economy.pay');
      return true;
    },

    earn(s, lowAmount) {
      G.State.commit([{ path: 'resources.stone.low', op: 'add', value: lowAmount, min: 0 }], 'economy.earn');
    },

    /** 每月固定收支 */
    monthlyTick(s) {
      const deltas = [];
      const lines = [];

      if (s.player.role === 'student') {
        deltas.push({ path: 'resources.stone.low', op: 'add', value: 50 });
        lines.push('学院月例 +50');
        const origin = G.DATA.static.origins.find(o => o.id === s.player.origin);
        if (origin?.monthly) {
          const v = origin.monthly + G.rng.int(-30, 60);
          deltas.push({ path: 'resources.stone.low', op: 'add', value: v });
          lines.push(`家族支援 +${v}`);
        }
      } else if (s.player.role === 'teacher') {
        deltas.push({ path: 'resources.stone.low', op: 'add', value: 500 });
        lines.push('月俸 +500');
      } else {
        const budget = 3000 + s.reputation.value * 20;
        deltas.push({ path: 'flags.academyBudget', op: 'add', value: budget });
        lines.push(`学院年度预算入账 +${budget}（非私产）`);
      }

      // 支出：修炼室、消耗、天赋副作用
      const talent = G.DATA.static.talents.find(t => t.id === s.player.talent);
      let upkeep = 20 + G.State.realmIndex(s.cultivation.realm) * 15;
      if (talent?.mods?.upkeep) upkeep = Math.round(upkeep * (1 + talent.mods.upkeep));
      deltas.push({ path: 'resources.stone.low', op: 'add', value: -upkeep, min: 0 });
      lines.push(`日常消耗 -${upkeep}`);

      G.State.commit(deltas, 'economy.monthly');
      return lines;
    },

    // ---------- 坊市 ----------
    stock(s) {
      const base = G.DATA.static.items.filter(i => i.type !== 'quest');
      // 每月刷新，随机 6-9 件 + 价格浮动
      const seedTurn = Math.floor(s.time.absoluteTurn / 84);
      const rng = new G.RNG((s.meta.seed ^ (seedTurn * 7919)) >>> 0);
      const n = rng.int(6, 9);
      return rng.sample(base, n).map(i => ({
        ...i,
        price: Math.max(1, Math.round(i.price * (0.85 + rng.float() * 0.4))),
        qty: rng.int(1, 5)
      }));
    },

    buy(s, itemId, price, qty) {
      qty = qty || 1;
      const total = price * qty;
      if (!this.pay(s, total)) return { ok: false, reason: '灵石不够' };
      G.State.commit([{ path: `resources.items.${itemId}`, op: 'add', value: qty, min: 0 }], 'economy.buy');
      return { ok: true, total };
    },

    sell(s, itemId, qty) {
      qty = qty || 1;
      const have = s.resources.items[itemId] || 0;
      if (have < qty) return { ok: false, reason: '没有那么多' };
      const item = G.DATA.static.items.find(i => i.id === itemId);
      const gain = Math.round((item?.price || 10) * 0.5 * qty);
      G.State.commit([
        { path: `resources.items.${itemId}`, op: 'add', value: -qty, min: 0 },
        { path: 'resources.stone.low', op: 'add', value: gain }
      ], 'economy.sell');
      return { ok: true, gain };
    },

    useItem(s, itemId) {
      const have = s.resources.items[itemId] || 0;
      if (have <= 0) return { ok: false, reason: '没有' };
      const item = G.DATA.static.items.find(i => i.id === itemId);
      if (!item || item.type !== 'pill') return { ok: false, reason: '这个不能直接用' };

      const deltas = [{ path: `resources.items.${itemId}`, op: 'add', value: -1, min: 0 }];
      const eff = item.effect || {};
      if (eff.exp)   deltas.push({ path: 'cultivation.exp', op: 'add', value: eff.exp, min: 0 });
      if (eff.demon) deltas.push({ path: 'cultivation.demonHeart', op: 'add', value: eff.demon, clamp: [0, 100] });
      if (eff.heal)  deltas.push({ path: 'cultivation.resting', op: 'add', value: -eff.heal, min: 0 });
      if (eff.breakthrough) return { ok: false, reason: '破障丹需在突破时服用' };

      G.State.commit(deltas, 'economy.use');
      return { ok: true, item };
    },

    /** 打工 */
    work(s, kind) {
      const table = {
        field:   { name: '打理灵田',     stone: [10, 25], attr: null },
        beast:   { name: '照料灵兽',     stone: [12, 28], attr: 'xin' },
        library: { name: '藏经阁助理',   stone: [10, 22], attr: 'wu' },
        errand:  { name: '替执事跑腿',   stone: [15, 30], attr: 'shi' }
      };
      const w = table[kind] || table.field;
      const r = G.Check.roll({ attrKey: w.attr, difficulty: 35, reason: 0 });
      const mult = Math.max(0.4, G.Check.GRADE_MULT[r.grade]);
      const gain = Math.round(G.rng.int(w.stone[0], w.stone[1]) * mult);
      const deltas = [{ path: 'resources.stone.low', op: 'add', value: gain, min: 0 }];
      if (kind === 'errand') deltas.push({ path: 'relations.npc_fangyan.favor', op: 'add', value: 2, clamp: [-100, 100] });
      if (kind === 'library') deltas.push({ path: 'relations.npc_yunshu.favor', op: 'add', value: 2, clamp: [-100, 100] });
      G.State.commit(deltas, 'economy.work');
      return { name: w.name, gain, grade: r.grade };
    }
  };

  G.Economy = Economy;

})(window.G = window.G || {});

/* ===== systems/reputation.js — 声望与阵营 ===== */
(function (G) {
  'use strict';

  const Reputation = {

    tier(v) {
      return G.DATA.static.repTiers.find(t => v <= t.max) || G.DATA.static.repTiers[0];
    },

    tierName(s) { return this.tier(s.reputation.value).name; },

    /** 边际递减：名声越大，再往上越难。声望 80 以上，增益只剩三成。 */
    scale(s, v) {
      if (v <= 0) return v;
      const cur = s.reputation.value;
      const f = cur >= 90 ? 0.15 : cur >= 80 ? 0.3 : cur >= 65 ? 0.5 : cur >= 45 ? 0.75 : 1;
      return v * f;
    },

    add(s, v, tag) {
      const deltas = [{ path: 'reputation.value', op: 'add', value: this.scale(s, v), clamp: [0, 100] }];
      if (tag) deltas.push({ path: 'reputation.tags', op: 'push', value: tag, unique: true, maxLen: 8 });
      G.State.commit(deltas, 'reputation.add');
    },

    /** 阵营倾向变化。不站队也是一种选择，但会被记下来。 */
    lean(s, key, v) {
      const deltas = [{ path: `reputation.factions.${key}`, op: 'add', value: v, clamp: [-100, 100] }];
      // 支持一派会轻微开罪对立派
      const opposite = { traditional: 'reform', reform: 'traditional', xiaoyao: 'pragmatic', pragmatic: 'xiaoyao' }[key];
      if (opposite && v > 0) {
        deltas.push({ path: `reputation.factions.${opposite}`, op: 'add', value: -Math.round(v * 0.6), clamp: [-100, 100] });
      }
      G.State.commit(deltas, 'reputation.lean');
    },

    /** 主导阵营；全部接近 0 时视为中立 */
    dominant(s) {
      const f = s.reputation.factions;
      let best = null, bv = 0;
      for (const k in f) if (Math.abs(f[k]) > Math.abs(bv)) { bv = f[k]; best = k; }
      if (!best || Math.abs(bv) < 15) return { key: null, name: '未表态', value: bv };
      return { key: best, name: G.DATA.static.factionLabel[best], value: bv };
    },

    /** 阵营立场对特定 NPC 的态度加成 */
    factionBonus(s, npcId) {
      const npc = G.NPC.get(npcId);
      if (!npc || !npc.faction) return 0;
      const v = s.reputation.factions[npc.faction] || 0;
      return Math.round(v * 0.15);
    },

    /** 声望对判定的通用加成（被认识的人更容易办成事） */
    socialMod(s) { return Math.round(s.reputation.value * 0.12); },

    /** 中立太久会被贴"没有立场"标签 */
    monthlyTick(s) {
      const d = this.dominant(s);
      if (!d.key && s.time.absoluteTurn > 200 && !s.reputation.tags.includes('没有立场')) {
        G.State.commit([{ path: 'reputation.tags', op: 'push', value: '没有立场', unique: true }], 'reputation.neutral');
      }
    }
  };

  G.Reputation = Reputation;

})(window.G = window.G || {});
