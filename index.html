<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover 是安全区生效的前提；没有它 env(safe-area-inset-*) 恒为 0。
     user-scalable=no 只对安卓有效，iOS 会忽略它，真正的拦截在 boot.js 的 lockZoom() -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>修仙学院模拟器 · 云霄仙院</title>
<meta name="description" content="单机文字修仙模拟经营。三条身份路线，98 个事件，22 种结局。">
<meta name="theme-color" content="#F5F1E8">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">

<!-- 添加到主屏后全屏运行；状态栏用 black-translucent，
     内容才会顶到灵动岛下面，再由 CSS 的安全区把它让开 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="云霄仙院">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="assets/icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="assets/icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="assets/icons/apple-touch-icon-120.png">
<style>
/* ===== ui/theme.css — 水墨主题 ===== */

:root {
  --paper:    #F5F1E8;
  --paper-2:  #EFE9DC;
  --ink:      #2B2B2B;
  --ink-2:    #4A4642;
  --ink-3:    #7A7570;
  --ink-4:    #A8A29A;
  --tea:      #A8875C;
  --stone:    #4A6E8A;
  --green:    #6B8E7A;
  --cinnabar: #B84A3E;
  --line:     rgba(43,43,43,.14);
  --line-2:   rgba(43,43,43,.07);
  --accent:   #5A6B7A;      /* 由所属学院覆盖 */
  --shadow:   0 2px 18px rgba(43,43,43,.07);
  --radius:   3px;
  --serif:    "Songti SC", "SimSun", "Noto Serif SC", "Source Han Serif SC", serif;
  --sans:     "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

  /* 安全区。灵动岛/刘海在竖屏占顶部，在横屏占左边或右边（取决于机器朝哪转），
     所以四个方向都要留，不能只处理 top。 */
  --sa-top:    env(safe-area-inset-top, 0px);
  --sa-right:  env(safe-area-inset-right, 0px);
  --sa-bottom: env(safe-area-inset-bottom, 0px);
  --sa-left:   env(safe-area-inset-left, 0px);

  /* home indicator 那条横杠本身就占掉一截，标签栏不用再做高，
     56px 的时候底下会空出明显一片纸色。 */
  --tabbar: 48px;   /* 竖屏底部标签栏高度 */
  --rail:   54px;   /* 横屏左侧导轨宽度 */
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;          /* 横屏时 iOS 会自作主张放大字号 */
  overscroll-behavior: none;               /* 禁掉整页橡皮筋，否则拖动像要退出 */
  touch-action: pan-x pan-y;               /* 只留平移：捏合与双击缩放都不响应 */
}

body::before {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
  opacity: .05;
  background-image:
    repeating-linear-gradient(0deg, transparent 0 2px, rgba(43,43,43,.4) 2px 3px),
    repeating-linear-gradient(90deg, transparent 0 3px, rgba(43,43,43,.3) 3px 4px);
}

#app { position: relative; z-index: 1; height: 100%; }

/* 界面元素禁止长按选中，只有叙事正文可以选 */
.topbar, .mobile-tabs, .opt, .btn, .slot, .panel-title, .kv, .rel, .stage {
  -webkit-user-select: none; user-select: none;
}
.narrative, .ending .text, .ending .quote, .ending .resume { -webkit-user-select: text; user-select: text; }
img { -webkit-user-drag: none; user-drag: none; }

/* ---------- 通用 ---------- */
button {
  font-family: inherit; font-size: inherit; color: inherit;
  background: none; border: none; cursor: pointer;
  -webkit-tap-highlight-color: transparent;   /* 去掉安卓/iOS 点击时那块蓝灰 */
  touch-action: manipulation;                 /* 关掉双击缩放的 300ms 延迟 */
}
/* 字号必须 ≥16px。iOS 上只要输入框小于 16px，聚焦时 Safari 就会自动
   把整页放大，而我们又禁了缩放，页面会卡在放大状态回不去。 */
input, select, textarea {
  font-family: inherit; font-size: 16px; color: var(--ink);
  background: rgba(255,255,255,.5);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 7px 10px; outline: none; width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }

.hr {
  height: 1px; border: none; margin: 18px 0;
  background: linear-gradient(90deg, transparent, var(--line) 12%, var(--line) 88%, transparent);
}
.muted { color: var(--ink-3); }
.tiny  { font-size: 12px; letter-spacing: .04em; }
.small { font-size: 13px; }
.mono  { font-family: var(--sans); font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.danger { color: var(--cinnabar); }
.ok { color: var(--green); }

/* ---------- 布局 ---------- */
.layout {
  display: grid;
  grid-template-columns: 258px minmax(0,1fr) 316px;
  height: 100%;
  gap: 0;
}
.col {
  height: 100%; overflow-y: auto; overflow-x: hidden;
  padding: 22px 18px 60px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;   /* 滚到底不要把外层也带着弹 */
}
.col-left  { border-right: 1px solid var(--line); background: var(--paper-2); }
.col-right { border-left:  1px solid var(--line); background: var(--paper-2); }
.col-main  { padding: 0; display: flex; flex-direction: column; }

/* ---------- 顶栏 ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  padding: calc(12px + var(--sa-top)) calc(26px + var(--sa-right)) 12px calc(26px + var(--sa-left));
  border-bottom: 1px solid var(--line);
  background: var(--paper);
  position: sticky; top: 0; z-index: 20;
}
.topbar .title { font-size: 14px; letter-spacing: .1em; color: var(--ink-2); min-width: 0; }
.topbar .title .compact { display: none; }
.topbar .acts { display: flex; gap: 4px; flex-shrink: 0; }

/* ---------- 场景与立绘 ---------- */
.stage { position: relative; height: 280px; overflow: hidden; flex-shrink: 0; background: var(--paper-2); }
.stage .bg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center 42%;
  transition: filter .8s ease, transform 14s linear;
  transform: scale(1.04);
}
.stage.dawn .bg { filter: sepia(.15) brightness(1.08) hue-rotate(-8deg); }
.stage.noon .bg { filter: none; }
.stage.dusk .bg { filter: sepia(.3) brightness(.88) hue-rotate(-15deg) saturate(1.1); }
.stage.night .bg { filter: brightness(.55) saturate(.7) hue-rotate(200deg); }
/* 只在底部收边融进纸色。早期版本从 62% 就开始压，
   结果整幅画的下半截被洗成一片白，等于白画了。 */
.stage .veil {
  position: absolute; inset: 0;
  background: linear-gradient(180deg,
    rgba(245,241,232,.02) 0%,
    rgba(245,241,232,.02) 55%,
    rgba(245,241,232,.28) 78%,
    var(--paper) 100%);
}
/* 场景图未到位时的占位。做得体面一点——大部分场景还没画，
   条纹底看着像坏图，淡墨晕染至少像张没画完的宣纸。 */
.stage .placeholder {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-4); font-size: 15px; letter-spacing: .5em; text-indent: .5em;
  background:
    radial-gradient(120% 80% at 50% 12%, rgba(122,117,112,.10) 0%, transparent 62%),
    radial-gradient(90% 60% at 18% 88%, rgba(74,110,138,.07) 0%, transparent 60%),
    var(--paper-2);
}
.stage .scene-name {
  position: absolute; left: 26px; bottom: 12px;
  font-size: 13px; letter-spacing: .22em; color: var(--ink-2);
}
.portraits {
  position: absolute; right: 26px; bottom: 0; display: flex; align-items: flex-end; gap: 4px;
}
.portrait {
  width: 155px; height: 232px; object-fit: contain; object-position: bottom;
  filter: brightness(.66) saturate(.85); transform: translateY(4px);
  transition: filter .3s, transform .3s;
}
.portrait.active { filter: brightness(1) saturate(1); transform: translateY(0); }
.portrait-fallback {
  width: 155px; height: 232px;
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 10px;
  background: linear-gradient(180deg, transparent, var(--accent));
  opacity: .3; border-radius: 60px 60px 0 0;
  font-size: 12px; color: var(--paper);
}

/* ---------- 叙事区 ---------- */
.narrative-wrap { flex: 1; overflow-y: auto; padding: 26px 46px 40px; }
.narrative {
  max-width: 690px; margin: 0 auto;
  font-size: 16.5px; line-height: 2.05; color: var(--ink);
  text-align: justify;
}
.narrative p { margin: 0 0 1.15em; text-indent: 2em; }
.narrative p:first-child::first-letter { font-size: 1.05em; }
.narrative .sys {
  text-indent: 0; font-size: 13.5px; color: var(--ink-3);
  border-left: 2px solid var(--line); padding-left: 12px; margin: 1.4em 0;
  font-family: var(--sans); line-height: 1.8;
}
.narrative .sys b { color: var(--ink-2); font-weight: 500; }
.cursor { display: inline-block; width: 2px; height: 1em; background: var(--ink-3);
          vertical-align: -.12em; animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }

/* ---------- 选项 ---------- */
.options { max-width: 690px; margin: 26px auto 0; display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: block; width: 100%; text-align: left;
  padding: 13px 16px; border: 1px solid var(--line);
  background: rgba(255,255,255,.42);
  border-radius: var(--radius);
  transition: border-color .18s, background .18s, transform .18s;
  line-height: 1.7;
}
/* 触屏没有 hover，:hover 会在点完之后粘住。只在真有指针的设备上开。 */
@media (hover: hover) and (pointer: fine) {
  .opt:hover { border-color: var(--accent); background: rgba(255,255,255,.85); transform: translateX(3px); }
}
.opt:active { border-color: var(--accent); background: rgba(255,255,255,.9); }
.opt:disabled { opacity: .38; cursor: not-allowed; transform: none; }
.opt .key { color: var(--accent); margin-right: 10px; font-family: var(--sans); font-size: 14px; }
.opt .hint {
  display: block; margin-top: 5px; font-size: 12.5px; color: var(--ink-4);
  font-family: var(--sans);
}
.opt.custom { border-style: dashed; }
.custom-input { display: flex; gap: 8px; margin-top: 8px; }
.custom-input input { flex: 1; }

/* ---------- 对话场 ---------- */
.dialog { max-width: 690px; margin: 18px auto 6px; font-family: var(--sans); }
.dl-lines { display: flex; flex-direction: column; gap: 10px; }
.dl-line { display: flex; flex-direction: column; max-width: 86%; text-indent: 0; }
.dl-line.npc { align-self: flex-start; }
.dl-line.me  { align-self: flex-end; align-items: flex-end; }
.dl-name { font-size: 12px; letter-spacing: .12em; color: var(--accent); margin: 0 0 3px 4px; }
.dl-text {
  display: inline-block; padding: 9px 14px; line-height: 1.75; font-size: 15px;
  border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.55);
  font-family: var(--serif, inherit);
}
.dl-line.npc .dl-text { border-top-left-radius: 3px; }
.dl-line.me  .dl-text { border-top-right-radius: 3px; background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dl-line.typing .dl-text { color: var(--ink-4); min-width: 2.6em; }
.dl-foot { margin-top: 14px; }
.dl-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.dl-chip {
  padding: 6px 12px; font-size: 13.5px; border: 1px dashed var(--line); border-radius: 999px;
  background: rgba(255,255,255,.35); color: var(--ink-2); line-height: 1.5;
}
@media (hover: hover) and (pointer: fine) {
  .dl-chip:hover { border-color: var(--accent); color: var(--ink); background: rgba(255,255,255,.8); }
}
.dl-chip:active { border-color: var(--accent); background: #fff; }
.dl-chip:disabled { opacity: .4; }
.dl-row { display: flex; gap: 8px; }
.dl-row input { flex: 1; min-width: 0; }
.dl-end { font-size: 13px; color: var(--ink-4); padding: 6px 0 0 4px; }
/* 幻象里的人不是本人 */
.stage.haunt .portrait, .stage.haunt .portrait-fallback { filter: grayscale(.85) brightness(.75) contrast(1.1); }
/* 心魔：它的话是黑底，你的话反而是纸色——幻境里谁是主谁是客，一眼能看出来 */
.dialog.demon .dl-name { color: var(--cinnabar); }
.dialog.demon .dl-line.npc .dl-text { background: var(--ink); color: var(--paper); border-color: var(--ink); letter-spacing: .04em; }
.dialog.demon .dl-line.me .dl-text { background: rgba(255,255,255,.7); color: var(--ink); border-color: var(--line); }
.custom-slot { max-width: 690px; margin: 14px auto 0; font-family: var(--sans); }
.custom-slot .cs-head { font-size: 13px; color: var(--ink-3); letter-spacing: .06em; margin-bottom: 4px; }
.custom-slot .cs-head b { color: var(--ink-2); font-weight: 500; }
.dl-mod {
  font-size: 13px; color: var(--ink-3); text-align: center; margin: 14px 0 -10px;
  letter-spacing: .06em;
}

/* ---------- 传音符 ---------- */
.msg-card {
  border: 1px solid var(--line); border-left: 3px solid var(--cinnabar); border-radius: var(--radius);
  background: rgba(255,255,255,.5); padding: 12px 16px; font-family: var(--sans);
}
.msg-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.msg-from { font-size: 14px; letter-spacing: .1em; color: var(--ink-2); }
.msg-time { font-size: 12px; color: var(--ink-4); }
.msg-text { font-family: var(--serif, inherit); font-size: 15.5px; line-height: 1.8; color: var(--ink); margin-bottom: 8px; text-indent: 0; }
.msg-card .btn-row { margin-top: 4px; }

/* ---------- 当下要紧 ---------- */
.urgent { display: flex; flex-direction: column; gap: 6px; }
.urgent .it { display: flex; gap: 8px; font-size: 13px; line-height: 1.6; color: var(--ink-2); font-family: var(--sans); }
.urgent .it::before { content: '·'; color: var(--ink-4); }
.urgent .it.warn { color: #8a6116; }
.urgent .it.warn::before { content: '!'; color: #b8891e; font-weight: 600; }
.urgent .it.danger { color: var(--cinnabar); }
.urgent .it.danger::before { content: '!'; color: var(--cinnabar); font-weight: 600; }
.urgent .it.good::before { content: '※'; color: var(--accent); }
.narrative .urgent { max-width: 690px; margin: 0 auto 8px; }
.narrative .urgent .it { font-size: 14px; text-indent: 0; }

/* ---------- 按钮 ---------- */
.btn {
  padding: 7px 16px; border: 1px solid var(--line);
  border-radius: var(--radius); background: rgba(255,255,255,.5);
  font-size: 14px; transition: all .18s; white-space: nowrap;
}
@media (hover: hover) and (pointer: fine) {
  .btn:hover { border-color: var(--accent); background: #fff; }
    }
.btn:active { border-color: var(--accent); background: #fff; }
.slot:active { border-color: var(--accent); background: #fff; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover { background: var(--ink-2); }
.btn.ghost { border-color: transparent; color: var(--ink-3); padding: 6px 10px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- 面板 ---------- */
.panel { margin-bottom: 24px; }
.panel-title {
  font-size: 12px; letter-spacing: .26em; color: var(--ink-3);
  padding-bottom: 7px; margin-bottom: 11px;
  border-bottom: 1px solid var(--line);
}
.kv { display: flex; justify-content: space-between; align-items: baseline;
      font-size: 14px; padding: 3px 0; gap: 10px; }
.kv .k { color: var(--ink-3); flex-shrink: 0; }
.kv .v { font-family: var(--sans); font-variant-numeric: tabular-nums; text-align: right; }

.bar { height: 3px; background: var(--line-2); border-radius: 2px; overflow: hidden; margin: 5px 0 9px; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .5s ease; }
.bar.warn > i { background: var(--tea); }
.bar.danger > i { background: var(--cinnabar); }

.attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; }

.tag {
  display: inline-block; font-size: 11.5px; font-family: var(--sans);
  padding: 1px 7px; border: 1px solid var(--line); border-radius: 2px;
  color: var(--ink-3); margin: 2px 3px 2px 0;
}
.tag.on { border-color: var(--accent); color: var(--accent); }

/* ---------- 关系卡 ---------- */
.rel { padding: 10px 0; border-bottom: 1px solid var(--line-2); }
.rel:last-child { border-bottom: none; }
.rel-head { display: flex; justify-content: space-between; align-items: baseline; }
.rel-name { font-size: 14.5px; }
.rel-stage { font-size: 12px; color: var(--accent); font-family: var(--sans); }
.rel-dims { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-top: 6px; }
.rel-dim { font-size: 11px; color: var(--ink-4); font-family: var(--sans); text-align: center; }
.rel-dim i { display: block; height: 2px; background: var(--line-2); margin-top: 3px; border-radius: 1px; }
.rel-dim i > b { display: block; height: 100%; background: var(--accent); }
.rel-note { font-size: 12px; color: var(--ink-4); margin-top: 5px; line-height: 1.6; }

/* ---------- 日程 ---------- */
.sched { display: grid; grid-template-columns: 30px repeat(3, 1fr); gap: 3px; font-size: 12px; }
.sched .h { color: var(--ink-4); font-size: 11px; text-align: center; padding: 3px 0; font-family: var(--sans); }
.sched .d { color: var(--ink-3); font-size: 11.5px; display: flex; align-items: center; }
.slot {
  border: 1px solid var(--line-2); border-radius: 2px; padding: 5px 3px;
  min-height: 30px; text-align: center; cursor: pointer;
  font-size: 11px; line-height: 1.4; color: var(--ink-2);
  background: rgba(255,255,255,.3); transition: all .15s;
  display: flex; align-items: center; justify-content: center;
}
.slot.empty { color: var(--ink-4); }
.slot.custom { border-style: dashed; color: var(--ink-2); }
.slot.cls { background: rgba(90,107,122,.09); }

/* ---------- 弹窗 ---------- */
.modal-mask {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(43,43,43,.3); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.modal {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  max-width: 620px; width: 100%; max-height: 86vh; overflow-y: auto;
  padding: 26px 30px;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
}

/* 手机上弹窗改成底部抽屉——居中弹窗在窄屏上顶天立地，很难看，
   而且拇指够不到上半部分的按钮。 */
@media (max-width: 700px) and (orientation: portrait) {
  .modal-mask { align-items: flex-end; padding: 0; }
  .modal {
    max-width: none; max-height: 82vh;
    border-radius: 14px 14px 0 0; border-bottom: none;
    padding: 22px calc(20px + var(--sa-right)) 0 calc(20px + var(--sa-left));
    animation: sheet-up .22s cubic-bezier(.2,.7,.3,1);
  }
  /* 弹窗的底部内边距在吸底的操作键上，不在弹窗上——sticky 的定位矩形不含
     滚动容器的内边距，放在弹窗上正文会从操作键底下漏出来一截 */
  .modal > :last-child:not(.modal-actions) { padding-bottom: calc(24px + var(--sa-bottom)); }
  /* 抽屉顶部的把手，暗示可以下滑关闭 */
  .modal::before {
    content: ''; display: block; width: 36px; height: 4px; margin: -6px auto 14px;
    background: var(--line); border-radius: 2px;
  }
  /* 只有弹窗自己那排操作键吸底。正文里的 .btn-row 不能碰——
     活动选择器每个分类都是一行按钮，全吸底就会层层糊在屏幕上。 */
  .modal > .modal-actions {
    position: sticky; bottom: 0; z-index: 1;
    background: var(--paper); padding-top: 10px;
    padding-bottom: calc(16px + var(--sa-bottom));
    margin-top: 12px !important;
    box-shadow: 0 -8px 12px -8px rgba(43,43,43,.18);
  }
}
@keyframes sheet-up { from { transform: translateY(14%); opacity: .6 } to { transform: none; opacity: 1 } }

@media (orientation: landscape) and (max-height: 540px) {
  .modal-mask { padding: 10px calc(10px + var(--sa-right)) 10px calc(var(--rail) + var(--sa-left) + 10px); }
  .modal { max-height: 94vh; padding: 16px 20px; }
}
.modal h3 { font-size: 16px; font-weight: normal; letter-spacing: .18em;
            margin-bottom: 4px; }
.modal .sub { font-size: 12.5px; color: var(--ink-3); margin-bottom: 18px; }
.field { margin-bottom: 15px; }
.field > label { display: block; font-size: 12.5px; color: var(--ink-3); margin-bottom: 5px; }

/* ---------- 角色创建 ---------- */
.create-page {
  max-width: 760px; margin: 0 auto;
  padding: calc(46px + var(--sa-top)) calc(24px + var(--sa-right))
           calc(80px + var(--sa-bottom)) calc(24px + var(--sa-left));
}
@media (max-width: 700px) {
  .create-page { padding-top: calc(28px + var(--sa-top)); padding-left: calc(16px + var(--sa-left));
                 padding-right: calc(16px + var(--sa-right)); }
  /* 属性加减这类小按钮在手机上太难点，统一撑到 44px */
  .create-page .btn { padding: 9px 13px; min-height: 40px; }
  .create-page .btn-row { gap: 7px; }
}
@media (orientation: landscape) and (max-height: 540px) {
  .create-page { padding-top: calc(20px + var(--sa-top)); }
}

/* ---------- 结局 ---------- */
.ending {
  max-width: 620px; margin: 0 auto; text-align: center;
  padding: calc(60px + var(--sa-top)) calc(20px + var(--sa-right))
           calc(60px + var(--sa-bottom)) calc(20px + var(--sa-left));
}
@media (max-width: 700px) {
  .ending { padding-top: calc(36px + var(--sa-top)); }
  .ending .name { font-size: 22px; letter-spacing: .22em; }
  .ending .quote { font-size: 15.5px; }
}
.ending .icon { font-size: 40px; }
.ending .name { font-size: 26px; letter-spacing: .3em; margin: 16px 0 6px; }
.ending .no { font-size: 12px; color: var(--ink-4); letter-spacing: .2em; }
.ending .text { text-align: justify; margin: 32px 0; line-height: 2.1; }
.ending .quote {
  font-size: 17px; color: var(--ink-2); margin: 26px 0;
  padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.ending .resume { text-align: left; font-size: 13.5px; color: var(--ink-3); }

/* ---------- 加载 ---------- */
.loading { color: var(--ink-4); font-size: 13.5px; font-family: var(--sans); }
.dots::after { content: ''; animation: dots 1.4s steps(4) infinite; }
@keyframes dots { 0%{content:''} 25%{content:'·'} 50%{content:'··'} 75%{content:'···'} }

/* ================= 移动端 =================
 * 两套布局：
 *   竖屏 —— 单栏 + 底部标签栏，一次看一屏
 *   横屏 —— 主栏与侧栏并排 + 左侧竖排导轨，把横向空间用起来
 * 手机横屏高度只有 390 上下，底部标签栏会吃掉六分之一的高度，
 * 所以横屏一定要把它换成竖排导轨。
 */
.mobile-tabs { display: none; }

/* ---------- 竖屏手机 ---------- */
@media (max-width: 860px) and (orientation: portrait),
       (max-width: 700px) {
  .layout { grid-template-columns: 1fr; }
  .col-left, .col-right { display: none; border: none; }
  .layout.tab-left  .col-left  { display: block; }
  .layout.tab-right .col-right { display: block; }
  .layout.tab-left  .col-main, .layout.tab-right .col-main { display: none; }

  .col { padding: 18px calc(16px + var(--sa-right)) calc(var(--tabbar) + var(--sa-bottom) + 8px) calc(16px + var(--sa-left)); }
  .col-main { padding: 0; }

  /* 状态页和安排页没有顶栏，是从屏幕最上沿开始画的——不自己让开
     就会被灵动岛压住第一行字。叙事页不用管，顶栏已经让过了。 */
  .col-left, .col-right { padding-top: calc(14px + var(--sa-top)); }

  /* 顶栏两行：第一行日期，第二行动作键。单行放不下五个键加日期，
     日期会折成五六行，把顶栏撑成半个屏。 */
  .topbar { flex-wrap: wrap; gap: 8px 0; padding: calc(8px + var(--sa-top)) calc(14px + var(--sa-left)) 8px calc(14px + var(--sa-right)); }
  .topbar .title { width: 100%; font-size: 12px; letter-spacing: .08em; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .title .full { display: none; }
  .topbar .title .compact { display: inline; }
  .topbar .acts { width: 100%; justify-content: space-between; }
  .topbar .acts .btn { padding: 8px 10px; font-size: 13px; min-height: 38px; flex: 1; text-align: center; }
  .topbar .acts .btn.primary { flex: 1.5; }
  .dl-chip { min-height: 40px; }
  .rel-dims { grid-template-columns: repeat(2, 1fr); gap: 4px 10px; }
  .rel-dim { text-align: left; }

  .narrative-wrap {
    padding: 18px calc(20px + var(--sa-right)) calc(var(--tabbar) + var(--sa-bottom) + 8px) calc(20px + var(--sa-left));
  }
  .narrative { font-size: 16.5px; line-height: 2.0; }
  .options { padding: 0 !important; margin-top: 20px; }
  .opt { padding: 15px 16px; }          /* 触控热区 ≥44px */
  .btn { padding: 9px 15px; }

  .stage { height: 30vh; min-height: 150px; max-height: 220px; }
  .portrait, .portrait-fallback { width: 118px; height: 176px; }
  .portraits { right: calc(14px + var(--sa-right)); }
  .stage .scene-name { left: calc(20px + var(--sa-left)); }

  .mobile-tabs {
    display: grid; grid-template-columns: repeat(3, 1fr);
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--paper); border-top: 1px solid var(--line);
    padding-bottom: var(--sa-bottom);
    padding-left: var(--sa-left); padding-right: var(--sa-right);
  }
  .mobile-tabs button {
    height: var(--tabbar); font-size: 13.5px; color: var(--ink-3);
    letter-spacing: .1em;
  }
  .mobile-tabs button.on { color: var(--ink); box-shadow: inset 0 2px 0 var(--accent); }

  .sched { gap: 4px; }
  .slot { min-height: 40px; font-size: 11.5px; }
}

/* ---------- 横屏手机 ---------- */
@media (orientation: landscape) and (max-height: 540px) {
  /* 主栏常驻，侧栏二选一。导轨竖在最左边，避开灵动岛。 */
  .layout {
    grid-template-columns: 1fr minmax(240px, 30vw);
    padding-left: calc(var(--rail) + var(--sa-left));
  }
  /* 主栏永远占第一列（宽的那列）。DOM 里状态栏排在主栏前面，不调 order 的话
     「状态」分页会把状态栏放进宽列、主栏挤进 30vw，顶栏直接溢出屏幕。 */
  .col-left, .col-right { display: none; border-left: 1px solid var(--line); border-right: none; order: 1; }
  .col-main { display: flex !important; order: 0; }
  .layout.tab-right .col-right { display: block; }
  .layout.tab-left  .col-left  { display: block; }
  /* 「专注」：收起侧栏，整屏留给叙事 */
  .layout.tab-main { grid-template-columns: 1fr; }

  .col { padding: 12px calc(14px + var(--sa-right)) calc(24px + var(--sa-bottom)) 14px; }
  .col-main { padding: 0; }

  /* 顶栏在 .col-main 里，而 .layout 已经整体让开了导轨，
     所以这里不要再补 --rail，否则会双倍缩进 */
  .topbar { padding: calc(8px + var(--sa-top)) calc(18px + var(--sa-right)) 8px 18px; }
  .topbar .title { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .title .full { display: none; }
  .topbar .title .compact { display: inline; }
  .topbar .acts .btn { padding: 6px 9px; font-size: 12.5px; min-height: 36px; }
  .dl-chip { min-height: 36px; }

  /* 横屏高度金贵，舞台压到很薄，只留一条氛围带 */
  .stage { height: 30vh; min-height: 96px; max-height: 150px; }
  .portrait, .portrait-fallback { width: 92px; height: 138px; }
  .stage .scene-name { font-size: 11px; bottom: 6px; }

  .narrative-wrap { padding: 14px calc(24px + var(--sa-right)) 24px 24px; }
  .narrative { font-size: 15.5px; line-height: 1.92; }
  .options { padding: 0 !important; margin-top: 16px; }
  .opt { padding: 11px 14px; }
  .opt .hint { margin-top: 3px; }

  /* 竖排导轨：文字竖排，省宽度 */
  .mobile-tabs {
    display: flex; flex-direction: column;
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 30;
    width: calc(var(--rail) + var(--sa-left));
    padding-left: var(--sa-left);
    padding-top: var(--sa-top); padding-bottom: var(--sa-bottom);
    background: var(--paper-2); border-top: none; border-right: 1px solid var(--line);
    justify-content: center; gap: 6px;
  }
  .mobile-tabs button {
    height: auto; padding: 14px 0; font-size: 13px; color: var(--ink-3);
    writing-mode: vertical-rl; letter-spacing: .28em; text-indent: .28em;
    align-self: center;
  }
  .mobile-tabs button.on { color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }

  .sched { font-size: 11px; }
  .slot { min-height: 30px; padding: 3px 2px; }
  .panel { margin-bottom: 16px; }
}

/* ---------- 平板 / 折叠屏展开 ---------- */
@media (min-width: 861px) and (max-width: 1100px) {
  .layout { grid-template-columns: 220px minmax(0, 1fr) 268px; }
  .narrative-wrap { padding: 22px 30px 34px; }
  .col-left, .col-right { padding-left: 14px; padding-right: 14px; }
}

{"narrative":"他放下灯，坐了下来。说了一炷香。说到最后他停了很久，才把最要紧的那句说出口：「三百年前，前任院主下去了，没有上来。封印是他一个人续的。」他抬眼看你，「续封印的代价，是人留在里面。」","effects":[{"type":"flag","key":"lingxu_permit"},{"type":"flag","key":"lingxu_opened"},{"type":"flag","key":"know_seal_price"},{"type":"storyline","key":"seal","value":30,"clue":"封印铭文拓片"},{"type":"storyline","key":"exHead","value":30,"clue":"楚河山的沉默"},{"type":"relation","npc":"npc_chuheshan","favor":15,"trust":22}]},"good":{"narrative":"他说了大半，但最关键的那句没说。「下去了你就知道了。」","effects":[{"type":"flag","key":"lingxu_permit"},{"type":"flag","key":"lingxu_opened"},{"type":"storyline","key":"seal","value":18,"clue":"封印铭文拓片"},{"type":"storyline","key":"exHead","value":12,"clue":"楚河山的沉默"}]},"plain":{"narrative":"他只说了「一件很老的东西」。","effects":[{"type":"flag","key":"lingxu_permit"},{"type":"flag","key":"lingxu_opened"},{"type":"storyline","key":"seal","value":8}]},"bad":{"narrative":"他摇头：「问这么多做什么。去还是不去。」","effects":[{"type":"flag","key":"lingxu_opened"},{"type":"relation","npc":"npc_chuheshan","favor":-3}]},"terrible":{"narrative":"你问到了他不愿提的地方。他把灯提起来：「当我没来过。」门在你面前关上了。","effects":[{"type":"flag","key":"lingxu_opened"},{"type":"relation","npc":"npc_chuheshan","favor":-12,"trust":-10}]}}},{"id":"C","text":"不去","reason":6,"outcomes":{"fixed":{"narrative":"你说了「不」。他点点头，一点意外也没有。「那就好。」他说，「这是对的答案。」他提着灯走了，脚步声在走廊里越来越远。\n\n那一夜你没睡着。","effects":[{"type":"flag","key":"lingxu_opened"},{"type":"flag","key":"refused_lingxu"},{"type":"relation","npc":"npc_chuheshan","trust":8},{"type":"demon","value":5,"source":"guilt","note":"那盏走远的灯"}]}}}]},{"id":"evt_seal_choice","category":"storyline","weight":40,"scene":"scene_lingxu","actors":["npc_tantaiwujiu"],"cooldown":999,"important":true,"conditions":{"role":["student"],"storyline":{"seal":{"unlocked":true,"minProgress":88}},"flags":["lingxu_permit"],"notFlags":["seal_resolved"]},"seed":"封印室的门开着。院主站在里面，白衣无纹，背对着你。你走进去的时候他没有回头。\n\n「你都查清楚了。」他说，「那你也知道，续这道封印要什么。」石台上的铭文正在一寸一寸地暗下去。「三百年前是他。」院主终于转过身，「这次可以是我。也可以是你。」\n\n「我不劝你。」他说，「你自己选。」","facts":["封印即将失效，需要有人留下来续","院主说可以是他，也可以是你","他不会劝你"],"options":[{"id":"A","text":"我留下","reason":14,"check":{"attr":"xin","difficulty":55},"outcomes":{"perfect":{"narrative":"你走上石台。院主看了你很久，然后做了一件谁也没想到的事——他行了一礼。\n\n「往后一千年，这座学院会记得。」他说。\n\n石门在你身后合上时，你听见外面传来钟声。是学院的晨钟，一共二十四响。你数完了。","effects":[{"type":"flag","key":"choose_guard_seal"},{"type":"flag","key":"seal_resolved"},{"type":"storyline","key":"seal","value":20},{"type":"reputation","value":20}]},"good":{"narrative":"你走上了石台。院主没有阻拦。石门合上时，你还听得见外面的风。","effects":[{"type":"flag","key":"choose_guard_seal"},{"type":"flag","key":"seal_resolved"},{"type":"storyline","key":"seal","value":15}]},"plain":{"narrative":"你走了上去。什么也没有说。","effects":[{"type":"flag","key":"choose_guard_seal"},{"type":"flag","key":"seal_resolved"}]},"bad":{"narrative":"你走到一半停住了。院主等了很久，然后自己走了上去。「不必勉强。」他说，「你还有很长的路。」","effects":[{"type":"flag","key":"seal_resolved"},{"type":"flag","key":"headmaster_sacrificed"},{"type":"demon","value":18,"source":"guilt","note":"封印室里那半步"}]},"terrible":{"narrative":"你的脚在发抖，抖到走不上去。院主看着你，眼神里没有任何责备——这比责备难受一百倍。他自己走了上去。\n\n石门合上前，他说了最后一句：「活着。这是我给你的最后一课。」","effects":[{"type":"flag","key":"seal_resolved"},{"type":"flag","key":"headmaster_sacrificed"},{"type":"demon","value":30,"source":"guilt","note":"石门合上前他说的那句话"}]}}},{"id":"B","text":"还有第三条路吗","reason":16,"check":{"attr":"wu","difficulty":78},"reasonIf":[{"flag":"su_pill_seen","value":8},{"flag":"pei_ally","value":6}],"outcomes":{"perfect":{"narrative":"你说出了那个想法——用丹霞院地下封的那炉禁丹，改的不是灵根，是灵脉的属性。院主沉默了很久。\n\n「一百二十年前，有个丫头也是这么跟我说的。」他说，「我没让她试。」\n\n他侧身让开了石台。「这次你试。」","effects":[{"type":"flag","key":"seal_resolved"},{"type":"flag","key":"seal_third_way"},{"type":"storyline","key":"seal","value":20},{"type":"storyline","key":"rootSecret","value":30},{"type":"relation","npc":"npc_sumuhan","favor":25,"trust":25,"note":"一百二十年前她说过同样的话"},{"type":"reputation","value":15},{"type":"attr","key":"wu","value":1}]},"good":{"narrative":"你的想法让他停了下来。「或许可行。」他说，「但要时间。」封印又撑了三年——那三年里你把它变成了可行。","effects":[{"type":"flag","key":"seal_resolved"},{"type":"flag","key":"seal_third_way"},{"type":"storyline","key":"seal","value":15},{"type":"reputation","value":10}]},"plain":{"narrative":"他摇头：「想过了。不行。」","effects":[]},"bad":{"narrative":"他听完，只是看着你。「这个法子会死更多人。」","effects":[{"type":"demon","value":6,"source":"guilt"}]},"terrible":{"narrative":"你的想法有个致命的漏洞，而你自己没发现。院主指出来的时候，语气仍然平和。「时间不多了。」他说，「你还要再想吗。」石台上的铭文又暗了一分。","effects":[{"type":"demon","value":12,"source":"guilt","note":"封印室里那个错的法子"}]}}},{"id":"C","text":"让他留下","reason":-8,"outcomes":{"fixed":{"narrative":"你退了一步。\n\n院主点了点头，什么也没说。他走上石台的背影很直，白衣在暗下去的光里显得很淡。\n\n石门合上之前，他回头看了你一眼。你这辈子都会记得那一眼——里面什么都没有。没有责备，没有失望，也没有原谅。就是很平静地看了你一眼，然后转过身去。","effects":[{"type":"flag","key":"seal_resolved"},{"type":"flag","key":"headmaster_sacrificed"},{"type":"demon","value":25,"source":"guilt","note":"石门合上前院主回头的那一眼"},{"type":"attr","key":"xin","value":-1}]}}}]},{"id":"evt_root_breakthrough","category":"storyline","weight":40,"scene":"scene_danxia","actors":["npc_sumuhan","npc_yesusu"],"cooldown":999,"important":true,"conditions":{"role":["student"],"storyline":{"rootSecret":{"unlocked":true,"minProgress":88}},"notFlags":["root_resolved"]},"seed":"丹房里三个人。苏暮寒把最后一味药引投进炉子，叶素素抱着那只白色的小兽站在一边——小兽的血是引子里最关键的一味，它自己走过来把爪子伸了出去。\n\n「一百二十年前那一炉，」苏暮寒盯着火，「我用错了引子。用的是人的。」\n\n炉子开始响了。她转头看你：「最后一步得有人推。推坏了，这条路就再没人敢走了。」","facts":["改灵根的丹快要成了","最后一步需要你来推","失败则此路永绝"],"options":[{"id":"A","text":"推","reason":12,"check":{"attr":"wu","difficulty":72},"outcomes":{"perfect":{"narrative":"你的手按在炉壁上。三个人的灵力汇在一处，炉盖弹开的那一刻，整间丹房白得看不见东西。\n\n等你能看清时，炉里躺着九枚丹。苏暮寒拿起一枚，手在抖——一百二十年来第一次。\n\n「成了。」她说。就两个字，说完就哭了。","effects":[{"type":"flag","key":"root_barrier_broken"},{"type":"flag","key":"root_resolved"},{"type":"storyline","key":"rootSecret","value":20},{"type":"relation","npc":"npc_sumuhan","favor":30,"trust":30,"bond":25,"note":"你和她一起成了那一炉丹","openRomance":true},{"type":"relation","npc":"npc_yesusu","favor":20,"bond":20},{"type":"reputation","value":25},{"type":"attr","key":"wu","value":1}]},"good":{"narrative":"成了三枚。不多，但足够证明这条路走得通。苏暮寒把其中一枚收进了怀里，另外两枚她说要送去论道大会上当众验。","effects":[{"type":"flag","key":"root_barrier_broken"},{"type":"flag","key":"root_resolved"},{"type":"storyline","key":"rootSecret","value":12},{"type":"relation","npc":"npc_sumuhan","favor":20,"trust":22,"bond":15},{"type":"reputation","value":15}]},"plain":{"narrative":"炉子熄了，什么也没炼出来。但也没炸。苏暮寒看着炉子说：「再来。」","effects":[{"type":"relation","npc":"npc_sumuhan","favor":8,"trust":10},{"type":"storyline","key":"rootSecret","value":5}]},"bad":{"narrative":"炉子裂了。药全废了。叶素素怀里的小兽虚弱得站不起来，她抱着它蹲在地上，一直在说对不起。","effects":[{"type":"relation","npc":"npc_yesusu","favor":-8},{"type":"flag","key":"root_resolved"},{"type":"demon","value":12,"source":"guilt","note":"丹房里那只废掉的炉子"}]},"terrible":{"narrative":"炉子炸了。\n\n火光把整个丹房吞了。等院里的人赶到，三个人都躺在废墟里。你醒来时是在自己床上，第七天。苏暮寒的丹道废了一半，叶素素的小兽没有了。\n\n没有人责怪你。这比责怪难受。","effects":[{"type":"injury","key":"burn","value":3,"weeks":8},{"type":"relation","npc":"npc_sumuhan","favor":-10,"bond":20},{"type":"relation","npc":"npc_yesusu","favor":-20,"note":"她的小兽没有了"},{"type":"flag","key":"root_resolved"},{"type":"demon","value":30,"source":"guilt","note":"丹房里那声爆炸"}]}}},{"id":"B","text":"让苏暮寒自己来","reason":8,"check":{"attr":"xin","difficulty":40},"outcomes":{"perfect":{"narrative":"你退了半步：「这是你等了一百二十年的东西。」\n\n她愣了一下，然后点了点头，把手按了上去。炉盖弹开时她一个人站在光里，很久没有动。\n\n后来她说，那一刻她想起了十九岁那年那个人的脸。","effects":[{"type":"flag","key":"root_barrier_broken"},{"type":"flag","key":"root_resolved"},{"type":"relation","npc":"npc_sumuhan","favor":25,"trust":30,"bond":22,"note":"你把最后一步让给了她","openRomance":true},{"type":"storyline","key":"rootSecret","value":18},{"type":"reputation","value":12}]},"good":{"narrative":"她推了。成了两枚。","effects":[{"type":"flag","key":"root_barrier_broken"},{"type":"flag","key":"root_resolved"},{"type":"relation","npc":"npc_sumuhan","favor":16,"trust":18},{"type":"reputation","value":8}]},"plain":{"narrative":"她推了，炉子熄了。她说下次。","effects":[{"type":"relation","npc":"npc_sumuhan","favor":6}]},"bad":{"narrative":"她推了，炉子裂了。她蹲在地上收拾碎片，动作跟一百二十年前应该是一样的。","effects":[{"type":"flag","key":"root_resolved"},{"type":"relation","npc":"npc_sumuhan","favor":4,"bond":10},{"type":"demon","value":8,"source":"guilt"}]},"terrible":{"narrative":"她推了，炉子炸了。她挡在你和叶素素前面。\n\n她在丹霞院躺了半年。醒来的第一句话是问那炉丹怎么样了。","effects":[{"type":"flag","key":"root_resolved"},{"type":"relation","npc":"npc_sumuhan","favor":10,"bond":25},{"type":"demon","value":20,"source":"guilt","note":"她挡在你前面的那一下"}]}}},{"id":"C","text":"叫停。这东西不该出世","reason":-6,"outcomes":{"fixed":{"narrative":"你说了「停」。\n\n苏暮寒的手停在半空。她转过头看你，等一个理由。你说了。她听完，很久没有说话，然后伸手把炉火灭了。\n\n「你说得对。」她说。但那天之后，她再没跟你说过一句关于丹道的话。","effects":[{"type":"flag","key":"root_resolved"},{"type":"flag","key":"root_sealed"},{"type":"relation","npc":"npc_sumuhan","favor":-15,"trust":8,"note":"你叫停了那一炉丹"},{"type":"attr","key":"xin","value":1},{"type":"demon","value":8,"source":"guilt","note":"那盆被你浇灭的炉火"}]}}}]},{"id":"evt_graduation_choice","category":"fixed","weight":50,"scene":"scene_main_plaza","actors":["npc_guchangqing"],"cooldown":999,"important":true,"conditions":{"role":["student"],"year":[5],"month":[6],"notFlags":["graduation_chosen"]},"seed":"毕业典礼前三天，顾长青把你叫到剑渊院。他把三份文书推过来：一份是宗门的招揽，一份是世家的聘书，还有一份是学院的留任函。\n\n「五年了。」他说，「选吧。」他给自己倒了杯茶，「选完就别回头。回头的人，我见过太多。」","facts":["毕业在即，需要选择去向","顾长青把三份文书都摆在了你面前"],"options":[{"id":"A","text":"留院任教","reason":12,"outcomes":{"fixed":{"narrative":"你按住了留任函。顾长青看了很久，然后笑了——你从没见他笑过。\n\n「当年我也是这么按的。」他说。","effects":[{"type":"flag","key":"choose_stay_teach"},{"type":"flag","key":"graduation_chosen"},{"type":"relation","npc":"npc_guchangqing","favor":20,"trust":20,"note":"你选了留院"},{"type":"reputation","value":6}]}}},{"id":"B","text":"入宗门，去外面闯","reason":10,"outcomes":{"fixed":{"narrative":"你拿起了宗门那份。他点点头，没有意外。\n\n「出去了别丢云霄的脸。」他说完就摆手让你走。你走到门口时听见他补了一句，声音很轻：「照顾好自己。」","effects":[{"type":"flag","key":"choose_sect"},{"type":"flag","key":"graduation_chosen"},{"type":"relation","npc":"npc_guchangqing","favor":12},{"type":"reputation","value":4}]}}},{"id":"C","text":"哪个都不选，自己走","reason":6,"outcomes":{"fixed":{"narrative":"你把三份文书都推了回去。\n\n他看着你，很久，然后把茶喝完了。「行。」他说，「这条路最难走。」他站起来，从架子上取下一柄旧剑放在桌上，「拿着。别问为什么。」","effects":[{"type":"flag","key":"choose_rogue"},{"type":"flag","key":"graduation_chosen"},{"type":"relation","npc":"npc_guchangqing","favor":15,"awe":8,"note":"他把自己的旧剑给了你"},{"type":"attr","key":"ji","value":1}]}}},{"id":"D","text":"问他当年是怎么选的","reason":14,"check":{"attr":"shi","difficulty":55},"outcomes":{"perfect":{"narrative":"他沉默了很久，久到茶都凉了。\n\n「我当年选了宗门。」他说，「走到半路，有个人死了。我就回来了。」他把杯子放下，「所以我没资格劝你。我只能告诉你——不管选哪个，都会有你后悔的那一天。要紧的是后悔完了还能不能接着走。」\n\n这是他这辈子对你说过最长的一段话。","effects":[{"type":"relation","npc":"npc_guchangqing","favor":25,"trust":25,"bond":20,"note":"他说了当年那件事"},{"type":"attr","key":"xin","value":1},{"type":"storyline","key":"exHead","value":8},{"type":"demon","value":-10,"source":"clear"}]},"good":{"narrative":"「宗门。」他说，「后来回来了。」就这两句。","effects":[{"type":"relation","npc":"npc_guchangqing","favor":12,"trust":10}]},"plain":{"narrative":"他没回答，只是把文书往前推了推。","effects":[]},"bad":{"narrative":"「问这个做什么。」他说，「选你自己的。」","effects":[{"type":"relation","npc":"npc_guchangqing","favor":-3}]},"terrible":{"narrative":"他的脸沉了下来。「有些事不该问。」茶碗放在桌上的那一声很重。","effects":[{"type":"relation","npc":"npc_guchangqing","favor":-10}]}}}]},{"id":"evt_tower_high_floor","category":"trial","weight":26,"scene":"scene_trial_tower","actors":[],"cooldown":12,"conditions":{"role":["student"],"minWeek":30},"variants":[{"seed":"试炼塔第七层。\n\n这一层没有妖兽，没有机关，只有一面墙。墙上映出你自己的样子——但那个样子比你现在强，强得多。\n\n它抬起手，用的是你还没学会的招式。\n\n塔灵的声音从头顶传来：「胜过三年后的你，方可上行。」","facts":["试炼塔第七层的对手是三年后的自己"]},{"seed":"试炼塔第九层是一间空屋。\n\n屋里有一张桌子，桌上摆着你此刻最需要的东西——修为、丹药、功法，一样不少，全是真的。\n\n门在你身后关上了。塔灵说：「拿一样，即刻出塔，此层算过。」\n\n「或者什么都不拿，往上走。」","facts":["试炼塔第九层：拿一样就算过关，或者空手往上"]}],"options":[{"id":"A","text":"硬闯","reason":4,"check":{"attr":"gen","difficulty":68},"outcomes":{"perfect":{"narrative":"你打了很久，久到自己都记不清打了多少招。\n\n最后那一下是你从没用过的——不是学来的，是当场想出来的。\n\n墙上的影子碎了。塔灵说了句在记载里从没出现过的话：「你比三年后的你，早了三年。」","effects":[{"type":"exp","value":250},{"type":"attr","key":"gen","value":1},{"type":"contribution","value":120},{"type":"reputation","value":5},{"type":"flag","key":"tower_floor","value":9}]},"good":{"narrative":"你赢了，赢得很险。躺在地上喘了半个时辰才爬起来。","effects":[{"type":"exp","value":150},{"type":"contribution","value":70},{"type":"injury","key":"wound","value":1,"weeks":1}]},"plain":{"narrative":"打了个平手。塔灵放你过了，但没有说什么。","effects":[{"type":"exp","value":70},{"type":"contribution","value":30}]},"bad":{"narrative":"你输了。被弹出塔外时，塔门在你身后合上。","effects":[{"type":"injury","key":"wound","value":1,"weeks":2},{"type":"demon","value":5,"source":"inferior"}]},"terrible":{"narrative":"你输得很惨。\n\n最后一击落下时，那个「三年后的你」在你耳边说了一句话——用的是你自己的声音。\n\n那句话你后来做梦都会听见。","effects":[{"type":"injury","key":"internal","value":2,"weeks":4},{"type":"demon","value":14,"source":"inferior","note":"塔里那个用你的声音说话的东西"}]}}},{"id":"B","text":"退下来，先补足了再上","reason":14,"check":{"attr":"xin","difficulty":35},"outcomes":{"perfect":{"narrative":"你转身下了塔。\n\n下面的执事看了记录，说了句：「第七层退下来的，一百个里有九十九个不会再上来。」\n\n三个月后你上来了。这一次你赢得很干净。","effects":[{"type":"exp","value":180},{"type":"attr","key":"xin","value":1},{"type":"contribution","value":90},{"type":"demon","value":-6,"source":"clear"}]},"good":{"narrative":"你退了，补了三个月，再上来时过了。","effects":[{"type":"exp","value":100},{"type":"contribution","value":50}]},"plain":{"narrative":"你退了下来。这一层的记录停在了那里。","effects":[{"type":"exp","value":20}]},"bad":{"narrative":"你退下来之后就一直没再上去。","effects":[{"type":"demon","value":4,"source":"inferior"}]},"terrible":{"narrative":"你退下来的时候，塔灵说了句：「记下了。」\n\n后来每次你进塔，这一层的门都会开得慢一些。","effects":[{"type":"demon","value":8,"source":"inferior","note":"塔灵那句'记下了'"},{"type":"flag","key":"tower_marked"}]}}},{"id":"C","text":"空手往上走","reason":16,"check":{"attr":"xin","difficulty":58},"outcomes":{"perfect":{"narrative":"你一样没拿，径直走向上一层的门。\n\n门开了。\n\n塔灵的声音里第一次有了别的东西：「第七个。一千二百年里，第七个。」\n\n后面几层的路，比记载里描述的要好走很多。","effects":[{"type":"exp","value":220},{"type":"attr","key":"xin","value":1},{"type":"contribution","value":150},{"type":"reputation","value":6},{"type":"demon","value":-10,"source":"clear"},{"type":"flag","key":"tower_pure"}]},"good":{"narrative":"你空手上去了。往上的路依然难走，但你走得比以前稳。","effects":[{"type":"exp","value":130},{"type":"contribution","value":70},{"type":"demon","value":-5,"source":"clear"}]},"plain":{"narrative":"你空手上了一层，然后就撑不住了。","effects":[{"type":"exp","value":50}]},"bad":{"narrative":"你在门口犹豫了很久，最后还是拿了一样。\n\n门开了，但塔灵没有说话。","effects":[{"type":"exp","value":80},{"type":"item","id":"ningqi_dan","value":2},{"type":"demon","value":4,"source":"guilt"}]},"terrible":{"narrative":"你把桌上的东西全拿了。\n\n门开了——是出塔的门。\n\n塔灵说：「此层已过。」这四个字里没有任何情绪，但你走出塔的时候手心全是汗。","effects":[{"type":"exp","value":60},{"type":"item","id":"ningqi_dan","value":4},{"type":"item","id":"pozhang_dan","value":1},{"type":"demon","value":12,"source":"guilt","note":"第九层桌上的东西"}]}}}]},{"id":"evt_quest_gone_wrong","category":"trial","weight":28,"scene":"scene_wild_hunt","actors":[],"cooldown":14,"important":true,"conditions":{"role":["student"],"minWeek":26},"seed":"任务出了岔子。\n\n本该是护送一批药材，结果在外域边缘撞上了一群不该出现在这个季节的妖兽。\n\n同行的三个人里，一个断了腿，一个在流血，还有一个不见了。\n\n药材还在车上。伤员走不快。天要黑了。","facts":["护送任务遭遇妖兽","一人断腿一人流血一人失踪","天要黑了，伤员走不快"],"options":[{"id":"A","text":"先找失踪的那个","reason":12,"check":{"attr":"shen","difficulty":62},"outcomes":{"perfect":{"narrative":"你顺着一道很淡的血痕找了过去——那道痕迹只有半尺，别人都没看见。\n\n人卡在一处石缝里，昏着，但活着。\n\n四个人一个不少地回了山。药材丢了大半，但执事看完记录只说了一句：「人齐就好。」","effects":[{"type":"reputation","value":8},{"type":"contribution","value":80},{"type":"attr","key":"shen","value":1},{"type":"flag","key":"quest_all_returned"}]},"good":{"narrative":"你找到了人。药材损失了一半。","effects":[{"type":"reputation","value":4},{"type":"contribution","value":40},{"type":"flag","key":"quest_all_returned"}]},"plain":{"narrative":"找了两个时辰，人自己走回来了。","effects":[{"type":"contribution","value":20}]},"bad":{"narrative":"没找到。天黑了，你只能先带伤员走。\n\n那个人三天后自己回来了，但一条胳膊废了。","effects":[{"type":"contribution","value":-20},{"type":"demon","value":8,"source":"guilt"}]},"terrible":{"narrative":"你找人的时候，妖兽回来了。\n\n断腿的那个没能跑掉。\n\n后来清点的时候，四个人回来了两个。","effects":[{"type":"contribution","value":-60},{"type":"reputation","value":-6},{"type":"demon","value":20,"source":"death","note":"那次没能带回来的两个人"}]}}},{"id":"B","text":"先把伤员送出去","reason":14,"check":{"attr":"gen","difficulty":52},"outcomes":{"perfect":{"narrative":"你背着断腿的那个走了一夜山路，另一个搀着。\n\n天亮时你们出了外域。\n\n失踪的那个是三天后回来的——他自己找到了路，只是崴了脚。\n\n断腿那个后来跟人说：「我记得他一句话没说，走了一整夜。」","effects":[{"type":"reputation","value":8},{"type":"contribution","value":70},{"type":"attr","key":"gen","value":1},{"type":"flag","key":"quest_all_returned"}]},"good":{"narrative":"伤员保住了。失踪那个第二天回来了。","effects":[{"type":"reputation","value":5},{"type":"contribution","value":45},{"type":"injury","key":"exhaust","value":1,"weeks":1}]},"plain":{"narrative":"你把伤员带了出去。失踪的那个再没有消息。","effects":[{"type":"contribution","value":25},{"type":"demon","value":8,"source":"death"}]},"bad":{"narrative":"路上又遇到了一波。你护着两个人硬闯出去，自己伤得最重。","effects":[{"type":"injury","key":"wound","value":2,"weeks":3},{"type":"contribution","value":20}]},"terrible":{"narrative":"你背的那个在半路上就不行了。\n\n他一直没说话，你以为他在睡。等到出了外域你把他放下来，才发现已经凉了。","effects":[{"type":"reputation","value":-4},{"type":"demon","value":22,"source":"death","note":"你背了一夜的那个人"}]}}},{"id":"C","text":"保药材。任务是任务","reason":-10,"check":{"attr":"shi","difficulty":48},"outcomes":{"perfect":{"narrative":"你把药材原封不动地送到了。\n\n执事很满意，赏格给到了最高一档。\n\n伤员是第二天被别的队伍带回来的。失踪那个没有回来。\n\n领赏那天，断腿的那个坐在门口看着你，一句话没说。","effects":[{"type":"stone","value":500},{"type":"contribution","value":120},{"type":"reputation","value":-3},{"type":"demon","value":15,"source":"guilt","note":"领赏那天坐在门口的那个人"}]},"good":{"narrative":"药材保住了。人也大致都回来了，只是伤得不轻。","effects":[{"type":"stone","value":300},{"type":"contribution","value":70},{"type":"demon","value":8,"source":"guilt"}]},"plain":{"narrative":"药材保住了一半，人也回来了大半。","effects":[{"type":"stone","value":120},{"type":"contribution","value":30},{"type":"demon","value":5,"source":"guilt"}]},"bad":{"narrative":"药材和人都没保住。这一趟白跑了。","effects":[{"type":"contribution","value":-40},{"type":"demon","value":12,"source":"guilt"}]},"terrible":{"narrative":"你护着车走的时候，身后传来了声音。\n\n你没有回头。\n\n药材完好无损地送到了。这件事后来在弟子里传了很久，传的版本不止一个，但每个版本里你都没有回头。","effects":[{"type":"stone","value":500},{"type":"contribution","value":100},{"type":"reputation","value":-12},{"type":"flag","key":"abandoned_teammates"},{"type":"demon","value":25,"source":"guilt","note":"你没有回头的那一次"}]}}}]},{"id":"evt_beast_tide","category":"crisis","weight":22,"scene":"scene_mountain_gate","actors":["npc_guchangqing"],"cooldown":999,"important":true,"conditions":{"role":["student"],"minWeek":100,"notFlags":["beast_tide_done"]},"seed":"妖潮来了。\n\n百年一遇。山门的钟连响了九下——上一次响九下是三百年前。\n\n顾长青在广场上点人：金丹以上守山门，筑基守二道禁制，练气的全部撤到后山。\n\n点到你的时候他停了一下。\n\n他知道你的境界，也知道你的名字。\n\n「你自己选。」他说。这四个字他这辈子没对弟子说过。","facts":["百年一遇的妖潮来了","顾长青让你自己选去哪一线"],"options":[{"id":"A","text":"上山门","reason":6,"check":{"attr":"gen","difficulty":72},"outcomes":{"perfect":{"narrative":"你在山门上守了三天三夜。\n\n第三天夜里禁制破了一道口子，你堵在那儿撑了半炷香，撑到顾长青赶过来。\n\n他把你拎到后面的时候骂了一句：「不要命了？」\n\n但事后论功，你的名字排在第七——前面六个全是金丹。","effects":[{"type":"reputation","value":20},{"type":"contribution","value":300},{"type":"exp","value":400},{"type":"attr","key":"gen","value":1},{"type":"relation","npc":"npc_guchangqing","favor":20,"awe":10,"note":"妖潮那三天，你堵在破口上"},{"type":"injury","key":"wound","value":2,"weeks":4},{"type":"flag","key":"beast_tide_done"},{"type":"flag","key":"tide_hero"}]},"good":{"narrative":"你守住了自己那一段。三天后妖潮退了。","effects":[{"type":"reputation","value":12},{"type":"contribution","value":180},{"type":"exp","value":250},{"type":"injury","key":"wound","value":2,"weeks":3},{"type":"flag","key":"beast_tide_done"}]},"plain":{"narrative":"你在山门上撑了一天就被换了下来。","effects":[{"type":"reputation","value":4},{"type":"contribution","value":80},{"type":"exp","value":100},{"type":"injury","key":"wound","value":1,"weeks":2},{"type":"flag","key":"beast_tide_done"}]},"bad":{"narrative":"你伤得太重，第一天就下来了。躺了两个月。","effects":[{"type":"injury","key":"internal","value":3,"weeks":8},{"type":"contribution","value":40},{"type":"flag","key":"beast_tide_done"},{"type":"demon","value":8,"source":"inferior"}]},"terrible":{"narrative":"你倒在山门上。\n\n有人把你拖了回去——是你身边那个你叫不出名字的师兄。他把你拖到安全的地方，转身又上去了。\n\n他没有再下来。","effects":[{"type":"injury","key":"internal","value":3,"weeks":10},{"type":"flag","key":"beast_tide_done"},{"type":"demon","value":22,"source":"death","note":"把你拖回来又转身上去的那个人"}]}}},{"id":"B","text":"守二道禁制","reason":14,"check":{"attr":"shen","difficulty":55},"outcomes":{"perfect":{"narrative":"二道禁制是符箓院布的，但符阵的节点有一处算错了——你在第一天就看出来了。\n\n你带着人重新调了三个节点。\n\n第二天妖潮冲上来的时候，那三个节点撑住了整条防线。事后符箓院首亲自来问你是怎么看出来的。","effects":[{"type":"reputation","value":15},{"type":"contribution","value":250},{"type":"exp","value":300},{"type":"attr","key":"shen","value":1},{"type":"flag","key":"beast_tide_done"},{"type":"flag","key":"tide_hero"}]},"good":{"narrative":"禁制守住了。你在这一线出了不少力。","effects":[{"type":"reputation","value":8},{"type":"contribution","value":150},{"type":"exp","value":180},{"type":"flag","key":"beast_tide_done"}]},"plain":{"narrative":"禁制守住了。你做的事不多不少。","effects":[{"type":"contribution","value":80},{"type":"exp","value":100},{"type":"flag","key":"beast_tide_done"}]},"bad":{"narrative":"禁制破了一道。你和几个人被冲散，在山里躲了一夜。","effects":[{"type":"injury","key":"wound","value":1,"weeks":2},{"type":"contribution","value":30},{"type":"flag","key":"beast_tide_done"}]},"terrible":{"narrative":"你负责的那个节点崩了。\n\n后来查下来，是你调节点的时候动错了一处。\n\n没有人怪你——那种情况下谁都可能出错。但那道口子里冲进来的东西，伤了十一个人。","effects":[{"type":"reputation","value":-8},{"type":"contribution","value":-50},{"type":"flag","key":"beast_tide_done"},{"type":"demon","value":18,"source":"guilt","note":"你调错的那个节点"}]}}},{"id":"C","text":"去后山，照看撤下来的人","reason":12,"check":{"attr":"xin","difficulty":45},"outcomes":{"perfect":{"narrative":"后山挤了两百多个练气期的弟子，大半是新生，怕得发抖。\n\n你把他们编了组，分了活——烧水的、包扎的、传消息的、看着最小那几个的。\n\n三天里后山没有出一件乱子。\n\n妖潮退后，那两百多个人里有很多人记住了你的名字。有些人一辈子都记得。","effects":[{"type":"reputation","value":14},{"type":"contribution","value":200},{"type":"attr","key":"xin","value":1},{"type":"flag","key":"beast_tide_done"},{"type":"flag","key":"tide_shelter"},{"type":"demon","value":-8,"source":"clear"}]},"good":{"narrative":"后山秩序还算好。你忙了三天，没合过眼。","effects":[{"type":"reputation","value":8},{"type":"contribution","value":120},{"type":"flag","key":"beast_tide_done"}]},"plain":{"narrative":"后山乱了一阵，但没出大事。","effects":[{"type":"contribution","value":60},{"type":"flag","key":"beast_tide_done"}]},"bad":{"narrative":"有几个新生跑了出去。找回来的时候少了一个。","effects":[{"type":"contribution","value":20},{"type":"flag","key":"beast_tide_done"},{"type":"demon","value":10,"source":"guilt"}]},"terrible":{"narrative":"妖兽绕过了防线，摸到了后山。\n\n你挡在最前面，但你的境界挡不住。\n\n最后是顾长青赶到的。他到的时候，后山已经有七个人躺在地上。","effects":[{"type":"injury","key":"wound","value":3,"weeks":6},{"type":"flag","key":"beast_tide_done"},{"type":"demon","value":20,"source":"death","note":"后山地上躺着的那七个人"}]}}},{"id":"D","text":"问他：你希望我去哪","reason":10,"check":{"attr":"shi","difficulty":50},"outcomes":{"perfect":{"narrative":"顾长青看了你很久。\n\n「三百年前那次，」他忽然说，「我也问过我师父这句话。」\n\n「他怎么说。」\n\n「他说：去你死了之后，最不后悔的地方。」\n\n他把手放在你肩上——这是他第一次碰你：「现在这句话给你。」\n\n你去了山门。三天后你还活着，而且你确实不后悔。","effects":[{"type":"relation","npc":"npc_guchangqing","favor":25,"trust":20,"bond":15,"note":"他把师父给他的那句话给了你"},{"type":"reputation","value":16},{"type":"contribution","value":250},{"type":"exp","value":300},{"type":"injury","key":"wound","value":2,"weeks":4},{"type":"flag","key":"beast_tide_done"},{"type":"flag","key":"tide_hero"},{"type":"attr","key":"xin","value":1}]},"good":{"narrative":"他指了二道禁制：「去那儿。别逞强。」\n\n你去了，守住了。","effects":[{"type":"relation","npc":"npc_guchangqing","favor":12},{"type":"reputation","value":8},{"type":"contribution","value":150},{"type":"exp","value":200},{"type":"flag","key":"beast_tide_done"}]},"plain":{"narrative":"他说：「后山。」\n\n你去了后山。","effects":[{"type":"contribution","value":80},{"type":"flag","key":"beast_tide_done"}]},"bad":{"narrative":"「我说了你自己选。」他转身走了。\n\n你在广场上站了很久，最后跟着大队去了后山。","effects":[{"type":"relation","npc":"npc_guchangqing","favor":-5},{"type":"contribution","value":50},{"type":"flag","key":"beast_tide_done"},{"type":"demon","value":5,"source":"inferior"}]},"terrible":{"narrative":"你问得像在推卸。\n\n他盯着你看了三息，然后说：「后山。」\n\n那两个字里的东西你听懂了。三天后论功的时候，他没有看你。","effects":[{"type":"relation","npc":"npc_guchangqing","favor":-12,"awe":-8},{"type":"contribution","value":30},{"type":"reputation","value":-4},{"type":"flag","key":"beast_tide_done"},{"type":"demon","value":10,"source":"inferior"}]}}}]},{"id":"evt_realm_fortune","category":"trial","weight":24,"scene":"scene_secret_realm","actors":[],"cooldown":16,"conditions":{"role":["student"],"minWeek":34},"variants":[{"seed":"秘境深处有一间石室。\n\n室中有一具枯坐的骸骨，面前摊着一部功法。骨头上没有伤，衣服也是整齐的——这个人是坐着走的。\n\n功法的最后一页写着一行小字：「后来者，取此书须应一诺：不得以此伤同门。」\n\n没有别的条件。也没有人监督。","facts":["秘境深处的功法要求立一个无人监督的誓"]},{"seed":"你在一处崖壁上发现了刻字。\n\n刻得很深，是用指力划的：「吾道不孤」。四个字下面还有一行更小的，被风蚀了大半，只剩下「……悔」。\n\n刻字旁边有一个石龛，里面放着一枚玉简。","facts":["崖壁上的刻字：'吾道不孤'，下面残缺的一个'悔'字","旁边石龛里有一枚玉简"]}],"options":[{"id":"A","text":"应下这个誓，取书","reason":14,"check":{"attr":"xin","difficulty":40},"outcomes":{"perfect":{"narrative":"你对着那具骸骨行了个礼，把誓言念了一遍——念得很慢，一个字一个字。\n\n骸骨没有动。但功法在你手里的时候，你觉得它比刚才轻了。\n\n那部功法你后来练了很多年。每次运功到第七转，你都会想起那间石室。","effects":[{"type":"technique","id":"wuxiang_jing"},{"type":"exp","value":200},{"type":"attr","key":"xin","value":1},{"type":"flag","key":"realm_oath"},{"type":"demon","value":-8,"source":"clear"}]},"good":{"narrative":"你应了誓，取了书。","effects":[{"type":"technique","id":"wuxiang_jing"},{"type":"exp","value":120},{"type":"flag","key":"realm_oath"}]},"plain":{"narrative":"书取到了。誓也念了，但念得有点敷衍。","effects":[{"type":"technique","id":"wuxiang_jing"},{"type":"exp","value":60}]},"bad":{"narrative":"你伸手的时候书化成了灰。\n\n大概是誓念得不诚。","effects":[{"type":"exp","value":30},{"type":"demon","value":5,"source":"guilt"}]},"terrible":{"narrative":"书到手了。\n\n但走出石室时你回头看了一眼——那具骸骨的姿势变了。\n\n只变了一点点：原本垂着的手，现在指着门口。","effects":[{"type":"technique","id":"wuxiang_jing"},{"type":"exp","value":80},{"type":"demon","value":15,"source":"repress","note":"石室里那具改了姿势的骸骨"}]}}},{"id":"B","text":"不取。这书不该动","reason":10,"check":{"attr":"xin","difficulty":45},"outcomes":{"perfect":{"narrative":"你把书按原样放好，行了个礼，退了出去。\n\n出秘境的时候你身上什么也没多。\n\n但那天夜里打坐，你忽然通了一处困了半年的关窍。\n\n你不知道这两件事有没有关系。","effects":[{"type":"exp","value":250},{"type":"attr","key":"xin","value":1},{"type":"demon","value":-12,"source":"clear"},{"type":"flag","key":"realm_refrained"}]},"good":{"narrative":"你没有取。走出石室时心里很静。","effects":[{"type":"exp","value":120},{"type":"demon","value":-6,"source":"clear"}]},"plain":{"narrative":"你没有取。仅此而已。","effects":[{"type":"exp","value":40}]},"bad":{"narrative":"你犹豫了很久，最后空手出去了。\n\n后来你听说别人在同一间石室里取走了那部功法。","effects":[{"type":"demon","value":6,"source":"inferior"}]},"terrible":{"narrative":"你退到门口时又折了回来。\n\n手伸出去的那一刻，石室的门关上了。\n\n你在里面待了三天，出来时那部功法还在原处，你什么也没拿走。但你的心魔重了很多。","effects":[{"type":"injury","key":"exhaust","value":1,"weeks":2},{"type":"demon","value":15,"source":"guilt","note":"石室里那三天"}]}}},{"id":"C","text":"取书，但不应誓","reason":-12,"check":{"attr":"ji","difficulty":65},"outcomes":{"perfect":{"narrative":"你什么也没说，把书拿了就走。\n\n没有异变，没有反噬。石室安安静静，那具骸骨还是原来的姿势。\n\n书到手了，一分代价也没付。\n\n只是往后每次翻开这部功法，最后那一页你都会跳过去。","effects":[{"type":"technique","id":"wuxiang_jing"},{"type":"exp","value":150},{"type":"demon","value":10,"source":"guilt","note":"那一页你从来不看的字"}]},"good":{"narrative":"书拿到了。没出什么事。","effects":[{"type":"technique","id":"wuxiang_jing"},{"type":"exp","value":80},{"type":"demon","value":8,"source":"guilt"}]},"plain":{"narrative":"书拿到了。走出秘境时你没有回头。","effects":[{"type":"technique","id":"wuxiang_jing"},{"type":"demon","value":10,"source":"guilt"}]},"bad":{"narrative":"书在你手里烧了起来。\n\n烧完之后石室里什么也没剩下。","effects":[{"type":"injury","key":"burn","value":1,"weeks":2},{"type":"demon","value":12,"source":"guilt"}]},"terrible":{"narrative":"你把书塞进怀里的那一刻，整间石室的温度降了下来。\n\n骸骨的头转了过来。\n\n你是爬出秘境的。书还在怀里，但从那以后，每次你想用这部功法伤人，手都会抖。","effects":[{"type":"technique","id":"wuxiang_jing"},{"type":"injury","key":"internal","value":2,"weeks":4},{"type":"demon","value":25,"source":"guilt","note":"石室里那颗转过来的头"},{"type":"flag","key":"cursed_technique"}]}}}]},{"id":"evt_save_deviation","category":"crisis","weight":24,"scene":"scene_meditation_hall","actors":["npc_shenjinglan"],"cooldown":999,"important":true,"conditions":{"role":["student"],"minWeek":70,"relations":{"npc_shenjinglan":{"favor":[40,100]}}},"seed":"静修室的门是被撞开的。\n\n沈惊澜倒在里面，经脉在皮肤下鼓成一条条青紫的线。他在冲金丹，冲到一半心魔起了——那是北境家书里的期限，是他压了两年的东西。\n\n他还有意识。看见你，他费了很大力气才说出三个字：\n\n「别……进来。」","facts":["沈惊澜冲金丹时走火入魔","他让你别进来"],"options":[{"id":"A","text":"进去，替他护住心脉","reason":12,"check":{"attr":"gen","difficulty":70},"outcomes":{"perfect":{"narrative":"你把自己的灵力渡了过去。\n\n那股乱气顺着两个人的经脉走了三个周天，最后被你压回了他的丹田。\n\n他睁开眼的时候，第一句话是：「我说了别进来。」\n\n第二句是：「……谢谢。」\n\n第三句他说不出来了，因为他哭了。这是你唯一一次见他哭。","effects":[{"type":"relation","favor":30,"trust":30,"bond":35,"note":"静修室那一夜，他哭了"},{"type":"injury","key":"internal","value":2,"weeks":4},{"type":"flag","key":"shen_saved"},{"type":"attr","key":"gen","value":1},{"type":"demon","value":-8,"source":"clear"}]},"good":{"narrative":"你撑到了教习赶来。人救回来了，两个人都伤得不轻。","effects":[{"type":"relation","favor":20,"bond":25,"trust":18},{"type":"injury","key":"internal","value":2,"weeks":4},{"type":"flag","key":"shen_saved"}]},"plain":{"narrative":"你帮不上什么忙，但你挡到了教习赶来。","effects":[{"type":"relation","favor":12,"bond":15},{"type":"injury","key":"wound","value":1,"weeks":2},{"type":"flag","key":"shen_saved"}]},"bad":{"narrative":"你的灵力和他的乱气撞在一起，两个人一起倒下。\n\n是苏暮寒把你们分开的。他保住了命，但金丹废了。","effects":[{"type":"relation","favor":10,"bond":20},{"type":"injury","key":"internal","value":3,"weeks":6},{"type":"flag","key":"shen_crippled"},{"type":"demon","value":18,"source":"guilt"}]},"terrible":{"narrative":"你冲进去的时候，他正在最后一道关口上。\n\n你的介入让那道关口彻底崩了。\n\n他活下来了，但修为退回了练气。北境的人一个月后来接他走的。\n\n走之前他对你说：「不怪你。」这三个字他说了两遍。","effects":[{"type":"relation","favor":5,"bond":25,"trust":10},{"type":"flag","key":"shen_recalled"},{"type":"flag","key":"shen_crippled"},{"type":"demon","value":25,"source":"guilt","note":"他说了两遍的那三个字"}]}}},{"id":"B","text":"去叫人。你不够格插手","reason":14,"check":{"attr":"gen","difficulty":40},"outcomes":{"perfect":{"narrative":"你转身就跑，跑得比这辈子任何时候都快。\n\n顾长青和苏暮寒一起赶到，三针下去，人稳住了。\n\n事后顾长青说：「你要是进去了，现在躺着的就是两个。」 ation","favor":-8,"trust":-6},{"type":"flag","key":"love_su_1"}]}}},{"id":"B","text":"反问她：你为什么每次都不赶我走","reason":10,"check":{"attr":"shi","difficulty":55},"outcomes":{"perfect":{"narrative":"她愣住了。\n\n这是你第一次看见她在一个问题上卡住——她能算出丹方里最细的火候，却答不上这一句。\n\n很久之后她说：「我不知道。」\n\n又过了更久：「我从来没想过这个。」\n\n她把方子推开，第一次正眼看你，看了很长时间。「现在我要想了。」","effects":[{"type":"relation","favor":18,"trust":22,"bond":20,"note":"她说'现在我要想了'","openRomance":true},{"type":"flag","key":"love_su_1"}]},"good":{"narrative":"她想了很久，说：「因为你不吵。」\n\n这大概是她能给出的最高评价。","effects":[{"type":"relation","favor":13,"trust":15,"openRomance":true},{"type":"flag","key":"love_su_1"}]},"plain":{"narrative":"她说：「没想过。」然后就真的不想了。","effects":[{"type":"relation","favor":5},{"type":"flag","key":"love_su_1"}]},"bad":{"narrative":"「要赶吗。」她问得一本正经，「那你走。」\n\n你不确定她是不是在开玩笑。她大概也不是。","effects":[{"type":"relation","favor":-3},{"type":"flag","key":"love_su_1"}]},"terrible":{"narrative":"你的语气让她皱了眉。\n\n「我不擅长这个。」她说，「你要是想听什么话，直接说。我不会猜。」\n\n她说得很平静。你忽然意识到，她是真的不会猜。","effects":[{"type":"relation","favor":-6,"trust":-4},{"type":"flag","key":"love_su_1"}]}}},{"id":"C","text":"什么也不说，替她把火看好","reason":16,"check":{"attr":"wu","difficulty":48},"outcomes":{"perfect":{"narrative":"你没有回答，只是走到炉边，把火调到她惯用的那个高度。\n\n她看着你的手，看了很久。\n\n「你知道我用几分火。」\n\n「看你调过三百多次。」\n\n她没有再问了。那一夜她把方子看完了，你把火守到了天亮。谁也没有再说一句话。\n\n天亮时她说：「明天这个时辰。」","effects":[{"type":"relation","favor":22,"trust":25,"bond":22,"note":"你知道她用几分火","openRomance":true},{"type":"flag","key":"love_su_1"},{"type":"flag","key":"su_night_ritual"},{"type":"attr","key":"wu","value":1}]},"good":{"narrative":"你把火看好了。她没有说什么，但也没有让你走。\n\n那一夜过得很快。","effects":[{"type":"relation","favor":15,"trust":16,"bond":14,"openRomance":true},{"type":"flag","key":"love_su_1"}]},"plain":{"narrative":"火没出岔子。天亮时她说了句「多谢」，然后回房了。","effects":[{"type":"relation","favor":7,"trust":8},{"type":"flag","key":"love_su_1"}]},"bad":{"narrative":"火大了一线。她无声地伸手调回去，什么也没说。\n\n那个「什么也没说」比说什么都难受。","effects":[{"type":"relation","favor":2},{"type":"flag","key":"love_su_1"}]},"terrible":{"narrative":"你把火催过了，一炉半成的药废了。\n\n她盯着炉子看了很久，然后说：「出去。」\n\n只有两个字，但你退到门外时腿都是软的。","effects":[{"type":"relation","favor":-12,"trust":-10},{"type":"flag","key":"love_su_1"},{"type":"demon","value":6,"source":"guilt"}]}}}],"chainNext":{"on":["perfect","good"],"eventId":"evt_love_su_2","delayWeeks":10}},{"id":"evt_love_su_2","category":"romance","chainOnly":true,"chainId":"love_su","scene":"scene_danxia","actors":["npc_sumuhan"],"cooldown":999,"important":true,"conditions":{"role":["student","teacher"]},"seed":"她带你下到了丹霞院地下。\n\n那扇封了一百二十年的门前，她停下来，从袖中取出一把钥匙——钥匙上的铜锈厚得几乎看不出形状。\n\n「我要开了。」她说，「开之前，我得先跟你说一件事。」\n\n她背对着门，声音很稳：\n\n「一百二十年前，我给一个人炼了一炉改灵根的丹。那个人是我的师兄。他喝了。」\n\n「他没有死。他变成了别的东西。」\n\n「我亲手把他封在里面。」","facts":["苏暮寒要打开封了一百二十年的门","门里封着的是她师兄","他喝了她炼的改灵根丹，变成了别的东西"],"options":[{"id":"A","text":"陪她进去","reason":14,"check":{"attr":"xin","difficulty":58},"outcomes":{"perfect":{"narrative":"门开了。\n\n里面比想象中干净。石台上放着一炉早已冷透的丹，旁边有一具东西——不能说是尸体，因为它还在极缓慢地起伏。\n\n她走过去，把手放在它身上，说了句什么。太轻，你没听清。\n\n然后她转过身：「我以为我需要一个人来阻止我。」她的眼睛很红，但没有哭，「结果我需要的是一个人陪我看清楚。」\n\n那一夜你们把整间石室清理干净，重新封好。她把钥匙给了你。","effects":[{"type":"relation","favor":25,"trust":30,"bond":28,"note":"她把那把钥匙给了你"},{"type":"storyline","key":"rootSecret","value":28,"clue":"禁丹残渣"},{"type":"flag","key":"su_door_opened"},{"type":"attr","key":"xin","value":1}]},"good":{"narrative":"门开了。你陪她在里面待了两个时辰。\n\n出来时她说：「谢谢你没有问为什么。」","effects":[{"type":"relation","favor":18,"trust":22,"bond":22},{"type":"storyline","key":"rootSecret","value":18,"clue":"禁丹残渣"},{"type":"flag","key":"su_door_opened"}]},"plain":{"narrative":"门开了一条缝，她又关上了。\n\n「今天不行。」她说。","effects":[{"type":"relation","favor":8,"trust":10},{"type":"storyline","key":"rootSecret","value":6}]},"bad":{"narrative":"开门的时候封印起了反应，一股冷气灌出来。她把你推开了，自己去挡。\n\n门重新封上后她病了半个月。","effects":[{"type":"relation","favor":10,"bond":18},{"type":"injury","key":"internal","value":1,"weeks":2},{"type":"storyline","key":"rootSecret","value":10}]},"terrible":{"narrative":"里面的东西醒了一瞬。\n\n只有一瞬，但那一瞬里你听见了一个声音——很轻，在叫她的名字。\n\n她跪在门口，一动不动，直到那个声音停下来。\n\n重新 独问，才知道是为了替对方出头才打起来的——荒唐，但也让人说不出重话。你把处罚减了一半，两个人从此再没红过脸。","effects":[{"type":"reputation","value":4},{"type":"attr","key":"jiao","value":1}]},"good":{"narrative":"场面压住了，事后也问明白了。","effects":[{"type":"reputation","value":2}]},"plain":{"narrative":"罚了，也问了。谁也没真服。","effects":[]},"bad":{"narrative":"你罚重了。两个弟子低着头受了，但眼神里的东西你看得懂。","effects":[{"type":"reputation","value":-1}]},"terrible":{"narrative":"你当众下手太重，一个弟子当场吐了血。别院那位教习什么也没说，转身走了——但这事第二天就传遍了。","effects":[{"type":"reputation","value":-6},{"type":"demon","value":8,"source":"guilt","note":"练功场上那一下"}]}}},{"id":"B","text":"先问清楚谁先动的手","reason":12,"check":{"attr":"ren","difficulty":48},"outcomes":{"perfect":{"narrative":"你没有急着罚人。问到第三个证人时才弄清楚：先动手的那个，是因为另一个在背后编排他家里的事。你处置得很清楚，两边都心服。","effects":[{"type":"reputation","value":5},{"type":"attr","key":"ren","value":1}]},"good":{"narrative":"问明白了，处置也算公道。","effects":[{"type":"reputation","value":3}]},"plain":{"narrative":"各执一词，问不出结果。你只好各打五十大板。","effects":[]},"bad":{"narrative":"你问了半天，围观的人越来越多。这场面本身就已经是丢人了。","effects":[{"type":"reputation","value":-3}]},"terrible":{"narrative":"你信了错的那一方。真相三个月后才浮出来，那时被冤枉的那个弟子已经转投别的教习了。","effects":[{"type":"reputation","value":-5},{"type":"demon","value":10,"source":"guilt","note":"你判错的那一次"}]}}},{"id":"C","text":"把两个人一起罚去藏经阁抄书三个月","reason":10,"outcomes":{"fixed":{"narrative":"你把两个人一起丢进藏经阁，抄同一部书，坐同一张案。第一个月他们谁也不理谁。第二个月开始换纸。第三个月出来时，两个人是一起来谢的。云舒说，抄书这法子她见了三百年，管用。","effects":[{"type":"reputation","value":3},{"type":"relation","npc":"npc_yunshu","favor":8},{"type":"attr","key":"jiao","value":1}]}}}]},{"id":"evt_disciple_pressure","category":"teach","weight":30,"scene":"scene_jianyuan","actors":[],"cooldown":12,"important":true,"conditions":{"role":["teacher"],"minWeek":14},"seed":"有个弟子这几天不太对。上课时眼睛是空的，练功时手在抖，你叫他名字要叫两遍才应。今天散课后他没走，站在门口，像是有话说又不敢说。","facts":["有弟子状态明显不对","他站在门口没走"],"options":[{"id":"A","text":"让他坐下，慢慢说","reason":16,"check":{"attr":"jiao","difficulty":38},"outcomes":{"perfect":{"narrative":"你给他倒了杯茶，什么也没问。他捧着杯子坐了一炷香，然后开始说——说的是家里，是排名，是他觉得自己撑不住了。说完他自己也愣了，好像没想到能说这么多。你只说了一句：「那就慢一点。」","effects":[{"type":"attr","key":"jiao","value":1},{"type":"reputation","value":3},{"type":"flag","key":"relieved_disciple"},{"type":"demon","value":-4,"source":"clear"}]},"good":{"narrative":"他说了一些。压力松了一半。","effects":[{"type":"flag","key":"relieved_disciple"}]},"plain":{"narrative":"他说没事，然后走了。","effects":[]},"bad":{"narrative":"你说的话没说到点子上。他谢了你，走了，肩膀还是塌着。","effects":[]},"terrible":{"narrative":"你无意中说了句「你师兄比你难多了」。他站起来说了声「弟子知道了」，从此再没单独找过你。","effects":[{"type":"demon","value":6,"source":"guilt","note":"那句'你师兄比你难多了'"}]}}},{"id":"B","text":"让他去歇一个月，功课先放着","reason":14,"outcomes":{"fixed":{"narrative":"你把他这个月的功课全免了，让他下山住几天。他愣住了：「那我的进度……」你说进度是给活人排的。他走的时候回头看了你一眼。一个月后回来，人是松的。","effects":[{"type":"flag","key":"relieved_disciple"},{"type":"attr","key":"de","value":1},{"type":"reputation","value":2}]}}},{"id":"C","text":"告诉他修行本就苦，熬过去就好","reason":-12,"outcomes":{"fixed":{"narrative":"你说了一番很正确的话。他听完，点了点头，说弟子明白了，然后走了。\n\n背影挺得很直。\n\n那之后他确实再没提过。","effects":[{"type":"flag","key":"ignored_pressure"},{"type":"demon","value":6,"source":"guilt","note":"他站在门口那次，你说了很正确的话"}]}}}]},{"id":"evt_peer_politics","category":"teach","weight":26,"scene":"scene_baiyi","actors":["npc_zhonglihen"],"cooldown":15,"conditions":{"role":["teacher"],"minWeek":24},"variants":[{"seed":"钟离衡请你喝茶。茶过三巡他才把话引到正题上：下季的教务会上，有人要提一个对百艺院很不利的案子。他说他不表态，只是「觉得你该知道」。然后他就不说了，等着你接。","facts":["钟离衡透露了一个不利于某院的提案","他在等你表态"]},{"seed":"教务会上争执起来。一边是要削减选修课时数的，一边是坚决反对的。两边都在看你——你是这场里唯一没表过态的人。","facts":["教务会争执不下","所有人都在等你表态"]}],"options":[{"id":"A","text":"支持传统一方","reason":6,"check":{"attr":"sheng","difficulty":45},"outcomes":{"perfect":{"narrative":"你说的话不多，但每一句都踩在点上。顾长青破天荒地点了下头。事后传统一派的几位教习主动来找你说话。","effects":[{"type":"faction","key":"traditional","value":15},{"type":"relation","npc":"npc_guchangqing","favor":12,"awe":5},{"type":"reputation","value":4},{"type":"attr","key":"sheng","value":1}]},"good":{"narrative":"你的立场被接受了。","effects":[{"type":"faction","key":"traditional","value":10},{"type":"relation","npc":"npc_guc ","effects":[{"type":"reputation","value":-2}]},"terrible":{"narrative":"你的数据被断章取义，成了对方的弹药。散会后你才反应过来——钟离衡从一开始就是要你去说这番话的。","effects":[{"type":"reputation","value":-4},{"type":"relation","npc":"npc_zhonglihen","awe":15,"trust":-8},{"type":"demon","value":7,"source":"grudge","npc":"npc_zhonglihen","note":"被当刀使的那次教务会"}]}}}]},{"id":"evt_head_selection","category":"teach","weight":45,"scene":"scene_main_plaza","actors":["npc_guchangqing","npc_sumuhan"],"cooldown":999,"important":true,"conditions":{"role":["teacher"],"minWeek":60,"reputation":[62,100],"notFlags":["became_head","head_bid_done"]},"seed":"院首选拔的通告贴出来了。天机院首告老，位子空着。有资格递名帖的一共四个人，你是其中之一。\n\n方砚把名册送到你手里时多说了一句：「递不递，今晚就得定。」","facts":["院首选拔开始，你有资格竞争","今晚必须决定递不递名帖"],"options":[{"id":"A","text":"以政绩服人","reason":12,"check":null,"fixedGrade":"good","outcomes":{"good":{"narrative":"你把这些年的东西整理成册递了上去——课时、弟子去向、著述、院务。厚厚一摞，没有一句自夸的话。","effects":[{"type":"flag","key":"head_bid_done"},{"type":"flag","key":"head_bid_approach","value":"merit"}]}}},{"id":"B","text":"先去拜访几位关键的同僚","reason":8,"check":null,"fixedGrade":"good","outcomes":{"good":{"narrative":"你花了三个晚上，走了五家门。有人开门，有人没开。","effects":[{"type":"flag","key":"head_bid_done"},{"type":"flag","key":"head_bid_approach","value":"ally"},{"type":"faction","key":"pragmatic","value":8}]}}},{"id":"C","text":"在名帖上写下你要做的改革","reason":4,"check":null,"fixedGrade":"good","outcomes":{"good":{"narrative":"你写了七条。第七条写完你自己都犹豫了一下，但还是递了上去。","effects":[{"type":"flag","key":"head_bid_done"},{"type":"flag","key":"head_bid_approach","value":"reform"},{"type":"faction","key":"reform","value":10}]}}},{"id":"D","text":"不递。你还没准备好","reason":6,"outcomes":{"fixed":{"narrative":"你把名册还给了方砚。他没有多问，只说了句「也好」。\n\n那天晚上你在院里走了很久。苏暮寒的丹房还亮着灯——她也没递。","effects":[{"type":"flag","key":"head_bid_declined"},{"type":"relation","npc":"npc_sumuhan","favor":8,"trust":8,"note":"那年你们都没有递名帖"}]}}}]},{"id":"evt_disciple_gift","category":"teach","weight":28,"scene":"scene_mingde","actors":[],"cooldown":13,"conditions":{"role":["teacher"],"minWeek":6},"variants":[{"seed":"散课后有个弟子留了下来，手里攥着个布包，攥了半天才递过来。里面是一小罐蜜饯——山下坊市最便宜的那种。「家里寄来的，」他说，「我……我吃不完。」他显然一口都还没吃。","facts":["有弟子送了你一罐蜜饯","他自己一口没吃"]},{"seed":"案上多了一支笔。不是好笔，杆是竹的，毛也秃了小半。压在笔下的纸条只有四个字：谢教习。没有落款。你想了半天，想不出是谁——这一届你带的每个弟子，字都不长这样。","facts":["案上出现一支来历不明的旧笔","字条只有四个字，没有落款"]}],"options":[{"id":"A","text":"收下，郑重道谢","reason":14,"check":{"attr":"jiao","difficulty":30},"outcomes":{"perfect":{"narrative":"你收下了，而且很正式地道了谢——像收长辈的礼那样。他愣住了，然后耳朵一点点红起来，转身跑掉的时候差点撞到门框。\n\n那天之后他上课坐第一排。","effects":[{"type":"disciple","pick":"closest","affinity":14,"pressure":-6,"exp":40,"counts":true},{"type":"attr","key":"jiao","value":1}]},"good":{"narrative":"你收下了，道了谢。他很高兴。","effects":[{"type":"disciple","pick":"closest","affinity":8,"pressure":-3,"exp":20}]},"plain":{"narrative":"你收下了。他鞠了个躬就走了。","effects":[{"type":"disciple","pick":"random","affinity":4}]},"bad":{"narrative":"你道谢的口气太像客套。他脸上的光暗了一点。","effects":[{"type":"disciple","pick":"closest","affinity":-2}]},"terrible":{"narrative":"你正在批课业，头也没抬地说了句「放那儿吧」。等你想起来抬头，人已经不在了。\n\n那罐蜜饯在案上放了三个月。","effects":[{"type":"disciple","pick":"closest","affinity":-10,"pressure":6},{"type":"demon","value":4,"source":"guilt","note":"案上那罐放了三个月的蜜饯"}]}}},{"id":"B","text":"退回去，告诉他师徒之间不兴这个","reason":6,"check":{"attr":"xin","difficulty":45},"outcomes":{"perfect":{"narrative":"你把布包推回去，说了句：「你留着吃。等你哪天真出息了，请我喝一顿好的。」\n\n他把布包抱在怀里，用力点了点头。","effects":[{"type":"disciple","pick":"closest","affinity":10,"pressure":-4},{"type":"attr","key":"de","value":1}]},"good":{"narrative":"他有点失望，但也懂了。","effects":[{"type":"disciple","pick":"closest","affinity":3}]},"plain":{"narrative":"他把东西拿回去了。","effects":[]},"bad":{"narrative":"他抱着布包站了很久才走。你隐约觉得自己说重了。","effects":[{"type":"disciple","pick":"closest","affinity":-5}]},"terrible":{"narrative":"你把话说成了「以后别做这种事」。他应了一声「是」，从此再没在课后留下来过。","effects":[{"type":"disciple","pick":"closest","affinity":-14,"pressure":8},{"type":"demon","value":5,"source":"guilt"}]}}},{"id":"C","text":"收下，然后回赠他一样更用得上的","reason":16,"outcomes":{"fixed":{"narrative":"你收了蜜饯，转身从 方向对了。","effects":[{"type":"attr","key":"xue","value":1},{"type":"flag","key":"research_rebuilt"}]},"plain":{"narrative":"推倒了，但新的框架一时搭不起来。","effects":[]},"bad":{"narrative":"推倒之后你才发现，原来的假设虽然有问题，但至少能往前走。现在两头不着。","effects":[{"type":"demon","value":5,"source":"inferior"}]},"terrible":{"narrative":"你在书房里坐了七天。第八天，你把新稿也撕了。\n\n那一季的教学评价，是你任教以来最难看的一次。","effects":[{"type":"demon","value":10,"source":"inferior","note":"那七天"},{"type":"reputation","value":-4},{"type":"faculty","duties":-2}]}}},{"id":"B","text":"去请教苏暮寒","reason":14,"check":{"attr":"shi","difficulty":50},"outcomes":{"perfect":{"narrative":"她听你说完，沉默了很久，然后问：「你那个假设，是自己推的，还是书上抄的？」\n\n你说是书上抄的。\n\n「那就对了。」她转身从架子最高处抽下一册，「这本书写错了。一百二十年前我也照着它错过一次。」","effects":[{"type":"relation","npc":"npc_sumuhan","favor":18,"trust":18,"note":"她说一百二十年前她也错过一次"},{"type":"attr","key":"xue","value":1},{"type":"storyline","key":"rootSecret","value":8},{"type":"flag","key":"research_rebuilt"}]},"good":{"narrative":"她指出了一处关键的错。方向清楚了。","effects":[{"type":"relation","npc":"npc_sumuhan","favor":10,"trust":8},{"type":"flag","key":"research_rebuilt"}]},"plain":{"narrative":"她说这不是她的领域，帮不上。","effects":[{"type":"relation","npc":"npc_sumuhan","favor":3}]},"bad":{"narrative":"你说得太急，她皱了皱眉：「你先自己想清楚要问什么。」","effects":[{"type":"relation","npc":"npc_sumuhan","favor":-3}]},"terrible":{"narrative":"你把她的一句反问听成了嘲讽，回了一句不该回的话。她愣了一下，然后很平静地说：「那你自己慢慢想。」\n\n此后两年，你们没有再谈过学问。","effects":[{"type":"relation","npc":"npc_sumuhan","favor":-18,"trust":-15},{"type":"demon","value":8,"source":"grudge","npc":"npc_sumuhan"}]}}},{"id":"C","text":"绕过去，先把能出的成果出了","reason":-6,"outcomes":{"fixed":{"narrative":"你把有问题的那一段绕开，只写能站得住的部分。成书很快，反响也不错。\n\n只有你自己知道那本书的第四章是空的——你用了三页漂亮话把它填过去了。\n\n没有人看出来。至少目前没有。","effects":[{"type":"faculty","papers":1},{"type":"reputation","value":6},{"type":"contribution","value":120},{"type":"demon","value":8,"source":"guilt","note":"那本书的第四章"},{"type":"flag","key":"hollow_paper"}]}}}]},{"id":"evt_old_disciple_returns","category":"teach","weight":22,"scene":"scene_main_plaza","actors":[],"cooldown":999,"important":true,"conditions":{"role":["teacher"],"minWeek":90},"seed":"山门口有人在等你。\n\n是你带出去的第一届弟子里的一个，现在已经是某个宗门的执事了，身上的衣服比你的贵十倍。他见到你就跪下了，磕得很实。\n\n「教习，」他说，「我来还债。」","facts":["早年的弟子回来了","他现在已经出人头地","他说是来还债的"],"options":[{"id":"A","text":"扶起来，问他这些年过得怎么样","reason":16,"check":{"attr":"de","difficulty":35},"outcomes":{"perfect":{"narrative":"你把他扶起来，什么债不债的一句没接，只问这些年过得怎么样。\n\n他说了一个时辰。说他刚出去那两年多难，说他有次差点死在外面，说他撑不住的时候总想起你那句「不出错比出彩难」。\n\n临走他留下一箱灵石，说是给院里寒门弟子的，不许说是他给的。","effects":[{"type":"reputation","value":10},{"type":"stone","value":800,"noScale":true},{"type":"attr","key":"de","value":1},{"type":"flag","key":"old_disciple_returned"},{"type":"demon","value":-8,"source":"clear"}]},"good":{"narrative":"你们聊了很久。他走的时候留了一笔钱给院里。","effects":[{"type":"reputation","value":6},{"type":"stone","value":400,"noScale":true},{"type":"flag","key":"old_disciple_returned"}]},"plain":{"narrative":"你们聊了几句场面话。他留了礼就走了。","effects":[{"type":"reputation","value":3},{"type":"stone","value":200,"noScale":true}]},"bad":{"narrative":"你一时想不起他的名字。他看出来了，笑着说没关系。","effects":[{"type":"reputation","value":1},{"type":"demon","value":4,"source":"guilt","note":"你没能叫出他的名字"}]},"terrible":{"narrative":"你不但没想起他，还把他认成了另一届的另一个人。\n\n他愣了很久，然后说：「教习记不得也正常。」他把礼放下就走了，走得很快。","effects":[{"type":"demon","value":8,"source":"guilt","note":"山门口那次认错人"},{"type":"reputation","value":-2}]}}},{"id":"B","text":"问他能不能回来讲一堂课","reason":14,"check":{"attr":"shi","difficulty":45},"outcomes":{"perfect":{"narrative":"他讲了整整一天，讲的全是外面的事——宗门怎么坑人、契约怎么看、什么时候该跑。全院的弟子挤在门口听。\n\n这一堂课，比你讲一年都有用。散场时他对你说：「教习，我讲的这些您教不了。但您教了我别的。」","effects":[{"type":"reputation","value":12},{"type":"contribution","value":150},{"type":"disciple","pick":"random","exp":150,"affinity":8,"noScale":true},{"type":"flag","key":"old_disciple_returned"},{"type":"attr","key":"jiao","value":1}]},"good":{"narrative":"他讲了半天，弟子们听得很入神。","effects":[{"type":"reputation","value":6},{"type":"contribution","value":60},{"type":"disciple","pick":"random","exp":80},{"type" /* ===== core/rng.js — 带种子的确定性随机数 =====
 * 全局唯一实例 G.rng。所有随机必须走这里，否则存档无法复现。
 * cursor 记录已消耗步数，读档时快进即可恢复到同一随机流。
 */
(function (G) {
  'use strict';

  class RNG {
    constructor(seed, cursor) {
      this.seed = seed >>> 0 || 1;
      this.cursor = 0;
      this.s = this.seed;
      if (cursor) this.fastForward(cursor);
    }

    // xorshift32
    _raw() {
      let x = this.s;
      x ^= x << 13; x >>>= 0;
      x ^= x >>> 17;
      x ^= x << 5;  x >>>= 0;
      this.s = x;
      this.cursor++;
      return x;
    }

    fastForward(n) {
      this.s = this.seed;
      this.cursor = 0;
      for (let i = 0; i < n; i++) this._raw();
    }

    /** [0,1) */
    float() { return this._raw() / 4294967296; }

    /** 闭区间整数 [min,max] */
    int(min, max) {
      if (max < min) { const t = min; min = max; max = t; }
      return min + Math.floor(this.float() * (max - min + 1));
    }

    /** 概率命中，p 为 0-100 */
    chance(p) { return this.int(1, 100) <= p; }

    pick(arr) {
      if (!arr || !arr.length) return null;
      return arr[this.int(0, arr.length - 1)];
    }

    /** 加权抽取。items: [{...}], weightFn: item => number */
    weighted(items, weightFn) {
      const list = [];
      let total = 0;
      for (const it of items) {
        const w = Math.max(0, weightFn ? weightFn(it) : (it.weight || 1));
        if (w <= 0) continue;
        total += w;
        list.push([it, total]);
      }
      if (!list.length) return null;
      const r = this.float() * total;
      for (const [it, acc] of list) if (r < acc) return it;
      return list[list.length - 1][0];
    }

    /** 不放回抽 n 个 */
    sample(items, n, weightFn) {
      const pool = items.slice();
      const out = [];
      while (out.length < n && pool.length) {
        const picked = this.weighted(pool, weightFn);
        if (!picked) break;
        out.push(picked);
        pool.splice(pool.indexOf(picked), 1);
      }
      return out;
    }

    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = this.int(0, i);
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
  }

  G.RNG = RNG;
  G.rng = null;

  G.initRNG = function (seed, cursor) {
    G.rng = new RNG(seed, cursor || 0);
    return G.rng;
  };

})(window.G = window.G || {});

    get(path, fallback) {

        cur = cur[p];

      return cur === undefined ? fallback : cur;

    _setRaw(path, value) {
      const parts = path.split('.');
      let cur = this.current;
      for (let i = 0; i < parts.length - 1; i++) {
        if (cur[parts[i]] == null) cur[parts[i]] = {};
        cur = cur[parts[i]];
      }
      cur[parts[parts.length - 1]] = value;
    },

    /**
     * 唯一写入口。
     * delta: { path, op, value, clamp:[min,max], min, max }
     * op: set | add | push | remove | inc(等同add) | mergeFlag
     */
    commit(deltas, reason) {
      if (!deltas || !deltas.length) return [];
      const applied = [];
      const s = this.current;

      for (const d of deltas) {
        if (!d || !d.path) continue;
        const before = this.get(d.path);
        let next;

        switch (d.op || 'add') {
          case 'set':
            next = d.value;
            break;
          case 'add':
          case 'inc': {
            const base = typeof before === 'number' ? before : 0;
            next = base + (Number(d.value) || 0);
            break;
          }
          case 'push': {
            const arr = Array.isArray(before) ? before.slice() : [];
            if (!(d.unique && arr.includes(d.value))) arr.push(d.value);
            if (d.maxLen && arr.length > d.maxLen) arr.splice(0, arr.length - d.maxLen);
            next = arr;
            break;
          }
          case 'remove': {
            const arr = Array.isArray(before) ? before.slice() : [];
            const i = arr.indexOf(d.value);
            if (i >= 0) arr.splice(i, 1);
            next = arr;
            break;
          }
          default:
            next = d.value;
        }

        if (typeof next === 'number') {
          if (d.clamp) next = Math.max(d.clamp[0], Math.min(d.clamp[1], next));
          if (d.min !== undefined) next = Math.max(d.min, next);
          if (d.max !== undefined) next = Math.min(d.max, next);
          next = Math.round(next * 100) / 100;
        }

        this._setRaw(d.path, next);
        applied.push({ path: d.path, before, after: next, label: d.label });
        if (G.DEBUG_COMMIT) console.log('[commit]', reason || '', d.path, before, '→', next);
      }

      this.recalc();
      s.meta.rngCursor = G.rng ? G.rng.cursor : 0;
      this.emit('commit', { applied, reason });
      G.Save.autosave();
      return applied;
    },

    // ---------- 派生计算 ----------
    recalc() {
      const s = this.current;
      if (!s) return;

      // 属性上限
      const set = ATTR_SETS[s.player.role];
      for (const k of set.keys) {
        s.attrs[k] = Math.max(0, Math.min(set.cap, Math.round(s.attrs[k] || 0)));
      }

      // 修为溢出不自动升级 —— 升级必须走突破流程
      const c = s.cultivation;
      c.expMax = G.Cultivation.expMaxFor(c.realm, c.layer);
      if (c.exp > c.expMax) c.exp = c.expMax;
      if (c.exp < 0) c.exp = 0;
      c.demonHeart = Math.max(0, Math.min(100, c.demonHeart));

      // 关系阶段
      for (const id in s.relations) G.Relation.refreshStage(s, id);

      // 声望
      s.reputation.value = Math.max(0, Math.min(100, s.reputation.value));

      // 暗线解锁检查
      G.Storyline.check(s);
    },

    // ---------- 日志 ----------
    logLine(text, kind) {
      const s = this.current;

      if (s.log.length > 400) s.log.splice(0, s.log.length - 400);
    },

    // ---------- 事件总线 ----------
    on(fn) { this.listeners.push(fn); },
    emit(type, payload) {
      for (const fn of this.listeners) {
        try { fn(type, payload); } catch (e) { console.error('[listener]', e); }
      }
    },

    },

    realmIndex(realm) { return REALMS.findIndex(x => x.id === realm); },

    collegeOf(id) { return COLLEGES[id] || COLLEGES.jianyuan; },
